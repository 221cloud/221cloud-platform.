name: Check FutPulse editorial agent foundation

on:
  push:
    branches:
      - feature/futpulse-editorial-agent-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Validate JavaScript modules
        run: |
          node --check src/index.js
          node --check src/editorial-agent.js
          node --check src/editorial-feeds.js
      - name: Validate inline scripts and editor bundle
        run: npm run check:inline-scripts
