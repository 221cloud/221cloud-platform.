name: Check 221Cloud IDE

on:
  push:
    branches:
      - feature/ide-multi-language-selector
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-ide:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ide-multi-language-selector

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build CodeMirror language bundles
        run: npm run build:ide

      - name: Validate inline scripts and editor bundle
        run: npm run check:inline-scripts
