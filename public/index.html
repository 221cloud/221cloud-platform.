
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>221Cloud — Votre espace numérique</title>

<style>
:root {
  --bg:#080b18;
  --panel:#11182b;
  --panel2:#192440;
  --border:#283653;
  --text:#f4f7fc;
  --muted:#94a3b8;
  --blue:#438cff;
  --purple:#8b72ff;
  --green:#24d6a0;
  --red:#ff647c;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at 80% 0%,rgba(75,75,190,.13),transparent 38%),var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
button,input,select { font:inherit; }
button {
  cursor:pointer;
  border:0;
  border-radius:10px;
  padding:11px 16px;
  color:white;
  background:linear-gradient(110deg,#397fff,#6558e9);
  font-weight:600;
  transition:.2s;
}
button:hover { filter:brightness(1.12); }
button:active { transform:scale(.98); }
button:disabled { opacity:.5; cursor:not-allowed; }
input,select {
  width:100%;
  padding:12px;
  margin-top:7px;
  border:1px solid var(--border);
  border-radius:9px;
  background:#0b1222;
  color:white;
  outline:none;
}
input:focus,select:focus { border-color:var(--blue); }
label {
  display:block;
  margin-top:15px;
  color:#cbd5e1;
  font-size:14px;
}
.hidden { display:none !important; }
.muted { color:var(--muted); }
.brand {
  font-size:25px;
  font-weight:800;
  letter-spacing:-1.2px;
}
.brand span {
  background:linear-gradient(100deg,#438cff,#9b79ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.auth-screen {
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.auth-card {
  width:100%;
  max-width:420px;
  padding:28px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
}
.auth-card h1 { margin-bottom:8px; }
.auth-card button:not(.link) { width:100%; margin-top:20px; }
.auth-switch {
  margin-top:20px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}
.link {
  color:#69a4ff;
  cursor:pointer;
  background:none;
  padding:0;
}
.app { min-height:100vh; }
header {
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid rgba(104,135,190,.18);
  background:rgba(13,19,36,.94);
  backdrop-filter:blur(16px);
  position:sticky;
  top:0;
  z-index:5;
}
.layout {
  display:flex;
  min-height:calc(100vh - 68px);
}
aside {
  width:245px;
  padding:22px 14px;
  border-right:1px solid rgba(104,135,190,.16);
  background:rgba(12,18,34,.96);
  flex-shrink:0;
}
.nav-title {
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:12px;
}
.nav-btn {
  display:block;
  width:100%;
  text-align:left;
  background:transparent;
  color:#bdc9dc;
  margin-bottom:6px;
  font-weight:500;
  border-radius:10px;
}
.nav-btn.active,.nav-btn:hover {
  background:linear-gradient(100deg,rgba(57,133,255,.25),rgba(139,92,246,.13));
  color:white;
  box-shadow:inset 3px 0 #5595ff;
}
main {
  flex:1;
  padding:30px;
  min-width:0;
  max-width:1250px;
}
.page-title { font-size:26px; margin:0 0 8px; }
.page-subtitle { color:var(--muted); margin:0 0 25px; line-height:1.6; }
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:16px;
}
.card {
  background:linear-gradient(145deg,#141e34,#101729);
  border:1px solid rgba(110,140,195,.17);
  border-radius:15px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 8px 28px rgba(0,0,0,.13);
}
.card h3 { margin:0 0 10px; }
.stat {
  font-size:31px;
  font-weight:800;
  margin:12px 0 5px;
  letter-spacing:-1px;
}
.section-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin:27px 0 15px;
}
.section-head h2 { font-size:19px; margin:0; }
.item-card {
  background:linear-gradient(145deg,#141e34,#101729);
  border:1px solid rgba(110,140,195,.17);
  border-radius:13px;
  padding:18px;
  margin-bottom:12px;
}
.item-card h3 { margin:0 0 8px; overflow-wrap:anywhere; }
.item-actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}
.secondary { background:#26344c; color:#e2e8f0; }
.danger { background:#7d2639; }
.success-text { color:var(--green); }
.error-text { color:var(--red); }
.notice {
  padding:12px 14px;
  border-radius:9px;
  margin:15px 0;
  background:#172238;
  border:1px solid var(--border);
  color:#cbd5e1;
  font-size:14px;
  line-height:1.5;
}
.form-card { max-width:580px; }
.empty {
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
  background:var(--panel);
  border:1px dashed var(--border);
  border-radius:12px;
}
.status {
  display:inline-block;
  font-size:12px;
  padding:5px 9px;
  border-radius:20px;
  background:#26344c;
  color:#d5deed;
}
.status.online {
  color:#6ee7b7;
  background:#123b34;
}
.progress {
  width:100%;
  height:10px;
  background:#25324c;
  border-radius:20px;
  overflow:hidden;
  margin:12px 0;
}
.progress-bar {
  height:100%;
  width:0;
  background:linear-gradient(90deg,#3985ff,#9b72ff);
  border-radius:20px;
  transition:width .2s;
}
.file-name { overflow-wrap:anywhere; font-weight:600; }
footer {
  color:var(--muted);
  font-size:12px;
  text-align:center;
  padding:25px;
}
.dashboard-hero {
  position:relative;
  overflow:hidden;
  padding:30px;
  border-radius:18px;
  margin-bottom:22px;
  border:1px solid rgba(116,137,255,.25);
  background:
    radial-gradient(circle at 85% 20%,rgba(133,92,255,.3),transparent 35%),
    linear-gradient(120deg,#14294d,#182044 65%,#241c4b);
}
.dashboard-hero h1 {
  font-size:29px;
  margin:12px 0;
  letter-spacing:-1px;
}
.dashboard-hero p {
  color:#bdc9e2;
  margin:0;
  line-height:1.6;
}
.dashboard-kicker {
  color:#9ebcff;
  font-size:11px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
}
.stat-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.stat-icon {
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:rgba(72,130,255,.15);
  font-size:20px;
}
.shortcut {
  display:flex;
  align-items:flex-start;
  gap:14px;
}
.shortcut-icon {
  width:42px;
  height:42px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:rgba(72,130,255,.15);
  font-size:20px;
}
.shortcut p {
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin:5px 0 12px;
}
@media(max-width:700px) {
  header { padding:0 15px; }
  .layout { display:block; }
  aside {
    width:100%;
    display:flex;
    overflow-x:auto;
    padding:8px;
    border-right:0;
    border-bottom:1px solid var(--border);
  }
  .nav-title { display:none; }
  .nav-btn {
    width:auto;
    white-space:nowrap;
    flex-shrink:0;
    margin:0 4px;
    padding:10px;
  }
  main { padding:20px 15px; }
  .brand { font-size:21px; }
  .dashboard-hero { padding:23px 19px; }
  .dashboard-hero h1 { font-size:24px; }
  .stat { font-size:28px; }
}
</style>
</head>

<body>

<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="brand">221<span>Cloud</span></div>
    <p class="muted">Votre espace numérique.</p>

    <div id="loginForm">
      <h1>Connexion</h1>
      <p class="muted">Connectez-vous à votre espace.</p>
      <label>Adresse e-mail</label>
      <input id="loginEmail" type="email" placeholder="nom@exemple.com">
      <label>Mot de passe</label>
      <input id="loginPassword" type="password" placeholder="Votre mot de passe">
      <button id="loginButton" onclick="login()">Se connecter</button>
      <div class="auth-switch">
        Pas encore de compte ?
        <button class="link" onclick="showAuthForm('register')">Créer un compte</button>
      </div>
    </div>

    <div id="registerForm" class="hidden">
      <h1>Créer un compte</h1>
      <p class="muted">Rejoignez 221Cloud.</p>
      <label>Nom complet</label>
      <input id="registerName" type="text" placeholder="Votre nom">
      <label>Adresse e-mail</label>
      <input id="registerEmail" type="email" placeholder="nom@exemple.com">
      <label>Mot de passe</label>
      <input id="registerPassword" type="password" placeholder="Minimum 12 caractères">
      <button id="registerButton" onclick="register()">Créer mon compte</button>
      <div class="auth-switch">
        Déjà inscrit ?
        <button class="link" onclick="showAuthForm('login')">Se connecter</button>
      </div>
    </div>
    <div id="authMessage" class="notice hidden"></div>
  </div>
</section>

<section id="appScreen" class="app hidden">
  <header>
    <div class="brand">221<span>Cloud</span></div>
    <button class="secondary" onclick="logout()">Déconnexion</button>
  </header>

  <div class="layout">
    <aside>
      <div class="nav-title">Espace client</div>
      <button class="nav-btn active" data-page="overview" onclick="showPage('overview')">⌂ Tableau de bord</button>
      <button class="nav-btn" data-page="projects" onclick="showPage('projects')">▣ Mes projets</button>
      <button class="nav-btn" data-page="databases" onclick="showPage('databases')">▤ Bases de données</button>
      <button class="nav-btn" data-page="storage" onclick="showPage('storage')">▧ Stockage cloud</button>
      <button class="nav-btn" data-page="hosting" onclick="showPage('hosting')">◎ Hébergement</button>
      <button class="nav-btn" data-page="applications" onclick="showPage('applications')">▦ Applications</button>
      <button class="nav-btn admin-nav hidden" data-page="admin" onclick="showPage('admin')">🛡 Administration</button>
      <button class="nav-btn" data-page="account" onclick="showPage('account')">⚙ Mon compte</button>
    </aside>
    <main id="mainContent"></main>
  </div>
  <footer>221Cloud — Votre espace numérique</footer>
</section>

<script>
const API = "/api";
let currentUser = null;
let projectsCache = [];
let databasesCache = [];
let storageFilesCache = [];

const STORAGE_LIMIT_BYTES = 1024 * 1024 * 1024;
const MAX_FILE_SIZE_BYTES = 20 * 1024 * 1024;

async function api(path, options = {}) {
  const headers = { ...(options.headers || {}) };

  if (!(options.body instanceof FormData)) {
    headers["Content-Type"] = "application/json";
  }

  const response = await fetch(API + path, {
    credentials:"same-origin",
    ...options,
    headers
  });

  let data = {};
  try { data = await response.json(); } catch(e) {}

  if (!response.ok) {
    let errorMessage = data.error || data.message || "Une erreur est survenue.";

    if (data.storage_status) {
      errorMessage += " (Statut : " + data.storage_status + ")";
    }
    if (data.diagnostic) {
      errorMessage += " — Détail : " + data.diagnostic;
    }
    throw new Error(errorMessage);
  }

  return data;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function showMessage(message, type = "error") {
  const box = document.getElementById("authMessage");
  box.textContent = message;
  box.className = "notice " + (type === "success" ? "success-text" : "error-text");
  box.classList.remove("hidden");
}

function showAuthForm(form) {
  document.getElementById("loginForm").classList.toggle("hidden", form !== "login");
  document.getElementById("registerForm").classList.toggle("hidden", form !== "register");
  document.getElementById("authMessage").classList.add("hidden");
}

function setLoggedIn(user) {
  currentUser = user;

  document.getElementById("authScreen").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");

  const adminButton = document.querySelector(".admin-nav");

  if (adminButton) {
    adminButton.classList.toggle(
      "hidden",
      user.role !== "admin"
    );
  }

  showPage("overview");
}

async function register() {
  const name = document.getElementById("registerName").value.trim();
  const email = document.getElementById("registerEmail").value.trim();
  const password = document.getElementById("registerPassword").value;

  if (!name || !email || !password) {
    showMessage("Veuillez remplir tous les champs.");
    return;
  }
  if (password.length < 12) {
    showMessage("Le mot de passe doit contenir au moins 12 caractères.");
    return;
  }

  const button = document.getElementById("registerButton");
  button.disabled = true;
  button.textContent = "Création...";

  try {
    await api("/register", {
      method:"POST",
      body:JSON.stringify({
        full_name:name,
        name:name,
        email,
        password
      })
    });
    showMessage("Compte créé. Vous pouvez maintenant vous connecter.", "success");
    showAuthForm("login");
    document.getElementById("loginEmail").value = email;
  } catch(error) {
    showMessage(error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Créer mon compte";
  }
}

async function login() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  if (!email || !password) {
    showMessage("Veuillez saisir votre e-mail et votre mot de passe.");
    return;
  }

  const button = document.getElementById("loginButton");
  button.disabled = true;
  button.textContent = "Connexion...";

  try {
    const data = await api("/login", {
      method:"POST",
      body:JSON.stringify({email,password})
    });
    setLoggedIn(data.user || data);
  } catch(error) {
    showMessage(error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Se connecter";
  }
}

async function logout() {
  try {
    await api("/logout", {method:"POST",body:"{}"});
  } catch(error) {}
  currentUser = null;
  document.getElementById("appScreen").classList.add("hidden");
  document.getElementById("authScreen").classList.remove("hidden");
  showAuthForm("login");
}

async function checkSession() {
  try {
    const data = await api("/me");
    const user = data.user || data;
    if (user && user.id) setLoggedIn(user);
  } catch(error) {}
}

function showPage(page) {
  document.querySelectorAll(".nav-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.page === page);
  });

  if (page === "overview") renderOverview();
  else if (page === "projects") renderProjectsPage();
  else if (page === "databases") renderDatabasesPage();
  else if (page === "storage") renderStoragePage();
  else if (page === "hosting") renderPlaceholder("Hébergement web", "La gestion de vos hébergements sera ajoutée prochainement.");
  else if (page === "applications") renderPlaceholder("Applications", "La gestion de vos applications sera ajoutée prochainement.");
  else if (page === "account") renderAccount();
}

/* TABLEAU DE BORD */

function renderOverview() {
  const name = currentUser?.full_name || currentUser?.name || "Utilisateur";

  document.getElementById("mainContent").innerHTML = `
    <div class="dashboard-hero">
      <div class="dashboard-kicker">Votre espace numérique</div>
      <h1>Bienvenue, ${escapeHTML(name)} 👋</h1>
      <p>Gérez vos projets, vos bases de données et vos fichiers depuis un seul espace.</p>
      <div style="margin-top:20px">
        <span class="status online">● Plateforme opérationnelle</span>
      </div>
    </div>

    <div class="section-head">
      <h2>Vue d'ensemble</h2>
      <span class="muted">Votre activité 221Cloud</span>
    </div>

    <div class="grid">
      <div class="card">
        <div class="stat-top">
          <div class="muted">Mes projets</div>
          <div class="stat-icon">▣</div>
        </div>
        <div class="stat" id="projectCount">—</div>
        <div class="muted">Projets enregistrés</div>
      </div>

      <div class="card">
        <div class="stat-top">
          <div class="muted">Bases de données</div>
          <div class="stat-icon">▤</div>
        </div>
        <div class="stat" id="databaseCount">—</div>
        <div class="muted">Bases enregistrées</div>
      </div>

      <div class="card">
        <div class="stat-top">
          <div class="muted">Fichiers cloud</div>
          <div class="stat-icon">▧</div>
        </div>
        <div class="stat" id="overviewFileCount">—</div>
        <div class="muted">Fichiers sauvegardés</div>
      </div>

      <div class="card">
        <div class="stat-top">
          <div class="muted">Stockage utilisé</div>
          <div class="stat-icon">☁</div>
        </div>
        <div class="stat" id="overviewStorageUsed">—</div>
        <div class="muted" id="overviewStorageRemaining">Sur 1 Go disponible</div>
        <div class="progress">
          <div class="progress-bar" id="overviewStorageProgress"></div>
        </div>
      </div>
    </div>

    <div class="section-head">
      <h2>Accès rapides</h2>
    </div>

    <div class="grid">
      <div class="card">
        <div class="shortcut">
          <div class="shortcut-icon">▣</div>
          <div>
            <h3>Mes projets</h3>
            <p>Créez et gérez vos projets numériques.</p>
            <button onclick="showPage('projects')">Ouvrir</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="shortcut">
          <div class="shortcut-icon">▤</div>
          <div>
            <h3>Bases de données</h3>
            <p>Organisez vos espaces de données.</p>
            <button onclick="showPage('databases')">Ouvrir</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="shortcut">
          <div class="shortcut-icon">☁</div>
          <div>
            <h3>Stockage cloud</h3>
            <p>Enregistrez et gérez vos fichiers.</p>
            <button onclick="showPage('storage')">Ouvrir</button>
          </div>
        </div>
      </div>
    </div>
  `;

  loadOverviewStats();
}
async function renderAdmin() {
  const main = document.getElementById("mainContent");

  main.innerHTML = `
    <div class="dashboard-hero">
      <div class="dashboard-kicker">Administration 221Cloud</div>
      <h1>Espace administrateur 🛡</h1>
      <p>Gérez et surveillez votre plateforme.</p>
    </div>

    <div class="section-head">
      <h2>Statistiques générales</h2>
    </div>

    <div class="grid" id="adminStats">
      <div class="card">Chargement des statistiques...</div>
    </div>

    <div class="section-head">
      <h2>Utilisateurs inscrits</h2>
    </div>

    <div class="card" id="adminUsers">
      Chargement des utilisateurs...
    </div>
  `;

  try {
    const [stats, usersData] = await Promise.all([
      api("/admin/stats"),
      api("/admin/users")
    ]);

    document.getElementById("adminStats").innerHTML = `
      <div class="card">
        <div class="muted">Utilisateurs</div>
        <div class="stat">${Number(stats.users)}</div>
      </div>

      <div class="card">
        <div class="muted">Projets</div>
        <div class="stat">${Number(stats.projects)}</div>
      </div>

      <div class="card">
        <div class="muted">Bases de données</div>
        <div class="stat">${Number(stats.databases)}</div>
      </div>

      <div class="card">
        <div class="muted">Fichiers stockés</div>
        <div class="stat">${Number(stats.files)}</div>
      </div>

      <div class="card">
        <div class="muted">Stockage total utilisé</div>
        <div class="stat">${(Number(stats.storageUsed) / (1024 * 1024)).toFixed(2)} Mo</div>
      </div>
    `;

    const users = usersData.users || [];

    document.getElementById("adminUsers").innerHTML = users.length
      ? `
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse">
            <thead>
              <tr>
                <th style="text-align:left;padding:12px">Nom</th>
                <th style="text-align:left;padding:12px">Email</th>
                <th style="text-align:left;padding:12px">Rôle</th>
              </tr>
            </thead>
            <tbody>
              ${users.map(user => `
                <tr>
                  <td style="padding:12px">${escapeHTML(user.full_name || "—")}</td>
                  <td style="padding:12px">${escapeHTML(user.email)}</td>
                  <td style="padding:12px">${escapeHTML(user.role)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `
      : "Aucun utilisateur trouvé.";

  } catch (error) {
    document.getElementById("adminStats").innerHTML = `
      <div class="card">
        Impossible de charger les statistiques : ${escapeHTML(error.message)}
      </div>
    `;

    document.getElementById("adminUsers").textContent =
      "Impossible de charger les utilisateurs.";
  }
}
async function loadOverviewStats() {
  const projectElement = document.getElementById("projectCount");
  const databaseElement = document.getElementById("databaseCount");
  const fileElement = document.getElementById("overviewFileCount");
  const usedElement = document.getElementById("overviewStorageUsed");

  const results = await Promise.allSettled([
    api("/projects"),
    api("/databases"),
    api("/storage")
  ]);

  if (results[0].status === "fulfilled") {
    projectsCache = results[0].value.projects || [];
    if (projectElement) projectElement.textContent = projectsCache.length;
  } else if (projectElement) {
    projectElement.textContent = "—";
  }

  if (results[1].status === "fulfilled") {
    databasesCache = results[1].value.databases || [];
    if (databaseElement) databaseElement.textContent = databasesCache.length;
  } else if (databaseElement) {
    databaseElement.textContent = "—";
  }

  if (results[2].status === "fulfilled") {
    const data = results[2].value;
    const files = data.files || [];
    const used = Number(data.used || 0);
    const limit = Number(data.limit || STORAGE_LIMIT_BYTES);
    const percent = limit > 0 ? Math.min(100, used / limit * 100) : 0;

    if (fileElement) fileElement.textContent = files.length;
    if (usedElement) usedElement.textContent = formatBytes(used);

    const remaining = document.getElementById("overviewStorageRemaining");
    const progress = document.getElementById("overviewStorageProgress");

    if (remaining) {
      remaining.textContent = formatBytes(Math.max(0, limit - used)) + " disponibles";
    }
    if (progress) progress.style.width = percent.toFixed(1) + "%";
  } else {
    if (fileElement) fileElement.textContent = "—";
    if (usedElement) usedElement.textContent = "—";
  }
}

/* STOCKAGE CLOUD */

function formatBytes(bytes) {
  const value = Number(bytes) || 0;
  if (value < 1024) return value + " octet(s)";
  if (value < 1024 * 1024) return (value / 1024).toFixed(1) + " Ko";
  if (value < 1024 * 1024 * 1024) return (value / (1024 * 1024)).toFixed(1) + " Mo";
  return (value / (1024 * 1024 * 1024)).toFixed(2) + " Go";
}

function renderStoragePage() {
  document.getElementById("mainContent").innerHTML = `
    <h1 class="page-title">Stockage cloud</h1>
    <p class="page-subtitle">Stockez et gérez vos fichiers en toute simplicité.</p>

    <div class="grid">
      <div class="card">
        <div class="muted">Espace utilisé</div>

        <div class="progress">

        </div>
        <div class="muted" id="storagePercent">Calcul en cours...</div>
      </div>

      <div class="card">
        <div class="muted">Nombre de fichiers</div>
        <div class="stat" id="storageCount">—</div>
        <div class="muted">Fichiers enregistrés</div>

      </div>
    </div>

    <div class="card form-card">
      <h3>＋ Envoyer un fichier</h3>

      <button id="uploadButton" onclick="uploadStorageFile()">Envoyer dans le cloud</button>
      <div id="uploadMessage"></div>
    </div>

      <button class="secondary" onclick="loadStorageFiles()">Actualiser</button>
    </div>

    <div id="storageFilesList">
      <div class="empty">Chargement des fichiers...</div>
    </div>
  `;

  loadStorageFiles();
}

async function loadStorageFiles() {
  const list = document.getElementById("storageFilesList");
  if (!list) return;

  list.innerHTML = `<div class="empty">Chargement des fichiers...</div>`;

  try {
    const data = await api("/storage");
    storageFilesCache = data.files || [];

    const used = Number(data.used || 0);
    const limit = Number(data.limit || STORAGE_LIMIT_BYTES);
    const percent = limit > 0 ? Math.min(100, (used / limit) * 100) : 0;

    const usedElement = document.getElementById("storageUsed");
    const countElement = document.getElementById("storageCount");
    const progress = document.getElementById("storageProgress");
    const percentElement = document.getElementById("storagePercent");

    if (usedElement) usedElement.textContent = formatBytes(used);
    if (countElement) countElement.textContent = storageFilesCache.length;
    if (progress) progress.style.width = percent.toFixed(1) + "%";

    if (percentElement) {
      percentElement.textContent = percent.toFixed(1) + "% utilisé · " +
        formatBytes(Math.max(0, limit - used)) + " disponible";
    }

    renderStorageFiles();
  } catch(error) {
    list.innerHTML = `<div class="notice error-text">${escapeHTML(error.message)}</div>`;
  }
}

function renderStorageFiles() {
  const list = document.getElementById("storageFilesList");
  if (!list) return;

  if (!storageFilesCache.length) {
    list.innerHTML = `<div class="empty">Aucun fichier pour le moment. Envoyez votre premier fichier dans le cloud.</div>`;
    return;
  }

  list.innerHTML = storageFilesCache.map(file => `
    <div class="item-card">
      <div class="file-name">${escapeHTML(file.file_name || "Fichier sans nom")}</div>
      <p class="muted">${escapeHTML(formatBytes(file.file_size))} · ${escapeHTML(file.mime_type || "Fichier")}</p>
      <div class="muted">Ajouté le : ${escapeHTML(formatDate(file.created_at))}</div>
      <div class="item-actions">
        <button class="secondary" onclick="downloadStorageFile('${escapeHTML(file.id)}')">Télécharger</button>
        <button class="danger" onclick="deleteStorageFile('${escapeHTML(file.id)}')">Supprimer</button>
      </div>
    </div>
  `).join("");
}

async function uploadStorageFile() {
  const input = document.getElementById("storageFileInput");
  const message = document.getElementById("uploadMessage");
  const button = document.getElementById("uploadButton");
  const file = input?.files?.[0];

  if (!file) {
    message.innerHTML = `<p class="error-text">Veuillez sélectionner un fichier.</p>`;
    return;
  }

  if (file.size > MAX_FILE_SIZE_BYTES) {
    message.innerHTML = `<p class="error-text">Ce fichier dépasse la limite de 20 Mo.</p>`;
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  button.disabled = true;
  button.textContent = "Envoi en cours...";
  message.innerHTML = `<p class="muted">Envoi de ${escapeHTML(file.name)}...</p>`;

  try {
    await api("/storage/upload", {
      method:"POST",
      body:formData
    });

    message.innerHTML = `<p class="success-text">Fichier envoyé avec succès !</p>`;
    input.value = "";
    await loadStorageFiles();
  } catch(error) {
    message.innerHTML = `<p class="error-text">${escapeHTML(error.message)}</p>`;
  } finally {
    button.disabled = false;
    button.textContent = "Envoyer dans le cloud";
  }
}

async function downloadStorageFile(id) {
  try {
    const response = await fetch(
      API + "/storage/" + encodeURIComponent(id) + "/download",
      {credentials:"same-origin"}
    );

    if (!response.ok) {
      let data = {};
      try { data = await response.json(); } catch(e) {}
      throw new Error(data.error || "Impossible de télécharger ce fichier.");
    }

    const blob = await response.blob();
    const file = storageFilesCache.find(item => item.id === id);
    const fileName = file?.file_name || "fichier";

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch(error) {
    alert(error.message);
  }
}

async function deleteStorageFile(id) {
  if (!confirm("Voulez-vous vraiment supprimer ce fichier du cloud ?")) return;

  try {
    await api("/storage/" + encodeURIComponent(id), {method:"DELETE"});
    await loadStorageFiles();
  } catch(error) {
    alert(error.message);
  }
}

function formatDate(value) {
  if (!value) return "Date inconnue";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return date.toLocaleDateString("fr-FR");
}
