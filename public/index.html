function toggleProPanel(type) {
  const panels = { clients: document.getElementById("proClientsPanel") };
  const cards = { clients: document.querySelector('[aria-label="Ouvrir la rubrique clients"]') };
  const selected = panels[type];
  if (!selected) return;

  const shouldOpen = selected.classList.contains("hidden");
  Object.entries(panels).forEach(([key, panel]) => {
    if (panel) panel.classList.toggle("hidden", !(key === type && shouldOpen));
    if (cards[key]) cards[key].setAttribute("aria-expanded", String(key === type && shouldOpen));
  });

  if (shouldOpen) {
    requestAnimationFrame(() => selected.scrollIntoView({ behavior: "smooth", block: "start" }));
  }
}

async function deleteProClient(clientId, clientName) {
  const confirmed = window.confirm(
    "Mettre le client « " + clientName + " » dans la corbeille ? Vous pourrez le restaurer pendant 30 jours. Un client qui possède déjà des devis ne pourra pas être supprimé."
  );
  if (!confirmed) return;

  const message = document.getElementById("proClientDeleteMessage");
  const button = document.querySelector('button[onclick^="deleteProClient("]');
  if (button) button.disabled = true;
  if (message) message.textContent = "Déplacement vers la corbeille…";

  try {
    await api("/pro/clients/" + encodeURIComponent(clientId), { method: "DELETE" });
    await renderProClientsPage();
  } catch (error) {
    if (message) {
      message.textContent = error.message || "Impossible de supprimer ce client.";
      message.classList.add("error-text");
    } else {
      window.alert(error.message || "Impossible de supprimer ce client.");
    }
    if (button) button.disabled = false;
  }
}

function filterProClients(value) {
  const list = document.getElementById("proClientsList");
  const noResults = document.getElementById("proClientNoResults");
  if (!list) return;
  const query = String(value || "").trim().toLocaleLowerCase("fr").normalize("NFD").replace(/[\\u0300-\\u036f]/g, "");
  const cards = Array.from(list.querySelectorAll("[data-pro-client-search]"));
  let visible = 0;
  cards.forEach(card => {
    const searchable = String(card.getAttribute("data-pro-client-search") || "").toLocaleLowerCase("fr").normalize("NFD").replace(/[\\u0300-\\u036f]/g, "");
    const matches = !query || searchable.includes(query);
    card.style.display = matches ? "" : "none";
    if (matches) visible++;
  });
  if (noResults) noResults.style.display = cards.length && visible === 0 ? "" : "none";
}

async function loadProClients() {
  const list = document.getElementById("proClientsList");
  const count = document.getElementById("proClientCount");
  if (list) list.innerHTML = '<div class="empty">Chargement des clients…</div>';
  try {
    const data = await api("/pro/clients");
    const clients = Array.isArray(data.clients) ? data.clients : [];
    const quoteClient = document.getElementById("proQuoteClient");
    if (quoteClient) {
      const previousValue = quoteClient.value;
      quoteClient.innerHTML = '<option value="">Choisir un client…</option>' + clients.map(client =>
        '<option value="' + escapeHTML(client.id) + '">' + escapeHTML(client.name) + '</option>'
      ).join("");
      if (clients.some(client => client.id === previousValue)) quoteClient.value = previousValue;
      if (!clients.length) quoteClient.innerHTML = '<option value="">Ajoutez d’abord un client</option>';
    }
    if (count) count.textContent = clients.length + (clients.length > 1 ? " clients" : " client");
    if (!list) return;
    if (!clients.length) {
      list.innerHTML = '<div class="empty">Aucun client enregistré. Ajoutez votre premier client ci-dessus.</div>';
      return;
    }
    list.innerHTML = clients.map(client => `
      <div class="item-card" data-pro-client-search="${escapeHTML([client.name, client.phone, client.address].filter(Boolean).join(" "))}" role="button" tabindex="0" style="cursor:pointer" aria-label="Voir la fiche de ${escapeHTML(client.name)}" onclick="openProClientDetail('${escapeHTML(client.id)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <strong>${escapeHTML(client.name)}</strong><span class="muted">Voir la fiche →</span>
        </div>
        ${client.phone ? '<div class="muted">☎ ' + escapeHTML(client.phone) + '</div>' : ''}
        ${client.address ? '<div class="muted">📍 ' + escapeHTML(client.address) + '</div>' : ''}
      </div>
    `).join("");
  } catch (error) {
    if (list) list.innerHTML = '<div class="notice error-text">' + escapeHTML(error.message) + '</div>';
    if (quoteClient) quoteClient.innerHTML = '<option value="">Impossible de charger les clients</option>';
    if (count) count.textContent = "Indisponible";
  }
}

async function saveProClient(event) {
  event.preventDefault();
  const form = document.getElementById("proClientForm");

  const message = document.getElementById("proClientMessage");
  if (!form || !button || !message) return;
  const body = {
    name: document.getElementById("proClientName").value,
    phone: document.getElementById("proClientPhone").value,
    address: document.getElementById("proClientAddress").value,
    notes: document.getElementById("proClientNotes").value
  };

function formatProMoney(value) {

}

function collectProQuoteItems() {
  const rows = Array.from(document.querySelectorAll("#proQuoteItems [data-pro-material-row]"));
  const items = [];
  for (const row of rows) {
    const label = row.querySelector(".pro-material-label")?.value.trim() || "";
    const quantity = Number(row.querySelector(".pro-material-quantity")?.value || 0);
    const unit = row.querySelector(".pro-material-unit")?.value || "";
    const unitPrice = Number(row.querySelector(".pro-material-price")?.value || 0);
    if (!label) {
      if (quantity !== 1 || unitPrice !== 0) throw new Error("Indiquez le nom de chaque matériel renseigné.");
      continue;
    }
    if (!Number.isFinite(quantity) || quantity <= 0 || !Number.isSafeInteger(unitPrice) || unitPrice < 0) {
      throw new Error("Vérifiez la quantité et le prix unitaire de chaque matériel.");
    }
    items.push({ label, quantity, unit, unit_price: unitPrice });
  }
  return items;
}

function updateProQuoteTotal() {
  const labour = Number(document.getElementById("proQuoteLabour")?.value || 0);
  let materials = 0;
  document.querySelectorAll("#proQuoteItems [data-pro-material-row]").forEach(row => {
    const quantity = Number(row.querySelector(".pro-material-quantity")?.value || 0);
    const unitPrice = Number(row.querySelector(".pro-material-price")?.value || 0);
    const lineTotal = Number.isFinite(quantity) && quantity > 0 &&
      Number.isSafeInteger(unitPrice) && unitPrice >= 0
      ? Math.round(quantity * unitPrice) : 0;
    materials += lineTotal;
    const line = row.querySelector(".pro-material-line-total");
    if (line) line.textContent = formatProMoney(lineTotal);
  });
  const safeLabour = Number.isSafeInteger(labour) && labour >= 0 ? labour : 0;
  const materialsTotal = document.getElementById("proQuoteMaterialsTotal");
  const labourSummary = document.getElementById("proQuoteLabourSummary");
  const total = document.getElementById("proQuoteTotal");
  if (materialsTotal) materialsTotal.textContent = formatProMoney(materials);
  if (labourSummary) labourSummary.textContent = formatProMoney(safeLabour);
  if (total) total.textContent = formatProMoney(safeLabour + materials);
}

    '<div class="notice">Le solde estimé additionne les paiements des factures et les autres entrées de caisse, puis retire les dépenses et les sorties de caisse. Ne saisissez pas deux fois un paiement de facture ou une dépense déjà enregistrée.</div>' +
    '<div class="item-actions"><button type="button" onclick="renderProCashPage()">💼 Gérer la caisse</button><button type="button" class="secondary" onclick="renderProExpensesPage()">🛒 Gérer mes dépenses</button><button type="button" class="secondary" onclick="renderProInvoicesPage()">🧾 Voir mes factures</button></div>';
  const [invoiceResult, expenseResult, cashResult] = await Promise.all([
    api("/pro/invoices"),
    api("/pro/expenses"),
    api("/pro/cash")
  ]);
  proInvoicesCache = Array.isArray(invoiceResult.invoices) ? invoiceResult.invoices : [];
  const expenses = Array.isArray(expenseResult.expenses) ? expenseResult.expenses : [];
  const movements = Array.isArray(cashResult.movements) ? cashResult.movements : [];
  let total = 0, paid = 0, paidCount = 0, partialCount = 0, unpaidCount = 0;
  for (const invoice of proInvoicesCache) {
    const invoiceTotal = Math.max(0, Number(invoice.total_amount) || 0);
    const invoicePaid = Math.min(invoiceTotal, Math.max(0, Number(invoice.amount_paid) || 0));
    total += invoiceTotal;
    paid += invoicePaid;
    if (invoiceTotal > 0 && invoicePaid >= invoiceTotal) paidCount++;
    else if (invoicePaid > 0) partialCount++;
    else unpaidCount++;
  }
  const totalExpenses = expenses.reduce((sum, expense) => sum + Math.max(0, Number(expense.amount) || 0), 0);
  const cashIn = movements.filter(item => item.direction === "entree").reduce((sum, item) => sum + Math.max(0, Number(item.amount) || 0), 0);
  const cashOut = movements.filter(item => item.direction === "sortie").reduce((sum, item) => sum + Math.max(0, Number(item.amount) || 0), 0);
  const remaining = Math.max(0, total - paid);
  const afterExpenses = paid + cashIn - totalExpenses - cashOut;
  const percent = total > 0 ? Math.round((paid / total) * 100) : 0;
  document.getElementById("proFinancialReceived").textContent = formatProMoney(paid);

  document.getElementById("proFinancialPaid").textContent = formatProMoney(paid);
  document.getElementById("proFinancialRemaining").textContent = formatProMoney(remaining);
  document.getElementById("proFinancialExpenses").textContent = formatProMoney(totalExpenses);
  document.getElementById("proFinancialCashIn").textContent = formatProMoney(cashIn);
  document.getElementById("proFinancialCashOut").textContent = formatProMoney(cashOut);
  document.getElementById("proFinancialAfterExpenses").textContent = formatProMoney(afterExpenses);
  document.getElementById("proFinancialPercent").textContent = percent + " %";
  document.getElementById("proFinancialProgress").style.width = percent + "%";
  document.getElementById("proFinancialPaidCount").textContent = paidCount;
  document.getElementById("proFinancialPartialCount").textContent = partialCount;
  document.getElementById("proFinancialUnpaidCount").textContent = unpaidCount;
  document.getElementById("proFinancialInvoiceCount").textContent = proInvoicesCache.length + (proInvoicesCache.length > 1 ? " factures enregistrées" : " facture enregistrée");
}

async function loadProStock() {
  const itemsList = document.getElementById("proStockItemsList");
  if (!itemsList) return;
  try {
    const data = await api("/pro/stock");
    const items = Array.isArray(data.items) ? data.items : [];
    const movements = Array.isArray(data.movements) ? data.movements : [];
    const purchaseSelect = document.getElementById("proStockPurchaseItem");
    if (purchaseSelect) {
      purchaseSelect.innerHTML = items.length
        ? '<option value="">Choisir un matériel</option>' + items.map(item => '<option value="' + escapeHTML(item.id) + '">' + escapeHTML(item.name) + ' (' + escapeHTML(item.unit) + ')</option>').join("")
        : '<option value="">Ajoutez d’abord un article</option>';
    }
    const itemSelect = document.getElementById("proStockMovementItem");
    if (itemSelect) {
      itemSelect.innerHTML = items.length
        ? '<option value="">Choisir un matériel</option>' + items.map(item => '<option value="' + escapeHTML(item.id) + '">' + escapeHTML(item.name) + ' (' + escapeHTML(item.quantity) + ' ' + escapeHTML(item.unit) + ')</option>').join("")
        : '<option value="">Ajoutez d’abord un article</option>';
    }
    const lowItems = items.filter(item => Number(item.quantity) <= Number(item.alert_threshold));
    const count = document.getElementById("proStockCount");
    if (count) count.textContent = items.length + (items.length > 1 ? " articles" : " article");
    if (!items.length) {
      itemsList.innerHTML = '<div class="empty">Aucun article enregistré. Ajoutez votre premier matériel ci-dessus.</div>';
    } else {
      itemsList.innerHTML = (lowItems.length ? '<div class="notice">⚠️ Attention : ' + lowItems.length + (lowItems.length > 1 ? ' article(s) ont' : ' article a') + ' atteint le seuil d’alerte.</div>' : '') +
        items.map(item => {
          const low = Number(item.quantity) <= Number(item.alert_threshold);
          return '<div class="item-card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><strong>' + escapeHTML(item.name) + '</strong><strong>' + escapeHTML(item.quantity) + ' ' + escapeHTML(item.unit) + '</strong></div><div class="muted" style="margin-top:7px">Seuil d’alerte : ' + escapeHTML(item.alert_threshold) + ' ' + escapeHTML(item.unit) + (low ? ' · <span class="error-text">Stock faible</span>' : '') + '</div></div>';
        }).join("");
    }
    const movementCount = document.getElementById("proStockMovementCount");
    const movementList = document.getElementById("proStockMovementsList");
    if (movementCount) movementCount.textContent = movements.length + (movements.length > 1 ? " mouvements" : " mouvement");
    if (movementList) {
      movementList.innerHTML = movements.length ? movements.map(item => {
        const incoming = item.direction === "entree";
        return '<div class="item-card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><strong>' + escapeHTML(item.item_name) + '</strong><strong class="' + (incoming ? 'success-text' : '') + '">' + (incoming ? '+' : '−') + escapeHTML(item.quantity) + ' ' + escapeHTML(item.unit) + '</strong></div><div class="muted" style="margin-top:7px">' + escapeHTML(incoming ? "Entrée" : "Sortie") + ' · ' + escapeHTML(item.description || "Sans description") + ' · ' + escapeHTML(formatDate(item.movement_date)) + '</div></div>';
      }).join("") : '<div class="empty">Aucun mouvement enregistré pour le moment.</div>';
    }
  } catch (error) {
    itemsList.innerHTML = '<div class="notice error-text">' + escapeHTML(error.message || "Impossible de charger le stock.") + '</div>';
  }
}

    `;
  }).join("");

async function updateProInvoicePayment(invoiceId) {
  const invoice = proInvoicesCache.find(item => item.id === invoiceId);
  if (!invoice) {
    alert("Facture introuvable. Actualisez la page puis réessayez.");
    return;
  }

  const currentPaid = Number(invoice.amount_paid) || 0;
  const rawAmount = window.prompt(
    "Quel est le montant total déjà reçu pour cette facture ?\nTotal : " +
    formatProMoney(invoice.total_amount) + "\nDéjà reçu : " + formatProMoney(currentPaid) +
    "\nSaisissez le montant cumulé reçu en FCFA :",
    String(currentPaid)
  );
  if (rawAmount === null) return;

  const amountPaid = Number(String(rawAmount).trim());
  const totalAmount = Number(invoice.total_amount);
  if (!Number.isSafeInteger(amountPaid) || amountPaid < 0 || amountPaid > totalAmount) {
    alert("Montant invalide. Saisissez un nombre entier entre 0 et " + totalAmount + " FCFA.");
    return;
  }

  const remaining = totalAmount - amountPaid;
  const statusLabel = amountPaid === totalAmount
    ? "Payée"
    : amountPaid > 0 ? "Partiellement payée" : "À payer";
  if (!window.confirm(
    "Confirmer le paiement ?\nDéjà reçu : " + formatProMoney(amountPaid) +
    "\nReste à recevoir : " + formatProMoney(remaining) +
    "\nStatut : " + statusLabel
  )) return;

  try {
    await api("/pro/invoices/" + encodeURIComponent(invoiceId), {
      method: "PATCH",
      body: JSON.stringify({ amount_paid: amountPaid })
    });
    await renderProInvoicesPage();
  } catch (error) {
    alert(error.message || "Impossible d'enregistrer le paiement.");
  }
}

  const rows = items.length ? items.map((item,index) =>
    '<tr><td>' + (index+1) + '</td><td>' + escapeHTML(item.label) + '</td><td>' +

async function deleteProQuote(quoteId) {
  const quote = proQuotesCache.find(item => item.id === quoteId);
  if (!quote || quote.status !== "draft") {
    alert("Seuls les devis en brouillon peuvent être supprimés.");
    return;
  }

  const clientName = quote.client_name || "ce client";
  const confirmed = confirm(
    "Voulez-vous vraiment supprimer le brouillon de " + clientName +
    " ?\n\nCette action supprimera aussi le détail des matériaux. Elle est définitive."
  );
  if (!confirmed) return;

  try {
    await api("/pro/quotes/" + encodeURIComponent(quoteId), { method: "DELETE" });
    if (proEditingQuoteId === quoteId) cancelProQuoteEdit();
    await loadProQuotes();
    const message = document.getElementById("proQuoteMessage");
    if (message) message.textContent = "Le brouillon a été supprimé.";
  } catch (error) {
    alert(error.message || "Impossible de supprimer ce devis.");
  }
}

function editProQuote(quoteId) {
  const quote = proQuotesCache.find(item => item.id === quoteId);
  if (!quote || quote.status !== "draft") { alert("Ce devis n'est pas disponible pour modification."); return; }
  const form = document.getElementById("proQuoteForm");
  const client = document.getElementById("proQuoteClient");
  const description = document.getElementById("proQuoteDescription");
  const labour = document.getElementById("proQuoteLabour");
  const rows = document.getElementById("proQuoteItems");
  const save = document.getElementById("proQuoteSave");
  const cancel = document.getElementById("proQuoteCancelEdit");
  const message = document.getElementById("proQuoteMessage");
  if (!form || !client || !description || !labour || !rows || !save) return;
  proEditingQuoteId = quote.id;
  client.value = quote.client_id;
  description.value = quote.description || "";
  labour.value = String(quote.labour_amount || 0);
  rows.innerHTML = "";
  const items = Array.isArray(quote.items) ? quote.items : [];
  if (items.length) {
    items.forEach(item => {
      addProMaterialRow();
      const row = rows.lastElementChild;
      row.querySelector(".pro-material-label").value = item.label || "";
      row.querySelector(".pro-material-quantity").value = String(item.quantity ?? 1);
      row.querySelector(".pro-material-unit").value = item.unit || "Pièce";
      row.querySelector(".pro-material-price").value = String(item.unit_price ?? 0);
    });
  } else { addProMaterialRow(); }
  save.textContent = "Enregistrer les modifications";
  if (cancel) cancel.classList.remove("hidden");
  if (message) message.textContent = "Modifiez les informations, puis enregistrez le brouillon.";
  updateProQuoteTotal();
  form.scrollIntoView({ behavior: "smooth", block: "start" });
}

function cancelProQuoteEdit() {
  const form = document.getElementById("proQuoteForm");
  const rows = document.getElementById("proQuoteItems");
  const save = document.getElementById("proQuoteSave");
  const cancel = document.getElementById("proQuoteCancelEdit");
  const message = document.getElementById("proQuoteMessage");
  proEditingQuoteId = null;
  if (form) form.reset();
  if (rows) { rows.innerHTML = ""; addProMaterialRow(); }
  if (save) save.textContent = "＋ Enregistrer le devis en brouillon";
  if (cancel) cancel.classList.add("hidden");
  if (message) message.textContent = "Modification annulée.";
  updateProQuoteTotal();
}

async function saveProQuote(event) {
  event.preventDefault();
  const form = document.getElementById("proQuoteForm");
  const button = document.getElementById("proQuoteSave");
  const message = document.getElementById("proQuoteMessage");
  if (!form || !button || !message) return;

  let items;
  try {
    items = collectProQuoteItems();
  } catch (error) {
    message.textContent = error.message;
    return;
  }
  const body = {
    client_id: document.getElementById("proQuoteClient").value,
    description: document.getElementById("proQuoteDescription").value.trim(),
    labour_amount: Number(document.getElementById("proQuoteLabour").value || 0),
    items
  };
  if (!Number.isSafeInteger(body.labour_amount) || body.labour_amount < 0) {
    message.textContent = "Vérifiez le montant de la main-d'œuvre en FCFA.";
    return;
  }

  button.disabled = true;
  message.textContent = "Enregistrement du brouillon…";
  try {
    const editingId = proEditingQuoteId;
    await api(editingId ? "/pro/quotes/" + encodeURIComponent(editingId) : "/pro/quotes", {
      method: editingId ? "PATCH" : "POST", body: JSON.stringify(body)
    });
    proEditingQuoteId = null;
    proQuoteDraftState = null;
    form.reset();
    const materialRows = document.getElementById("proQuoteItems");
    if (materialRows) {
      materialRows.innerHTML = "";
      addProMaterialRow();
    }
    updateProQuoteTotal();
    const cancelButton = document.getElementById("proQuoteCancelEdit");
    if (cancelButton) cancelButton.classList.add("hidden");
    button.textContent = "＋ Enregistrer le devis en brouillon";
    message.textContent = editingId ? "Devis modifié." : "Devis enregistré en brouillon.";
    await loadProQuotes();
  } catch (error) {
    message.textContent = error.message || "Impossible d'enregistrer le devis.";
  } finally {
    button.disabled = false;
  }
}

async function loadApplications() {
  const list = document.getElementById("applicationsList");
  if (!list) return;

  list.innerHTML = `<div class="empty">Chargement des applications...</div>`;

  try {
    const data = await api("/projects");
    projectsCache = Array.isArray(data.projects) ? data.projects : [];
    renderApplications(projectsCache.filter(project => project.type === "application"));
  } catch (error) {
    list.innerHTML = `<div class="notice error-text">${escapeHTML(error.message)}</div>`;
    const total = document.getElementById("applicationTotal");
    if (total) total.textContent = "Indisponible";
  }
}

function renderApplications(applications) {
  const list = document.getElementById("applicationsList");
  const total = document.getElementById("applicationTotal");
  if (!list) return;

  if (total) total.textContent = applications.length + " application(s)";

  if (!applications.length) {
    list.innerHTML = `
      <div class="empty">
        <h3>Aucune application pour le moment</h3>
        <p>Créez votre première application avec le formulaire ci-dessus.</p>
      </div>
    `;
    return;
  }

  list.innerHTML = applications.map(application => {
    const status = application.status === "active"
      ? "Active"
      : application.status === "deployed"
        ? "Déployée"
        : application.status === "pending"
          ? "En préparation"
          : (application.status || "En préparation");

    return `
      <div class="item-card">
        <div class="storage-file-heading">
          <div class="storage-file-icon">▦</div>
          <div class="storage-file-details">
            <h3>${escapeHTML(application.name)}</h3>
            <div class="muted">Application 221Cloud</div>
          </div>

async function createApplication() {
  const input = document.getElementById("applicationName");
  const message = document.getElementById("applicationMessage");
  const button = document.getElementById("createApplicationButton");
  const name = input?.value.trim();

  if (!name) {
    message.innerHTML = `<p class="error-text">Saisissez le nom de l'application.</p>`;
    return;
  }

  button.disabled = true;
  button.textContent = "Création...";

  try {
    await api("/projects", {
      method: "POST",
      body: JSON.stringify({ name, type: "application" })
    });
    input.value = "";
    message.innerHTML = `<p class="success-text">Application créée avec succès.</p>`;
    await loadApplications();
  } catch (error) {
    message.innerHTML = `<p class="error-text">${escapeHTML(error.message)}</p>`;
  } finally {
    button.disabled = false;
    button.textContent = "Créer l'application";
  }
}

async function renameApplication(id) {
  const application = projectsCache.find(item => item.id === id && item.type === "application");
  if (!application) return;

  const name = prompt("Nouveau nom de l'application :", application.name);
  if (name === null) return;
  if (!name.trim()) {
    alert("Le nom ne peut pas être vide.");
    return;
  }

  try {
    await api("/projects/" + encodeURIComponent(id), {
      method: "PATCH",
      body: JSON.stringify({ name: name.trim(), type: "application" })
    });
    await loadApplications();
  } catch (error) {
    alert(error.message);
  }
}

async function moveApplicationToTrash(id) {
  const application = projectsCache.find(item => item.id === id && item.type === "application");
  if (!application) return;

  if (!confirm("Placer l'application « " + application.name + " » dans la corbeille ? Ses données et éléments associés seront conservés et le projet pourra être restauré depuis Mes projets.")) return;

  try {
    const result = await api("/projects/" + encodeURIComponent(id), { method: "DELETE" });
    alert(result.message || "Application placée dans la corbeille.");
    await loadApplications();
  } catch (error) {
    alert(error.message);
  }
}

async function loadApplicationDatabaseConnection() {

    ]);

async function saveApplicationDatabasePermissions() {
  if (!applicationEditorState) return;
  const list = document.getElementById("applicationDatabasePermissionsList");
  const button = document.getElementById("saveApplicationDatabasePermissionsButton");
  const status = document.getElementById("applicationDatabasePermissionsStatus");
  if (!list || !button || button.disabled) return;
  const previousText = button.textContent;
  button.disabled = true;

  if (status) status.textContent = "Enregistrement des réglages...";
  try {
    const permissionsByTable = new Map();
    list.querySelectorAll('input[type="checkbox"][data-table-id]').forEach(input => {
      const tableId = input.getAttribute("data-table-id");
      if (!permissionsByTable.has(tableId)) {
        permissionsByTable.set(tableId, { table_id: tableId, read: false, create: false, update: false, delete: false });
      }
      permissionsByTable.get(tableId)[input.getAttribute("data-permission")] = input.checked;
    });
    const result = await api("/projects/" + encodeURIComponent(applicationEditorState.projectId) + "/application-database-permissions", {
      method: "PUT",
      body: JSON.stringify({ permissions: Array.from(permissionsByTable.values()) })
    });

  } catch (error) {
    if (status) status.textContent = error.message;
  } finally {
    button.disabled = false;
    button.textContent = previousText;
  }
}


function getApplicationEditorSearchMatches(value, query) {
  const matches = [];
  if (!query) return matches;
  const source = value.toLocaleLowerCase();
  const needle = query.toLocaleLowerCase();
  let position = 0;
  while ((position = source.indexOf(needle, position)) !== -1) {
    matches.push({ start: position, end: position + query.length });
    position += Math.max(1, query.length);
  }
  return matches;
}

  const input = document.getElementById("applicationSearchInput");
  const status = document.getElementById("applicationSearchStatus");
  const editor = document.getElementById("applicationCodeEditor");

  const query = input.value;
  if (!query) {
    status.textContent = "Saisissez un terme pour lancer la recherche.";
    return;
  }
  const count = getApplicationEditorSearchMatches(editor.value, query).length;
  status.textContent = count + " résultat(s) dans le fichier ouvert.";
}

function findApplicationEditorMatch(direction = 1) {
  const input = document.getElementById("applicationSearchInput");
  const status = document.getElementById("applicationSearchStatus");
  const editor = document.getElementById("applicationCodeEditor");
  if (!input || !editor || !input.value) {
    if (status) status.textContent = "Saisissez un terme à rechercher.";
    return;
  }
  const matches = getApplicationEditorSearchMatches(editor.value, input.value);
  if (!matches.length) {
    if (status) status.textContent = "Aucun résultat trouvé.";
    return;
  }
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  let match;
  if (direction < 0) {
    match = [...matches].reverse().find(item => item.end <= start) || matches[matches.length - 1];
  } else {
    match = matches.find(item => item.start >= (end > start ? end : start)) || matches[0];
  }
  editor.focus();
  editor.setSelectionRange(match.start, match.end);
  if (status) {
    const index = matches.findIndex(item => item.start === match.start);
    status.textContent = "Résultat " + (index + 1) + " sur " + matches.length + ".";
  }
}

function replaceApplicationEditorMatch() {
  const input = document.getElementById("applicationSearchInput");
  const replacement = document.getElementById("applicationReplaceInput");
  const editor = document.getElementById("applicationCodeEditor");
  const status = document.getElementById("applicationSearchStatus");
  if (!input || !replacement || !editor || !input.value) {
    if (status) status.textContent = "Saisissez un terme à rechercher.";
    return;
  }
  const selected = editor.value.slice(editor.selectionStart, editor.selectionEnd);
  if (selected.toLocaleLowerCase() !== input.value.toLocaleLowerCase()) {
    findApplicationEditorMatch(1);
    return;
  }
  editor.setRangeText(replacement.value, editor.selectionStart, editor.selectionEnd, "end");
  updateApplicationEditorDecorations();
  if (applicationEditorState && applicationEditorState.activeFile) {
    applicationEditorState.files[applicationEditorState.activeFile] = editor.value;
  }
  updateApplicationSearchStatus();
  findApplicationEditorMatch(1);
}

function replaceAllApplicationEditorMatches() {
  const input = document.getElementById("applicationSearchInput");
  const replacement = document.getElementById("applicationReplaceInput");
  const editor = document.getElementById("applicationCodeEditor");
  const status = document.getElementById("applicationSearchStatus");
  if (!input || !replacement || !editor || !input.value) {
    if (status) status.textContent = "Saisissez un terme à rechercher.";
    return;
  }
  const matches = getApplicationEditorSearchMatches(editor.value, input.value);
  if (!matches.length) {
    if (status) status.textContent = "Aucun résultat à remplacer.";
    return;
  }
  const source = editor.value;
  const lowerSource = source.toLocaleLowerCase();
  const needle = input.value.toLocaleLowerCase();
  let output = "";
  let cursor = 0;
  let position;
  while ((position = lowerSource.indexOf(needle, cursor)) !== -1) {
    output += source.slice(cursor, position) + replacement.value;
    cursor = position + input.value.length;
  }
  editor.value = output + source.slice(cursor);
  editor.setSelectionRange(0, 0);
  updateApplicationEditorDecorations();
  if (applicationEditorState && applicationEditorState.activeFile) {
    applicationEditorState.files[applicationEditorState.activeFile] = editor.value;
  }
  if (status) status.textContent = matches.length + " remplacement(s) effectué(s). Pensez à enregistrer.";
}

    const start = editor.selectionStart;
    const end = editor.selectionEnd;

    if (start === end && !event.shiftKey) {
      editor.setRangeText("    ", start, end, "end");
      updateApplicationEditorDecorations();
      return;
    }

    const firstLineStart = value.lastIndexOf("\n", start - 1) + 1;
    const lastLineStart = value.lastIndexOf("\n", Math.max(start, end - 1)) + 1;
    const nextLineBreak = value.indexOf("\n", lastLineStart);
    const blockEnd = nextLineBreak === -1 ? value.length : nextLineBreak;
    const lines = value.slice(firstLineStart, blockEnd).split("\n");
    let lineOffset = firstLineStart;
    let startAdjustment = 0;
    let endAdjustment = 0;

    const updatedLines = lines.map(line => {
      const currentLineStart = lineOffset;
      lineOffset += line.length + 1;

      if (event.shiftKey) {
        const removed = line.startsWith("\t") ? 1 : ((line.match(/^ {1,4}/) || [""])[0].length);
        if (currentLineStart < start) startAdjustment += removed;
        if (currentLineStart < end) endAdjustment += removed;
        return line.slice(removed);
      }

      if (currentLineStart <= start) startAdjustment += 4;
      if (currentLineStart < end) endAdjustment += 4;
      return "    " + line;
    });

    editor.value = value.slice(0, firstLineStart) + updatedLines.join("\n") + value.slice(blockEnd);
    editor.setSelectionRange(
      Math.max(firstLineStart, start + (event.shiftKey ? -startAdjustment : startAdjustment)),
      Math.max(firstLineStart, end + (event.shiftKey ? -endAdjustment : endAdjustment))
    );
    updateApplicationEditorDecorations();
    return;
  }

  if (event.key === "Enter") {
    event.preventDefault();
    const value = editor.value;
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const lineStart = value.lastIndexOf("\n", start - 1) + 1;
    const linePrefix = value.slice(lineStart, start);
    const indentation = (linePrefix.match(/^[\t ]*/) || [""])[0];
    const trimmedPrefix = linePrefix.trimEnd();
    const extraIndentation = /[\{\[\(]$/.test(trimmedPrefix) ? "    " : "";
    editor.setRangeText("\n" + indentation + extraIndentation, start, end, "end");
    updateApplicationEditorDecorations();
  }
}

async function loadApplicationPublication() {

  const status = document.getElementById("applicationPublicationStatus");

async function publishApplication() {
  if (!applicationEditorState) return;
  const editor = document.getElementById("applicationCodeEditor");
  if (editor) applicationEditorState.files[applicationEditorState.activeFile] = editor.value;
  const changedFiles = Object.keys(applicationEditorState.files).filter(fileName =>
    applicationEditorState.files[fileName] !== applicationEditorState.savedFiles[fileName]
  );
  if (changedFiles.length) {
    alert("Enregistrez d'abord vos modifications avant de publier. Fichiers modifiés : " + changedFiles.join(", "));
    return;
  }
  const confirmed = confirm("Publier la dernière version enregistrée de cette application ? Si elle est déjà en ligne, la nouvelle version remplacera la version active. Les versions publiées précédentes resteront conservées.");
  if (!confirmed) return;
  const button = document.getElementById("publishApplicationButton");
  const status = document.getElementById("applicationPublicationStatus");
  const previousButtonText = button ? button.textContent : "Publier l'application";
  if (button) {
    button.disabled = true;
    button.textContent = "Publication...";
  }
  if (status) status.textContent = "Préparation de la publication...";
  try {
    const result = await api("/projects/" + encodeURIComponent(applicationEditorState.projectId) + "/application-publication", {
      method: "POST",
      body: JSON.stringify({})
    });
    if (status) status.textContent = result.message + " · Version " + Number(result.publication.version_number);

    if (status) status.textContent = error.message;

async function renameApplicationItem(itemType, itemPath) {
  if (!applicationEditorState || applicationEditorState.saving) return;
  const affectedPaths = Object.keys(applicationEditorState.files).filter(name =>
    itemType === "file" ? name === itemPath : name === itemPath || name.startsWith(itemPath + "/")
  );
  const unsavedPaths = affectedPaths.filter(name =>
    applicationEditorState.files[name] !== applicationEditorState.savedFiles[name]
  );
  if (unsavedPaths.length) {
    alert("Enregistrez d'abord les modifications non sauvegardées dans : " + unsavedPaths.join(", "));
    return;
  }
  const newPathInput = prompt(
    itemType === "folder" ? "Nouveau chemin du dossier :" : "Nouveau chemin du fichier :",
    itemPath
  );
  if (newPathInput === null) return;
  const newPath = newPathInput.trim();
  if (!newPath || newPath === itemPath) return;
  if (!confirm("Renommer « " + itemPath + " » en « " + newPath + " » ?")) return;

  const activeFile = applicationEditorState.activeFile;
  const nextActiveFile = itemType === "file"
    ? (activeFile === itemPath ? newPath : activeFile)
    : (activeFile === itemPath || activeFile.startsWith(itemPath + "/")
      ? newPath + activeFile.slice(itemPath.length)
      : activeFile);

  try {
    await api("/projects/" + encodeURIComponent(applicationEditorState.projectId) + "/application-items/rename", {
      method: "POST",
      body: JSON.stringify({ item_type: itemType, old_path: itemPath, new_path: newPath })
    });
    await refreshApplicationFileList(nextActiveFile);
    const status = document.getElementById("applicationSaveStatus");
    if (status) status.textContent = "Élément renommé : " + itemPath + " → " + newPath;
  } catch (error) {
    alert(error.message);
  }
}

async function moveApplicationItemToTrash(itemType, itemPath) {
  if (!applicationEditorState || applicationEditorState.saving) return;
  const unsavedPaths = Object.keys(applicationEditorState.files).filter(name =>
    applicationEditorState.files[name] !== applicationEditorState.savedFiles[name] &&
    (itemType === "file" ? name === itemPath : name === itemPath || name.startsWith(itemPath + "/"))
  );
  if (unsavedPaths.length) { alert("Enregistrez d'abord les modifications non sauvegardées dans : " + unsavedPaths.join(", ")); return; }
  const label = itemType === "folder" ? "le dossier et tout son contenu" : "ce fichier";
  if (!confirm("Placer " + label + " « " + itemPath + " » dans la corbeille ? Le contenu et l'historique seront conservés et pourront être restaurés.")) return;
  try {
    await api("/projects/" + encodeURIComponent(applicationEditorState.projectId) + "/application-items/trash", {
      method: "POST", body: JSON.stringify({ item_type: itemType, path: itemPath })
    });
    await refreshApplicationFileList();
    const panel = document.getElementById("applicationTrashPanel");
    if (panel && !panel.hidden) await loadApplicationTrash();
    const status = document.getElementById("applicationSaveStatus");
    if (status) status.textContent = "Élément placé dans la corbeille : " + itemPath;
  } catch (error) { alert(error.message); }
}
async function restoreApplicationTrashItem(trashId) {
  if (!applicationEditorState || applicationEditorState.saving) return;
  if (hasUnsavedApplicationChanges()) { alert("Enregistrez ou abandonnez vos modifications avant de restaurer un élément."); return; }
  if (!confirm("Restaurer cet élément à son emplacement d'origine ? Son contenu et son historique seront réintégrés dans l'explorateur.")) return;
  try {
    await api("/projects/" + encodeURIComponent(applicationEditorState.projectId) + "/application-trash/" + encodeURIComponent(trashId) + "/restore", {

    });
    await refreshApplicationFileList();
    await loadApplicationTrash();
    const status = document.getElementById("applicationSaveStatus");
    if (status) status.textContent = "Élément restauré avec son historique.";
  } catch (error) { alert(error.message); }
}

function renderApplicationFileTree() {
  if (!applicationEditorState) return;
  const container = document.getElementById("applicationFileTree");
  if (!container) return;

  const root = { folders: {}, files: [] };
  const ensureFolder = (parent, name) => {
    if (!parent.folders[name]) parent.folders[name] = { folders: {}, files: [] };
    return parent.folders[name];
  };

  (applicationEditorState.directories || []).forEach(directoryPath => {
    const parts = String(directoryPath).split("/").filter(Boolean);
    let node = root;
    parts.forEach(part => { node = ensureFolder(node, part); });
  });

  Object.keys(applicationEditorState.files || {}).sort().forEach(filePath => {
    const parts = filePath.split("/").filter(Boolean);
    if (!parts.length) return;
    let node = root;
    parts.slice(0, -1).forEach(part => { node = ensureFolder(node, part); });
    node.files.push({ name: parts[parts.length - 1], path: filePath });
  });

  const renderNode = (node, prefix = "") => {
    const folders = Object.keys(node.folders).sort().map(name => {
      const path = prefix ? prefix + "/" + name : name;
      return "<details class=\"application-tree-folder\" open><summary>📁 " + escapeHTML(name) +
        " <button type=\"button\" class=\"secondary\" style=\"padding:5px 8px;font-size:11px;margin-left:5px\" onclick=\"event.preventDefault();event.stopPropagation();renameApplicationItem('folder'," + escapeJSAttribute(path) + ")\">Renommer</button>" +
        " <button type=\"button\" class=\"secondary\" style=\"padding:5px 8px;font-size:11px\" onclick=\"event.preventDefault();event.stopPropagation();moveApplicationItemToTrash('folder'," + escapeJSAttribute(path) + ")\">Corbeille</button></summary>" +
        "<div class=\"application-tree-children\">" + renderNode(node.folders[name], path) + "</div></details>";
    }).join("");
    const files = node.files.map(file => {
      const active = applicationEditorState.activeFile === file.path;
      const modified = applicationEditorState.files[file.path] !== applicationEditorState.savedFiles[file.path];
      return "<button type=\"button\" class=\"application-tree-file " + (active ? "active" : "") +
        "\" onclick=\"selectApplicationEditorFile(" + escapeJSAttribute(file.path) + ")\">" +
        "📄 " + escapeHTML(file.name) + (modified ? " <span aria-label=\"Modifications non enregistrées\">●</span>" : "") +
        "</button><button type=\"button\" class=\"secondary\" style=\"padding:6px 9px;font-size:11px;margin:3px 4px 3px 0\" onclick=\"renameApplicationItem('file'," + escapeJSAttribute(file.path) + ")\">Renommer</button>" +
        "<button type=\"button\" class=\"secondary\" style=\"padding:6px 9px;font-size:11px;margin:3px 0\" onclick=\"moveApplicationItemToTrash('file'," + escapeJSAttribute(file.path) + ")\">Corbeille</button>";
    }).join("");
    return folders + files;
  };

  const treeHTML = renderNode(root);
  container.innerHTML = treeHTML || "<p class=\"muted\">Aucun fichier. Créez votre premier fichier avec « Nouveau fichier ».</p>";
}


async function mountApplicationCodeMirrorEditor() {
  const editor = document.getElementById("applicationCodeEditor");
  const host = document.getElementById("applicationCodeMirrorHost");
  if (!editor || !host || !applicationCodeMirrorEnabled || !window.CloudIDE221) return null;
  const mountToken = ++applicationCodeMirrorMountToken;
  if (applicationCodeMirrorInstance) applicationCodeMirrorInstance.destroy();
  applicationCodeMirrorInstance = null;
  const nextInstance = await window.CloudIDE221.mountEditor({
    host,
    value: editor.value,
    fileName: applicationEditorState?.activeFile || "",
    readOnly: Boolean(applicationEditorState?.saving || applicationEditorState?.restoring),
    onChange: value => {
      editor.value = value;
      if (applicationEditorState && applicationEditorState.activeFile) applicationEditorState.files[applicationEditorState.activeFile] = value;
      const stats = document.getElementById("applicationEditorStats");
      if (stats) stats.textContent = value.split("\n").length + " ligne(s) · " + value.length + " caractère(s)";
    }
  });
  if (mountToken !== applicationCodeMirrorMountToken || !applicationCodeMirrorEnabled) {
    nextInstance.destroy();
    return null;
  }
  applicationCodeMirrorInstance = nextInstance;
  applicationCodeMirrorInstance.setReadOnly(Boolean(applicationEditorState?.saving || applicationEditorState?.restoring));
  return applicationCodeMirrorInstance;
}

async function toggleApplicationCodeMirror(forceEnabled) {
  const editor = document.getElementById("applicationCodeEditor");
  const host = document.getElementById("applicationCodeMirrorHost");
  const button = document.getElementById("applicationCodeMirrorToggle");
  const highlight = document.getElementById("applicationEditorHighlight");
  const lineNumbers = document.getElementById("applicationEditorLineNumbers");
  const completions = document.getElementById("applicationEditorCompletions");
  const legacyCompletions = document.getElementById("applicationLegacyCompletionButton");
  const searchPanel = document.getElementById("applicationEditorSearchPanel");
  if (!editor || !host) return;
  const enable = typeof forceEnabled === "boolean" ? forceEnabled : !applicationCodeMirrorEnabled;

  if (!enable) {
    applicationCodeMirrorMountToken++;
    if (applicationCodeMirrorInstance) {
      editor.value = applicationCodeMirrorInstance.getValue();
      if (applicationEditorState && applicationEditorState.activeFile) applicationEditorState.files[applicationEditorState.activeFile] = editor.value;
      applicationCodeMirrorInstance.destroy();
    }
    applicationCodeMirrorInstance = null;
    applicationCodeMirrorEnabled = false;
    host.hidden = true;
    editor.hidden = false;
    if (highlight) highlight.hidden = false;
    if (lineNumbers) lineNumbers.hidden = false;
    if (legacyCompletions) legacyCompletions.hidden = false;
    if (searchPanel) searchPanel.hidden = false;
    if (button) button.textContent = "Essayer CodeMirror";
    if (completions) completions.hidden = true;
    updateApplicationEditorDecorations();
    return;
  }

  try {
    if (!window.CloudIDE221) {
      if (!applicationCodeMirrorLoader) {
        applicationCodeMirrorLoader = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.type = "module";
          script.src = "/assets/ide-editor/main.js?v=20261125-2";
          script.async = true;
          script.onload = () => window.CloudIDE221 ? resolve(window.CloudIDE221) : reject(new Error("Le module CodeMirror n’a pas été initialisé."));
          script.onerror = () => reject(new Error("Impossible de charger CodeMirror. Vérifiez votre connexion puis réessayez."));
          document.head.appendChild(script);
        });
      }
      await applicationCodeMirrorLoader;
    }
    applicationCodeMirrorEnabled = true;
    editor.hidden = true;
    host.hidden = false;
    if (highlight) highlight.hidden = true;
    if (lineNumbers) lineNumbers.hidden = true;
    if (legacyCompletions) legacyCompletions.hidden = true;
    if (searchPanel) searchPanel.hidden = true;
    if (completions) completions.hidden = true;
    const mounted = await mountApplicationCodeMirrorEditor();
    if (!mounted) throw new Error("Le nouvel éditeur n’a pas pu être initialisé.");
    if (button) button.textContent = "Revenir à l’éditeur classique";
    const status = document.getElementById("applicationSaveStatus");
    if (status) status.textContent = "CodeMirror activé. Les modifications restent synchronisées avec la sauvegarde habituelle.";
  } catch (error) {
    applicationCodeMirrorLoader = null;
    applicationCodeMirrorEnabled = false;
    host.hidden = true;
    editor.hidden = false;
    if (highlight) highlight.hidden = false;
    if (lineNumbers) lineNumbers.hidden = false;
    if (legacyCompletions) legacyCompletions.hidden = false;
    if (searchPanel) searchPanel.hidden = false;
    if (button) button.textContent = "Réessayer CodeMirror";
    const status = document.getElementById("applicationSaveStatus");
    if (status) status.textContent = error.message || "CodeMirror n’a pas pu être activé.";
  }
}

async function refreshApplicationFileList(selectFile = "") {
  if (!applicationEditorState) return;
  const editor = document.getElementById("applicationCodeEditor");
  if (editor && applicationEditorState.activeFile) {
    applicationEditorState.files[applicationEditorState.activeFile] = editor.value;
  }
  const data = await api("/projects/" + encodeURIComponent(applicationEditorState.projectId) + "/application-files");
  const files = {};
  (data.files || []).forEach(file => { files[file.file_name] = file.content || ""; });
  const previousFiles = applicationEditorState.files;
  const previousSaved = applicationEditorState.savedFiles;
  Object.keys(previousFiles).forEach(name => {
    if (previousFiles[name] !== previousSaved[name] && files[name] !== undefined) {
      files[name] = previousFiles[name];
    }
  });
  applicationEditorState.files = files;
  applicationEditorState.savedFiles = { ...(Object.fromEntries((data.files || []).map(file => [file.file_name, file.content || ""]))) };
  applicationEditorState.directories = Array.isArray(data.directories) ? data.directories.map(item => item.directory_path) : [];
  if (selectFile && files[selectFile] !== undefined) applicationEditorState.activeFile = selectFile;
  else if (files[applicationEditorState.activeFile] === undefined) applicationEditorState.activeFile = Object.keys(files).sort()[0] || "";
  renderApplicationEditorFile();
}

async function saveApplicationFiles() {
  if (!applicationEditorState || applicationEditorState.saving || applicationEditorState.restoring) return;
  applicationEditorState.saving = true;
  const editor = document.getElementById("applicationCodeEditor");
  const button = document.getElementById("saveApplicationFilesButton");
  const status = document.getElementById("applicationSaveStatus");
  if (editor) applicationEditorState.files[applicationEditorState.activeFile] = editor.value;
  const changedFiles = Object.keys(applicationEditorState.files).sort().filter(fileName =>
    applicationEditorState.files[fileName] !== applicationEditorState.savedFiles[fileName]
  );
  if (!changedFiles.length) {
    applicationEditorState.saving = false;
    if (status) status.textContent = "Aucune modification à enregistrer.";
    return;
  }
  if (button) {
    button.disabled = true;
    button.textContent = "Enregistrement...";
  }
  if (editor) editor.disabled = true;
  if (applicationCodeMirrorInstance) applicationCodeMirrorInstance.setReadOnly(true);
  document.querySelectorAll("#applicationFileTabs button").forEach(tab => { tab.disabled = true; });
  if (status) status.textContent = "Sauvegarde et création des versions...";
  let savedCount = 0;
  let failedFile = null;
  try {
    for (const fileName of changedFiles) {
      try {
        await api("/projects/" + encodeURIComponent(applicationEditorState.projectId) + "/application-files/" + encodeURIComponent(fileName), {
          method: "PUT",
          body: JSON.stringify({ content: applicationEditorState.files[fileName] || "" })
        });
        applicationEditorState.savedFiles[fileName] = applicationEditorState.files[fileName];
        savedCount++;
      } catch (error) {
        failedFile = fileName;
        const remainingCount = changedFiles.length - savedCount;
        if (status) {
          status.textContent = savedCount > 0
            ? savedCount + " fichier(s) enregistré(s). Échec pour " + fileName + " : " + error.message + " " + remainingCount + " fichier(s) restent à sauvegarder."
            : "Échec de l'enregistrement de " + fileName + " : " + error.message + " Aucun fichier n'a été confirmé comme enregistré.";
        }
        break;
      }
    }
    if (!failedFile) {
      if (status) status.textContent = savedCount + " fichier(s) enregistré(s). Nouvelle(s) version(s) conservée(s).";
    }
    if (savedCount > 0) await loadApplicationFileVersions();
  } catch (error) {
    if (status) status.textContent = savedCount > 0
      ? savedCount + " fichier(s) enregistré(s), mais l'historique n'a pas pu être actualisé : " + error.message
      : error.message;
  } finally {
    if (applicationEditorState) applicationEditorState.saving = false;
    if (editor) editor.disabled = false;
    if (applicationCodeMirrorInstance) applicationCodeMirrorInstance.setReadOnly(false);
    document.querySelectorAll("#applicationFileTabs button").forEach(tab => { tab.disabled = false; });
    if (button) {
      button.disabled = false;
      button.textContent = "Enregistrer tous les fichiers";
    }
  }
}

async function loadApplicationFileVersions() {
  if (!applicationEditorState) return;
  const container = document.getElementById("applicationVersionHistory");
  if (!container) return;
  const fileName = applicationEditorState.activeFile;
  container.innerHTML = "<p class=\"muted\">Chargement de l'historique de " + escapeHTML(fileName) + "...</p>";
  try {
    const data = await api("/projects/" + encodeURIComponent(applicationEditorState.projectId) +
      "/application-files/" + encodeURIComponent(fileName) + "/versions");
    if (!applicationEditorState || applicationEditorState.activeFile !== fileName) return;
    const versions = Array.isArray(data.versions) ? data.versions : [];
    if (!versions.length) {
      container.innerHTML = "<p class=\"muted\">Aucune version enregistrée pour ce fichier.</p>";
      return;
    }
    container.innerHTML = "<p class=\"muted\">Historique de " + escapeHTML(fileName) + "</p>" +
      versions.map(version =>
        "<div class=\"item-card\"><div class=\"storage-file-heading\"><div class=\"storage-file-details\">" +
        "<strong>Version " + escapeHTML(String(version.version_number)) + "</strong>" +
        "<div class=\"muted\">" + escapeHTML(formatDate(version.created_at)) + " · " +
        Math.max(0, Math.ceil(Number(version.size || 0) / 1024)) + " Ko</div></div>" +
        "<button class=\"secondary\" type=\"button\" onclick=\"restoreApplicationFileVersion(" +
        escapeJSAttribute(version.id) + ", " + Number(version.version_number) + ")\">Restaurer</button></div></div>"
      ).join("");
  } catch (error) {
    if (applicationEditorState && applicationEditorState.activeFile === fileName) {
      container.innerHTML = "<p class=\"error-text\">" + escapeHTML(error.message) + "</p>";
    }
  }
}

async function restoreApplicationFileVersion(versionId, versionNumber) {
  if (!applicationEditorState || applicationEditorState.saving || applicationEditorState.restoring) return;
  const editorState = applicationEditorState;
  const fileName = editorState.activeFile;
  if (!confirm("Restaurer la version " + versionNumber + " de " + fileName + " ? Le contenu actuel de ce fichier dans l'éditeur sera remplacé. La version actuelle enregistrée sera conservée dans l'historique.")) return;

  editorState.restoring = true;
  const status = document.getElementById("applicationSaveStatus");
  const editor = document.getElementById("applicationCodeEditor");
  const saveButton = document.getElementById("saveApplicationFilesButton");
  if (editor) editor.disabled = true;
  if (applicationCodeMirrorInstance) applicationCodeMirrorInstance.setReadOnly(true);
  if (saveButton) saveButton.disabled = true;
  document.querySelectorAll("#applicationFileTabs button, #applicationVersionHistory button").forEach(button => { button.disabled = true; });
  if (status) status.textContent = "Restauration en cours...";

  try {
    const data = await api("/projects/" + encodeURIComponent(editorState.projectId) +
      "/application-files/" + encodeURIComponent(fileName) + "/restore", {
        method: "POST",
        body: JSON.stringify({ version_id: versionId })
      });
    if (applicationEditorState !== editorState) return;
    editorState.files[fileName] = data.file.content || "";
    editorState.savedFiles[fileName] = data.file.content || "";
    renderApplicationEditorFile();
    refreshApplicationPreview();
    await loadApplicationFileVersions();
    if (status) status.textContent = "Version " + versionNumber + " restaurée. L'historique a été actualisé et une nouvelle version a été créée.";
  } catch (error) {
    if (status) status.textContent = error.message;
  } finally {
    editorState.restoring = false;
    if (applicationEditorState === editorState) {
      const currentEditor = document.getElementById("applicationCodeEditor");
      const currentSaveButton = document.getElementById("saveApplicationFilesButton");
      if (currentEditor) currentEditor.disabled = false;
      if (applicationCodeMirrorInstance) applicationCodeMirrorInstance.setReadOnly(false);
      if (currentSaveButton) currentSaveButton.disabled = false;
      document.querySelectorAll("#applicationFileTabs button, #applicationVersionHistory button").forEach(button => { button.disabled = false; });
    }
  }
}

async function loadAssistantAccessTokens() {
  const container = document.getElementById("assistantAccessTokensList");
  if (!container) return;
  container.textContent = "Chargement des clés...";
  try {
    const result = await api("/assistant-access/tokens");
    const tokens = Array.isArray(result.tokens) ? result.tokens : [];
    if (!tokens.length) {
      container.innerHTML = "<p>Aucune clé d’accès créée.</p>";
      return;
    }
    container.innerHTML = tokens.map(token => {
      const revoked = Boolean(token.revoked_at);
      const expired = Boolean(token.expires_at && new Date(token.expires_at).getTime() <= Date.now());
      const status = revoked ? "Révoquée" : (expired ? "Expirée" : "Active");
      const statusClass = revoked || expired ? "error-text" : "success-text";
      const expiry = token.expires_at
        ? new Date(token.expires_at).toLocaleString("fr-FR", { dateStyle: "medium" })
        : "Sans expiration";
      const created = token.created_at
        ? new Date(token.created_at).toLocaleString("fr-FR", { dateStyle: "medium" })
        : "Date inconnue";
      return `
        <div class="item-card" style="margin-top:12px">
          <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <strong>${escapeHTML(token.label || "Accès assistant")}</strong>
            <strong class="${statusClass}">${status}</strong>
          </div>
          <p class="muted">Créée le ${escapeHTML(created)} · Expire le ${escapeHTML(expiry)}</p>
          <p class="muted">Autorisations : lecture des projets et fichiers d’application</p>
          ${!revoked && !expired ? `<button type="button" class="danger" onclick="revokeAssistantAccess(${escapeJSAttribute(token.id)}, ${escapeJSAttribute(token.label || "cette clé")})">Révoquer cette clé</button>` : ""}
        </div>
      `;
    }).join("");
  } catch (error) {
    container.innerHTML = '<p class="error-text">' + escapeHTML(error.message || "Impossible de charger les clés.") + '</p>';
  }
}


async function loadAssistantOAuthConnections() {
  const container = document.getElementById("assistantOAuthConnectionsList");
  if (!container) return;
  container.textContent = "Chargement des applications...";
  try {
    const result = await api("/assistant-access/oauth-connections");
    const connections = Array.isArray(result.connections) ? result.connections : [];
    if (!connections.length) {
      container.innerHTML = "<p>Aucune application connectée pour le moment.</p>";
      return;
    }
    container.innerHTML = connections.map(connection => {
      const date = connection.last_authorized_at
        ? new Date(connection.last_authorized_at).toLocaleString("fr-FR", { dateStyle: "medium" })

      return `

async function revokeAssistantOAuthConnection(clientId, clientName) {
  if (!confirm("Révoquer l’accès de « " + clientName + " » ? Ses jetons ne fonctionneront plus.")) return;
  try {
    const result = await api("/assistant-access/oauth-connections/" + encodeURIComponent(clientId) + "/revoke", {
      method: "POST",
      body: "{}"
    });
    alert(result.message || "Accès révoqué.");
    await loadAssistantOAuthConnections();
  } catch (error) {
    alert(error.message || "Impossible de révoquer cette application.");
  }
}

async function createAssistantAccess(event) {
  event.preventDefault();
  const labelInput = document.getElementById("assistantAccessLabel");
  const expiryInput = document.getElementById("assistantAccessExpiry");
  const button = document.getElementById("assistantAccessCreateButton");
  const message = document.getElementById("assistantAccessCreateMessage");
  const secretPanel = document.getElementById("assistantAccessSecret");
  const secretInput = document.getElementById("assistantAccessTokenValue");
  if (!labelInput || !expiryInput || !button || !message || !secretPanel || !secretInput) return;

  if (!confirm("Créer une clé qui donnera un accès en lecture à tes propres projets et fichiers d’application ?")) return;
  button.disabled = true;
  button.textContent = "Création...";
  message.textContent = "";
  secretPanel.classList.add("hidden");
  secretInput.value = "";
  try {
    const result = await api("/assistant-access/tokens", {
      method: "POST",
      body: JSON.stringify({
        label: labelInput.value.trim(),
        expires_in_days: Number(expiryInput.value)
      })
    });
    if (!result.token) throw new Error("La clé n’a pas été retournée. Vérifie la liste des accès.");
    secretInput.value = result.token;
    secretPanel.classList.remove("hidden");
    message.innerHTML = '<p class="success-text">' + escapeHTML(result.message || "Clé créée.") + '</p>';
    await loadAssistantAccessTokens();
  } catch (error) {
    message.innerHTML = '<p class="error-text">' + escapeHTML(error.message || "Impossible de créer la clé.") + '</p>';
  } finally {
    button.disabled = false;
    button.textContent = "Créer une clé de lecture";
  }
}

function toggleAssistantAccessSecret() {
  const input = document.getElementById("assistantAccessTokenValue");
  if (input) input.type = input.type === "password" ? "text" : "password";
}

async function copyAssistantAccessSecret() {
  const input = document.getElementById("assistantAccessTokenValue");
  if (!input || !input.value) return;
  try {
    await navigator.clipboard.writeText(input.value);
    alert("Clé copiée. Garde-la secrète et ne la partage pas dans une conversation.");
  } catch (error) {
    input.type = "text";
    input.select();
    alert("Sélectionne la clé puis utilise Copier. Ne la partage pas dans une conversation.");
  }
}

async function revokeAssistantAccess(id, label) {
  if (!confirm("Révoquer « " + label + " » ? Cette clé cessera immédiatement de fonctionner.")) return;
  try {
    const result = await api("/assistant-access/tokens/" + encodeURIComponent(id) + "/revoke", {
      method: "POST",
      body: "{}"
    });
    alert(result.message || "Clé révoquée.");
    const secretPanel = document.getElementById("assistantAccessSecret");
    const secretInput = document.getElementById("assistantAccessTokenValue");
    if (secretPanel) secretPanel.classList.add("hidden");
    if (secretInput) secretInput.value = "";
    await loadAssistantAccessTokens();
  } catch (error) {
    alert(error.message || "Impossible de révoquer cette clé.");
  }
}

        <label for="accountConfirmPassword">Confirmer le nouveau mot de passe</label>
        <input id="accountConfirmPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
        <button type="submit">Modifier le mot de passe</button>
      </form>
      <div id="accountPasswordMessage" aria-live="polite"></div>
    </div>

    <div class="card form-card">
      <h3>Sessions connectées</h3>
      <p class="muted">Déconnecte les autres appareils et navigateurs associés à ton compte. Cet appareil restera connecté.</p>
      <button class="secondary" type="button" onclick="revokeOtherSessions()">Déconnecter les autres sessions</button>
      <div id="accountSessionsMessage" aria-live="polite"></div>
    </div>

    <div class="card form-card">
      <h3>Session actuelle</h3>
      <p class="muted">Suivi de l'activité et de l'expiration automatique de cette session.</p>
      <div id="accountSessionInfo" class="muted">Chargement des informations de session...</div>
      <button class="secondary" type="button" onclick="loadAccountSessionInfo()">Actualiser les informations</button>
    </div>

    <div class="card form-card">
      <h3>Historique des connexions</h3>
      <p class="muted">Retrouve les connexions récentes et les nouveaux environnements détectés parmi les 50 dernières activités. La détection compare le navigateur et le système, pas l'identité physique de l'appareil.</p>
      <div id="accountLoginHistory" class="muted">Chargement des connexions...</div>
    </div>

      <div id="accountSecurityLog" class="muted">Chargement des activités...</div>

  loadAccountSecurityLog();
  loadAccountSessionInfo();

async function loadAccountSessionInfo() {
  const container = document.getElementById("accountSessionInfo");
  if (!container) return;

  container.textContent = "Actualisation...";
  try {
    const result = await api("/account/session-info");
    const formatSessionDate = value => {
      const date = new Date(value);
      return Number.isNaN(date.getTime())
        ? "Indisponible"
        : date.toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" });
    };
    container.innerHTML = `
      <p><strong>Session vérifiée le :</strong><br>${escapeHTML(formatSessionDate(result.last_activity_at))}</p>
      <p><strong>Expiration estimée :</strong><br>${escapeHTML(formatSessionDate(result.expires_at))}</p>
      <p class="muted">La session expire après ${Number(result.idle_timeout_minutes) || 60} minutes sans activité.</p>
    `;
  } catch (error) {
    container.innerHTML = '<p class="error-text">' + escapeHTML(error.message || "Impossible de charger la session.") + '</p>';
  }
}

async function loadAccountSecurityLog() {
  const container = document.getElementById("accountSecurityLog");
  const loginContainer = document.getElementById("accountLoginHistory");
  if (!container && !loginContainer) return;

  try {
    const result = await api("/account/security-log");
    const events = Array.isArray(result.events) ? result.events : [];
    const loginEvents = events.filter(event => ["login", "new_environment_login"].includes(event.action));

    if (loginContainer) {
      if (!loginEvents.length) {
        loginContainer.innerHTML = "<p>Aucune connexion enregistrée pour le moment.</p>";
      } else {
        loginContainer.innerHTML = loginEvents.map(event => {
          const isNew = event.action === "new_environment_login";
          const title = isNew ? "Nouvel environnement détecté" : "Environnement déjà connu";
          const marker = isNew
            ? '<span class="status" style="background:#7d2639;color:#fff">À vérifier</span>'
            : '<span class="status online">Connu</span>';
          return `
            <div class="activity-item" style="padding:12px 0;border-bottom:1px solid var(--border-color, #e5e7eb)">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
                <strong>${escapeHTML(title)}</strong>${marker}
              </div>
              <div class="muted">${escapeHTML(event.device_info || "Navigateur inconnu")} · ${escapeHTML(formatDate(event.created_at))}</div>
              <div class="muted">${escapeHTML(event.description || "")}</div>
            </div>
          `;
        }).join("");
      }
    }

    if (container) {
      if (!events.length) {
        container.innerHTML = "<p>Aucune activité de sécurité enregistrée pour le moment.</p>";
        return;
      }

      const labels = {
        login: "Connexion réussie",
        new_environment_login: "Connexion depuis un nouvel environnement",
        logout: "Déconnexion",
        password_change: "Mot de passe modifié",
        sessions_revoked: "Autres sessions déconnectées"
      };

      container.innerHTML = events.map(event => {
        const title = labels[event.action] || "Activité du compte";
        return `
          <div class="activity-item" style="padding:12px 0;border-bottom:1px solid var(--border-color, #e5e7eb)">
            <strong>${escapeHTML(title)}</strong>
            <div class="muted">${escapeHTML(event.description || "")}</div>
            <div class="muted">${escapeHTML(event.device_info || "Navigateur inconnu")} · ${escapeHTML(formatDate(event.created_at))}</div>
          </div>
        `;
      }).join("");
    }
  } catch (error) {
    const message = escapeHTML(error.message || "Impossible de charger les activités.");
    if (container) container.innerHTML = '<p class="error-text">' + message + '</p>';
    if (loginContainer) loginContainer.innerHTML = '<p class="error-text">' + message + '</p>';
  }
}

async function changeAccountPassword(event) {
  event.preventDefault();

  const currentInput = document.getElementById("accountCurrentPassword");
  const newInput = document.getElementById("accountNewPassword");
  const confirmInput = document.getElementById("accountConfirmPassword");
  const message = document.getElementById("accountPasswordMessage");

  if (newInput.value !== confirmInput.value) {
    message.innerHTML = '<p class="error-text">Les deux nouveaux mots de passe ne correspondent pas.</p>';
    return;
  }

  const submitButton = event.submitter;
  if (submitButton) submitButton.disabled = true;

  try {
    const result = await api("/account/password", {
      method: "POST",
      body: JSON.stringify({
        current_password: currentInput.value,
        new_password: newInput.value
      })
    });

    message.innerHTML = '<p class="success-text">' + escapeHTML(result.message) + '</p>';
    currentInput.value = "";
    newInput.value = "";
    confirmInput.value = "";
  } catch (error) {
    message.innerHTML = '<p class="error-text">' + escapeHTML(error.message) + '</p>';
  } finally {
    if (submitButton) submitButton.disabled = false;
  }
}

async function revokeOtherSessions() {
  const confirmed = confirm(
    "Confirmer la déconnexion de tous les autres appareils et navigateurs ? Cet appareil restera connecté."
  );
  if (!confirmed) return;

  const message = document.getElementById("accountSessionsMessage");
  try {
    const result = await api("/account/revoke-sessions", {
      method: "POST",
      body: JSON.stringify({})
    });
    message.innerHTML = '<p class="success-text">' +
      escapeHTML(result.message) +
      ' (' + Number(result.revoked || 0) + ' session(s) révoquée(s))</p>';
  } catch (error) {
    message.innerHTML = '<p class="error-text">' + escapeHTML(error.message) + '</p>';
  }
}

function formatDate(value) {
  if (!value) return "Date inconnue";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return date.toLocaleDateString("fr-FR");
}


const PRO_ACCESSIBILITY_STORAGE_KEY = "221cloudpro-accessibility-v1";
function getProAccessibilityPreferences() {
  const defaults = { textSize: "normal", contrast: false, easyButtons: false };
  try {
    const saved = JSON.parse(localStorage.getItem(PRO_ACCESSIBILITY_STORAGE_KEY) || "{}");
    return {
      textSize: ["normal", "large", "xlarge"].includes(saved.textSize) ? saved.textSize : defaults.textSize,
      contrast: saved.contrast === true,
      easyButtons: saved.easyButtons === true
    };
  } catch (error) {
    return defaults;
  }
}
function applyProAccessibilityPreferences() {
  if (!document.body.classList.contains("pro-mode")) return;
  const prefs = getProAccessibilityPreferences();
  document.body.classList.toggle("pro-a11y-text-large", prefs.textSize === "large");
  document.body.classList.toggle("pro-a11y-text-xlarge", prefs.textSize === "xlarge");
  document.body.classList.toggle("pro-a11y-contrast", prefs.contrast);
  document.body.classList.toggle("pro-a11y-buttons", prefs.easyButtons);
}
function setProAccessibilityPreference(key, value) {
  const prefs = getProAccessibilityPreferences();
  if (!["textSize", "contrast", "easyButtons"].includes(key)) return;
  prefs[key] = value;
  try {
    localStorage.setItem(PRO_ACCESSIBILITY_STORAGE_KEY, JSON.stringify(prefs));
  } catch (error) {
    console.warn("Les préférences d’accessibilité ne peuvent pas être mémorisées sur cet appareil.", error);
  }
  applyProAccessibilityPreferences();
  if (document.getElementById("proAccessibilitySettings")) renderProAccessibilitySettings();
}
function resetProAccessibilityPreferences() {
  try { localStorage.removeItem(PRO_ACCESSIBILITY_STORAGE_KEY); } catch (error) {}
  applyProAccessibilityPreferences();
  renderProAccessibilitySettings();
}
function renderProAccessibilitySettings() {
  const main = document.getElementById("mainContent");
  if (!main) return;
  const prefs = getProAccessibilityPreferences();
  const sizeButton = (value, label, description) =>
    '<button type="button" class="' + (prefs.textSize === value ? 'pro-a11y-choice-active' : 'secondary') + '" aria-pressed="' + (prefs.textSize === value ? 'true' : 'false') + '" onclick="setProAccessibilityPreference(\'textSize\',\'' + value + '\')">' + label + '<span class="pro-a11y-choice-description">' + description + '</span></button>';
  main.innerHTML = [
    '<section id="proAccessibilitySettings" class="pro-a11y-settings">',
    '<div class="pro-a11y-settings-heading"><span class="pro-eyebrow">CONFORT DE LECTURE</span><h1 class="page-title">Accessibilité</h1><p class="page-subtitle">Adaptez l’affichage à votre confort visuel. Vos choix sont conservés sur cet appareil.</p></div>',
    '<section class="card"><h2>Taille du texte</h2><p class="muted">Choisissez une taille plus facile à lire.</p><div class="pro-a11y-size-options">',
    sizeButton("normal", "Standard", "Taille habituelle"),
    sizeButton("large", "Grand", "Texte agrandi"),
    sizeButton("xlarge", "Très grand", "Agrandissement renforcé"),
    '</div></section>',
    '<section class="card"><h2>Contraste renforcé</h2><p class="muted">Renforce les couleurs du texte, des cartes et des champs pour mieux les distinguer.</p><div class="pro-a11y-toggle-row"><strong>Activer le contraste renforcé</strong><button type="button" class="' + (prefs.contrast ? 'pro-a11y-choice-active' : 'secondary') + '" aria-pressed="' + (prefs.contrast ? 'true' : 'false') + '" onclick="setProAccessibilityPreference(\'contrast\',' + (!prefs.contrast) + ')">' + (prefs.contrast ? 'Activé' : 'Désactivé') + '</button></div></section>',
    '<section class="card"><h2>Boutons plus visibles</h2><p class="muted">Agrandit les zones tactiles et accentue les contours et le repérage au clavier.</p><div class="pro-a11y-toggle-row"><strong>Faciliter le repérage des boutons</strong><button type="button" class="' + (prefs.easyButtons ? 'pro-a11y-choice-active' : 'secondary') + '" aria-pressed="' + (prefs.easyButtons ? 'true' : 'false') + '" onclick="setProAccessibilityPreference(\'easyButtons\',' + (!prefs.easyButtons) + ')">' + (prefs.easyButtons ? 'Activé' : 'Désactivé') + '</button></div></section>',
    '<div class="pro-a11y-settings-actions"><button type="button" class="secondary" onclick="resetProAccessibilityPreferences()">Réinitialiser</button><button type="button" onclick="renderProPage()">Retour à l’accueil</button></div>',
    '<p class="muted pro-a11y-note">Ces réglages améliorent le confort visuel. Ils ne remplacent pas les fonctions d’assistance du téléphone, comme VoiceOver ou le zoom de l’écran.</p>',
    '</section>'
  ].join("");
}
