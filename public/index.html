function zip221U16(value) {
  const bytes = new Uint8Array(2);
  new DataView(bytes.buffer).setUint16(0, value, true);
  return bytes;
}

function zip221U32(value) {
  const bytes = new Uint8Array(4);
  new DataView(bytes.buffer).setUint32(0, value >>> 0, true);
  return bytes;
}

function zip221Join(parts) {
  const length = parts.reduce((sum, part) => sum + part.length, 0);
  const result = new Uint8Array(length);
  let offset = 0;
  parts.forEach(part => {
    result.set(part, offset);
    offset += part.length;
  });
  return result;
}

function zip221Crc32(bytes) {
  if (!zip221Crc32.table) {
    zip221Crc32.table = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      zip221Crc32.table[n] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    crc = zip221Crc32.table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function build221CloudZip(entries) {
  const encoder = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let localOffset = 0;
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
  const dosDate = ((Math.max(1980, now.getFullYear()) - 1980) << 9) |
    ((now.getMonth() + 1) << 5) | now.getDate();

  entries.forEach(entry => {
    const nameBytes = encoder.encode(entry.name);
    const data = entry.data instanceof Uint8Array ? entry.data : new Uint8Array(entry.data || 0);
    const crc = zip221Crc32(data);
    const size = data.length;
    const flags = 0x0800;

    const localHeader = zip221Join([
      zip221U32(0x04034B50), zip221U16(20), zip221U16(flags),
      zip221U16(0), zip221U16(dosTime), zip221U16(dosDate),
      zip221U32(crc), zip221U32(size), zip221U32(size),
      zip221U16(nameBytes.length), zip221U16(0), nameBytes
    ]);
    localParts.push(localHeader, data);

    const centralHeader = zip221Join([
      zip221U32(0x02014B50), zip221U16(20), zip221U16(20),
      zip221U16(flags), zip221U16(0), zip221U16(dosTime),
      zip221U16(dosDate), zip221U32(crc), zip221U32(size),
      zip221U32(size), zip221U16(nameBytes.length), zip221U16(0),
      zip221U16(0), zip221U16(0), zip221U16(0),
      zip221U32(0), zip221U32(localOffset), nameBytes
    ]);
    centralParts.push(centralHeader);
    localOffset += localHeader.length + size;
  });

  const centralDirectory = zip221Join(centralParts);
  const endRecord = zip221Join([
    zip221U32(0x06054B50), zip221U16(0), zip221U16(0),
    zip221U16(entries.length), zip221U16(entries.length),
    zip221U32(centralDirectory.length), zip221U32(localOffset),
    zip221U16(0)
  ]);
  return new Blob([...localParts, centralDirectory, endRecord], { type: "application/zip" });
}

async function downloadStorageMetadataBackup() {
  const button = document.querySelector('#storageHistoryCard button[onclick="downloadStorageMetadataBackup()"]');
  const originalLabel = button?.textContent || "🗂 Sauvegarde complète";
  if (button) {
    button.disabled = true;
    button.textContent = "Préparation...";
  }

  try {
    const backup = await api("/storage/backup");
    const files = backup.contents?.files || [];
    const folders = backup.contents?.folders || [];
    const projectsData = await api("/projects");
    const websiteProjects = (projectsData.projects || []).filter(project => project.type === "website");
    const hostedSites = [];

    for (const project of websiteProjects) {
      const hostingData = await api("/projects/" + encodeURIComponent(project.id) + "/hosting");
      const hosting = hostingData.hosting;
      const siteFiles = Array.isArray(hostingData.files) ? hostingData.files : [];
      if (!hosting || !hosting.active_deployment_id || !siteFiles.length) continue;
      hostedSites.push({
        project_id: project.id,
        project_name: project.name || "Site sans nom",
        hosting_slug: hosting.slug || "",
        deployment_id: hosting.active_deployment_id,
        files: siteFiles
      });
    }

    const hostedFiles = hostedSites.flatMap(site =>
      site.files.map(file => ({ ...file, project_id: site.project_id, project_name: site.project_name }))
    );
    const personalBytes = files.reduce((sum, file) => sum + Math.max(0, Number(file.file_size) || 0), 0);
    const hostedBytes = hostedFiles.reduce((sum, file) => sum + Math.max(0, Number(file.file_size) || 0), 0);
    const totalBytes = personalBytes + hostedBytes;
    const maxArchiveBytes = 100 * 1024 * 1024;

    if (totalBytes > maxArchiveBytes) {
      throw new Error("La sauvegarde complète dépasse la limite de préparation de 100 Mo sur navigateur. Aucun fichier n'a été modifié. Une sauvegarde par lots sera nécessaire.");
    }

    if (!confirm(
      "Créer une archive ZIP contenant les fichiers du Stockage cloud (y compris la corbeille) et les fichiers des sites web actuellement publiés ?\n\n" +
      "Fichiers personnels : " + files.length + "\n" +
      "Dossiers personnels : " + folders.length + "\n" +
      "Sites hébergés : " + hostedSites.length + "\n" +
      "Fichiers des sites : " + hostedFiles.length + "\n" +
      "Volume total à télécharger : " + formatBytes(totalBytes) + "\n\n" +
      "Les originaux et les sites publiés resteront inchangés. La préparation peut prendre quelques minutes."
    )) return;

    const entries = [];
    const folderMap = new Map(folders.map(folder => [folder.id, folder]));
    const folderPathCache = new Map();

    function getFolderPath(folderId, visited = new Set()) {
      if (!folderId || !folderMap.has(folderId) || visited.has(folderId)) return "";
      if (folderPathCache.has(folderId)) return folderPathCache.get(folderId);
      const folder = folderMap.get(folderId);
      const nextVisited = new Set(visited);
      nextVisited.add(folderId);
      const parentPath = getFolderPath(folder.parent_id, nextVisited);
      const name = String(folder.name || "Dossier").replace(/[\\/]/g, "_");
      const path = parentPath ? parentPath + "/" + name : name;
      folderPathCache.set(folderId, path);
      return path;
    }

    const folderEntries = new Set();
    folders.forEach(folder => {
      const path = getFolderPath(folder.id);
      if (path) folderEntries.add(path + "/");
    });
    if (files.some(file => file.deleted_at)) folderEntries.add("Corbeille/");

    folderEntries.forEach(name => entries.push({ name, data: new Uint8Array(0) }));

    for (let index = 0; index < files.length; index++) {
      const file = files[index];
      if (button) button.textContent = "Téléchargement " + (index + 1) + "/" + files.length + "...";

      const response = await fetch(
        API + "/storage/" + encodeURIComponent(file.id) + "/backup-download",
        { credentials: "same-origin", cache: "no-store" }
      );
      if (!response.ok) {
        let message = "Échec du téléchargement de " + file.file_name + ".";
        try {
          const errorData = await response.json();
          if (errorData.error) message = errorData.error;
        } catch (e) {}
        throw new Error(message + " La sauvegarde ZIP a été annulée.");
      }

      const bytes = new Uint8Array(await response.arrayBuffer());
      const expectedSize = Math.max(0, Number(file.file_size) || 0);
      if (bytes.length !== expectedSize) {
        throw new Error("Taille incorrecte pour " + file.file_name + " : fichier reçu " +
          formatBytes(bytes.length) + ", attendu " + formatBytes(expectedSize) +
          ". La sauvegarde ZIP a été annulée.");
      }

      const folderPath = getFolderPath(file.folder_id);
      const isTrashed = Boolean(file.deleted_at);
      let archivePath = folderPath ? folderPath + "/" : "";
      if (isTrashed) archivePath = "Corbeille/" + archivePath;
      const safeName = String(file.file_name || "fichier").replace(/[\\/]/g, "_");
      entries.push({ name: archivePath + safeName, data: bytes });
    }

    let hostedDownloadIndex = 0;
    for (const site of hostedSites) {
      const safeProjectName = String(site.project_name || "Site")
        .replace(/[\\/\\:*?"<>|]/g, "_")
        .trim() || "Site";
      for (const file of site.files) {
        hostedDownloadIndex++;
        if (button) {
          button.textContent = "Sauvegarde sites " + hostedDownloadIndex + "/" + hostedFiles.length + "...";
        }
        const response = await fetch(
          API + "/projects/" + encodeURIComponent(site.project_id) +
          "/hosting/files/" + encodeURIComponent(file.id) + "/backup-download",
          { credentials: "same-origin", cache: "no-store" }
        );
        if (!response.ok) {
          let message = "Échec du téléchargement de " + (file.file_path || "un fichier du site") + ".";
          try {
            const errorData = await response.json();
            if (errorData.error) message = errorData.error;
          } catch (e) {}
          throw new Error(message + " La sauvegarde ZIP a été annulée.");
        }

        const bytes = new Uint8Array(await response.arrayBuffer());
        const expectedSize = Math.max(0, Number(file.file_size) || 0);
        if (bytes.length !== expectedSize) {
          throw new Error("Taille incorrecte pour " + file.file_path + " : fichier reçu " +
            formatBytes(bytes.length) + ", attendu " + formatBytes(expectedSize) +
            ". La sauvegarde ZIP a été annulée.");
        }

        const safeFilePath = String(file.file_path || "fichier")
          .split("/")
          .map(part => part.replace(/[\\:*?"<>|]/g, "_"))
          .join("/");
        entries.push({
          name: "Sites hébergés/" + safeProjectName + "/" + safeFilePath,
          data: bytes
        });
      }
    }

    backup.contents.hosted_sites = hostedSites.map(site => ({
      project_id: site.project_id,
      project_name: site.project_name,
      hosting_slug: site.hosting_slug,
      deployment_id: site.deployment_id,
      files: site.files.map(file => ({
        id: file.id,
        file_path: file.file_path,
        file_size: file.file_size,
        mime_type: file.mime_type
      }))
    }));
    backup.counts.hosted_sites = hostedSites.length;
    backup.counts.hosted_files = hostedFiles.length;
    backup.archive_created_at = new Date().toISOString();
    backup.note = "Archive contenant les fichiers personnels, les fichiers des sites actuellement publiés et les métadonnées. Les fichiers personnels de la corbeille sont rangés sous Corbeille/ ; les sites sous Sites hébergés/.";
    entries.push({
      name: "221Cloud-metadata.json",
      data: new TextEncoder().encode(JSON.stringify(backup, null, 2))
    });

    if (button) button.textContent = "Création de l’archive...";
    const blob = build221CloudZip(entries);
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const now = new Date();
    const stamp = now.getFullYear() + "-" +
      String(now.getMonth() + 1).padStart(2, "0") + "-" +
      String(now.getDate()).padStart(2, "0");
    link.href = url;
    link.download = "221Cloud-sauvegarde-complete-" + stamp + ".zip";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);

    alert(
      "Archive ZIP créée et téléchargée.\n\n" +
      "Fichiers personnels : " + files.length + "\n" +
      "Dossiers personnels : " + folders.length + "\n" +
      "Sites hébergés : " + hostedSites.length + "\n" +
      "Fichiers des sites : " + hostedFiles.length + "\n" +
      "Volume total : " + formatBytes(totalBytes) + "\n\n" +
      "Les fichiers actifs, ceux de la corbeille et les fichiers des sites publiés sont inclus. Les originaux n’ont pas été modifiés."
    );
  } catch (error) {
    alert("Sauvegarde complète impossible : " + error.message);
  } finally {
    if (button) {
      button.disabled = false;
      button.textContent = originalLabel;
    }
  }
}

function read221ZipArchive(buffer) {
  const bytes = new Uint8Array(buffer);
  const view = new DataView(buffer);
  const decoder = new TextDecoder("utf-8", { fatal: true });

  if (bytes.length < 22) throw new Error("Archive ZIP invalide : fichier trop court.");

  let endOffset = -1;
  const minOffset = Math.max(0, bytes.length - 65557);
  for (let offset = bytes.length - 22; offset >= minOffset; offset--) {
    if (view.getUint32(offset, true) === 0x06054B50) {
      const commentLength = view.getUint16(offset + 20, true);
      if (offset + 22 + commentLength === bytes.length) {
        endOffset = offset;
        break;
      }
    }
  }
  if (endOffset < 0) throw new Error("Archive ZIP invalide : fin du fichier introuvable ou commentaire incorrect.");

  const diskNumber = view.getUint16(endOffset + 4, true);
  const centralDisk = view.getUint16(endOffset + 6, true);
  const diskEntryCount = view.getUint16(endOffset + 8, true);
  const entryCount = view.getUint16(endOffset + 10, true);
  const centralSize = view.getUint32(endOffset + 12, true);
  const centralOffset = view.getUint32(endOffset + 16, true);

  if (diskNumber !== 0 || centralDisk !== 0 || diskEntryCount !== entryCount) {
    throw new Error("Les archives ZIP réparties sur plusieurs volumes ne sont pas prises en charge.");
  }
  if (entryCount === 0xFFFF || centralSize === 0xFFFFFFFF || centralOffset === 0xFFFFFFFF) {
    throw new Error("Ce format ZIP volumineux n'est pas pris en charge.");
  }
  if (entryCount > 20000) throw new Error("Cette archive contient trop d'entrées ZIP.");
  if (centralOffset + centralSize !== endOffset || centralOffset > bytes.length || centralSize > bytes.length) {
    throw new Error("Index ZIP invalide : limites incohérentes.");
  }

  const entries = new Map();
  let cursor = centralOffset;

  for (let i = 0; i < entryCount; i++) {
    if (cursor + 46 > endOffset || view.getUint32(cursor, true) !== 0x02014B50) {
      throw new Error("Index ZIP invalide ou tronqué.");
    }

    const flags = view.getUint16(cursor + 8, true);
    const method = view.getUint16(cursor + 10, true);
    const crc = view.getUint32(cursor + 16, true);
    const compressedSize = view.getUint32(cursor + 20, true);
    const uncompressedSize = view.getUint32(cursor + 24, true);
    const nameLength = view.getUint16(cursor + 28, true);
    const extraLength = view.getUint16(cursor + 30, true);
    const commentLength = view.getUint16(cursor + 32, true);
    const localOffset = view.getUint32(cursor + 42, true);
    const centralRecordEnd = cursor + 46 + nameLength + extraLength + commentLength;

    if (!nameLength || nameLength > 4096 || centralRecordEnd > endOffset) {
      throw new Error("Nom ou longueur d'entrée ZIP invalide.");
    }
    if (flags !== 0x0800) {
      throw new Error("Cette archive utilise des options ZIP non prises en charge.");
    }
    if (method !== 0) {
      throw new Error("Cette archive utilise une compression non prise en charge. Utilisez une sauvegarde ZIP créée par 221Cloud.");
    }
    if (compressedSize !== uncompressedSize) throw new Error("Taille ZIP incohérente.");
    if (localOffset + 30 > centralOffset) throw new Error("En-tête local ZIP situé hors de la zone des fichiers.");

    let name;
    try {
      name = decoder.decode(bytes.slice(cursor + 46, cursor + 46 + nameLength));
    } catch (error) {
      throw new Error("Un nom de fichier ZIP n'est pas un texte UTF-8 valide.");
    }
    if (!name || name.includes("\\") || name.startsWith("/") || name.split("/").some(part => part === "..")) {
      throw new Error("Chemin dangereux détecté dans l'archive ZIP.");
    }

    const localSignature = view.getUint32(localOffset, true);
    if (localSignature !== 0x04034B50) throw new Error("En-tête local ZIP invalide.");

    const localFlags = view.getUint16(localOffset + 6, true);
    const localMethod = view.getUint16(localOffset + 8, true);
    const localCrc = view.getUint32(localOffset + 14, true);
    const localCompressedSize = view.getUint32(localOffset + 18, true);
    const localUncompressedSize = view.getUint32(localOffset + 22, true);
    const localNameLength = view.getUint16(localOffset + 26, true);
    const localExtraLength = view.getUint16(localOffset + 28, true);
    const localNameStart = localOffset + 30;
    const dataStart = localNameStart + localNameLength + localExtraLength;
    const dataEnd = dataStart + compressedSize;

    if (dataStart > centralOffset || dataEnd > centralOffset || dataEnd < dataStart) {
      throw new Error("Données ZIP situées hors des limites autorisées.");
    }
    if (
      localFlags !== flags ||
      localMethod !== method ||
      localCrc !== crc ||
      localCompressedSize !== compressedSize ||
      localUncompressedSize !== uncompressedSize ||
      localNameLength !== nameLength
    ) {
      throw new Error("Les en-têtes ZIP central et local ne correspondent pas pour : " + name);
    }

    const localNameBytes = bytes.slice(localNameStart, localNameStart + localNameLength);
    const centralNameBytes = bytes.slice(cursor + 46, cursor + 46 + nameLength);
    if (localNameBytes.length !== centralNameBytes.length ||
        localNameBytes.some((value, index) => value !== centralNameBytes[index])) {
      throw new Error("Le nom de l'entrée ZIP diffère entre les deux en-têtes : " + name);
    }

    const data = bytes.slice(dataStart, dataEnd);
    if (zip221Crc32(data) !== crc) throw new Error("Vérification d'intégrité échouée pour : " + name);
    if (!entries.has(name)) entries.set(name, []);
    entries.get(name).push(data);
    cursor = centralRecordEnd;
  }

  if (cursor !== centralOffset + centralSize) {
    throw new Error("La taille réelle de l'index ZIP ne correspond pas à sa déclaration.");
  }

  return entries;
}
async function restoreStorageBackup() {
  const button = document.querySelector('#storageHistoryCard button[onclick="restoreStorageBackup()"]');
  const originalLabel = button?.textContent || "↥ Restaurer une sauvegarde ZIP";
  const picker = document.createElement("input");
  picker.type = "file";
  picker.accept = ".zip,application/zip";
  picker.style.display = "none";
  document.body.appendChild(picker);
  picker.onchange = async () => {
    const archiveFile = picker.files?.[0];
    picker.remove();
    if (!archiveFile) return;
    if (archiveFile.size > 110 * 1024 * 1024) {
      alert("Cette archive dépasse la limite de restauration de 110 Mo sur navigateur mobile.");
      return;
    }
    if (button) { button.disabled = true; button.textContent = "Analyse de l’archive..."; }
    try {
      const entries = read221ZipArchive(await archiveFile.arrayBuffer());
      const metadataBytes = entries.get("221Cloud-metadata.json")?.[0];
      if (!metadataBytes) throw new Error("Fichier 221Cloud-metadata.json introuvable. Sélectionnez une sauvegarde complète créée par 221Cloud.");
      let backup;
      try { backup = JSON.parse(new TextDecoder("utf-8").decode(metadataBytes)); }
      catch (e) { throw new Error("Le fichier de métadonnées est illisible."); }
      if (backup.product !== "221Cloud" || !backup.contents || typeof backup.contents !== "object") throw new Error("Cette archive ne correspond pas au format de sauvegarde 221Cloud.");
      if (!Array.isArray(backup.contents.files) || !Array.isArray(backup.contents.folders)) {
        throw new Error("Les métadonnées de sauvegarde sont incomplètes : listes de fichiers ou de dossiers absentes.");
      }
      const files = backup.contents.files;
      const folders = backup.contents.folders;
      if (!files.length && !folders.length) throw new Error("Cette sauvegarde ne contient aucun fichier ni dossier à restaurer.");
      if (files.length > 10000 || folders.length > 5000) throw new Error("Cette sauvegarde contient trop d'éléments pour une restauration sûre.");
      const folderIds = new Set();
      for (const folder of folders) {
        if (!folder || typeof folder !== "object" || typeof folder.id !== "string" || !folder.id.trim() ||
            folderIds.has(folder.id) || typeof folder.name !== "string" || !folder.name.trim() ||
            (folder.parent_id != null && typeof folder.parent_id !== "string")) {
          throw new Error("Métadonnées de dossier invalides ou identifiants répétés. Aucun élément n'a été restauré.");
        }
        folderIds.add(folder.id);
      }
      for (const folder of folders) {
        if (folder.parent_id != null && !folderIds.has(folder.parent_id)) {
          throw new Error("Un dossier fait référence à un parent absent de la sauvegarde.");
        }
      }
      const fileIds = new Set();
      let totalBytes = 0;
      for (const file of files) {
        const size = Number(file?.file_size);
        if (!file || typeof file !== "object" || typeof file.id !== "string" || !file.id.trim() ||
            fileIds.has(file.id) || typeof file.file_name !== "string" || !file.file_name.trim() ||
            !Number.isSafeInteger(size) || size < 0 || size > MAX_FILE_SIZE_BYTES ||
            (file.folder_id != null && !folderIds.has(file.folder_id)) ||
            (file.deleted_at != null && typeof file.deleted_at !== "string") ||
            (file.mime_type != null && typeof file.mime_type !== "string")) {
          throw new Error("Métadonnées de fichier invalides, taille non autorisée ou dossier introuvable. Aucun élément n'a été restauré.");
        }
        fileIds.add(file.id);
        totalBytes += size;
        if (!Number.isSafeInteger(totalBytes)) throw new Error("Le volume total indiqué dans la sauvegarde est invalide.");
      }
      const storage = await api("/storage");
      if (!storage || !Array.isArray(storage.files) || !Number.isFinite(Number(storage.used)) ||
          !Number.isFinite(Number(storage.limit)) || Number(storage.used) < 0 || Number(storage.limit) <= 0) {
        throw new Error("Impossible de vérifier de façon fiable le stockage et son quota. Restauration annulée.");
      }
      const used = Number(storage.used);
      const limit = Number(storage.limit);
      const trashData = await api("/storage/trash");
      if (!trashData || !Array.isArray(trashData.files)) {
        throw new Error("Impossible de vérifier le contenu de la corbeille. Restauration annulée pour éviter de créer des doublons.");
      }
      const existingTrashFiles = trashData.files;
      const existingFiles = [
        ...(Array.isArray(storage.files) ? storage.files : []),
        ...existingTrashFiles
      ];
      const duplicateSignature = file => [
        String(file.file_name || "").trim().toLocaleLowerCase("fr"),
        Math.max(0, Number(file.file_size) || 0),
        String(file.mime_type || "application/octet-stream").trim().toLocaleLowerCase("fr")
      ].join("|");
      const existingSignatures = new Map();
      for (const file of existingFiles) {
        const signature = duplicateSignature(file);
        existingSignatures.set(signature, (existingSignatures.get(signature) || 0) + 1);
      }
      const fileEntries = [];
      const folderMap = new Map(folders.map(folder => [folder.id, folder]));
      const pathCache = new Map();
      for (const folder of folders) {
        let current = folder;
        const seen = new Set();
        while (current) {
          if (seen.has(current.id)) throw new Error("La structure des dossiers contient une boucle. Aucun élément n'a été restauré.");
          seen.add(current.id);
          current = current.parent_id ? folderMap.get(current.parent_id) : null;
        }
      }
      function folderPath(id, seen = new Set()) {
        if (!id || !folderMap.has(id) || seen.has(id)) return "";
        if (pathCache.has(id)) return pathCache.get(id);
        const folder = folderMap.get(id);
        const next = new Set(seen); next.add(id);
        const parent = folderPath(folder.parent_id, next);
        const name = String(folder.name || "Dossier").replace(/[\\/]/g, "_");
        const path = parent ? parent + "/" + name : name;
        pathCache.set(id, path);
        return path;
      }
      for (const file of files) {
        const originalPath = folderPath(file.folder_id);
        const prefix = file.deleted_at ? "Corbeille/" : "";
        const safeName = String(file.file_name || "fichier").replace(/[\\/]/g, "_");
        const expectedPath = prefix + (originalPath ? originalPath + "/" : "") + safeName;
        const matchingEntries = entries.get(expectedPath);
        const data = matchingEntries?.shift();
        if (!data) throw new Error("Fichier manquant dans l'archive : " + expectedPath + ". Aucun élément n'a été restauré.");
        if (data.length !== Number(file.file_size || 0)) throw new Error("Taille incorrecte pour " + safeName + ". Aucun élément n'a été restauré.");
        fileEntries.push({ metadata: file, data, isTrash: Boolean(file.deleted_at) });
      }
      const importEntries = [];
      const duplicateFiles = [];
      for (const item of fileEntries) {
        const signature = duplicateSignature(item.metadata);
        const matches = existingSignatures.get(signature) || 0;
        if (matches > 0) {
          existingSignatures.set(signature, matches - 1);
          duplicateFiles.push(item);
        } else {
          importEntries.push(item);
        }
      }
      const importBytes = importEntries.reduce((sum, item) => sum + Math.max(0, Number(item.metadata.file_size) || 0), 0);
      if (used + importBytes > limit) throw new Error("Espace insuffisant pour les fichiers à importer. Il faut " + formatBytes(importBytes) + " supplémentaires, mais il ne reste que " + formatBytes(Math.max(0, limit - used)) + ".");
      const stamp = new Date().toLocaleString("fr-FR").replace(/[/:]/g, "-");
      const rootName = "Restauration 221Cloud - " + stamp;
      const previewLines = fileEntries.slice(0, 12).map(item => {
        const skipped = duplicateFiles.includes(item);
        return (skipped ? "⏭ " : item.isTrash ? "🗑 " : "• ") +
          String(item.metadata.file_name || "Fichier") + " (" + formatBytes(Number(item.metadata.file_size) || 0) + ")" +
          (skipped ? " — doublon ignoré" : "");
      });
      const moreFiles = fileEntries.length > 12 ? "\n… et " + (fileEntries.length - 12) + " autre(s) fichier(s)" : "";
      const duplicateNames = [...new Set(duplicateFiles.map(item => String(item.metadata.file_name || "Fichier")))];
      const duplicatePreview = duplicateNames.slice(0, 8).join(", ");
      const duplicateMore = duplicateNames.length > 8 ? " et " + (duplicateNames.length - 8) + " autre(s)" : "";
      const duplicateNotice = duplicateFiles.length
        ? "\n\n⏭ Doublons potentiels ignorés : " + duplicateFiles.length + " fichier(s) ayant le même nom, la même taille et le même type MIME sont déjà présents.\n" + duplicatePreview + duplicateMore + "\nIls ne seront pas réimportés. La comparaison porte sur les métadonnées, pas sur le contenu binaire."
        : "\n\nAucun doublon potentiel exact détecté (nom, taille et type).";
      const preview = "APERÇU DE LA SAUVEGARDE\n\n" +
        "Fichiers dans le ZIP : " + files.length + " (actifs : " + fileEntries.filter(item => !item.isTrash).length + ", ancienne corbeille : " + fileEntries.filter(item => item.isTrash).length + ")\n" +
        "Doublons potentiels ignorés : " + duplicateFiles.length + "\nFichiers à importer : " + importEntries.length + "\n" +
        "Dossiers d'origine : " + folders.length + "\nVolume du ZIP : " + formatBytes(totalBytes) + "\nVolume à importer : " + formatBytes(importBytes) +
        "\n\nContenu (12 premiers fichiers) :\n" + (previewLines.join("\n") || "Aucun fichier") + moreFiles +
        duplicateNotice +
        "\n\nDestination : « " + rootName + " »\n\nContinuer ? Les originaux et le ZIP resteront inchangés.";
      if (!confirm(preview)) return;
      if (files.length && !importEntries.length) {
        alert("Aucun fichier importé : les " + duplicateFiles.length + " fichiers de la sauvegarde correspondent déjà à des fichiers présents (même nom, taille et type). Aucun dossier supplémentaire n'a été créé.");
        return;
      }
      if (button) button.textContent = "Création des dossiers...";
      const rootResult = await api("/storage/folders", { method: "POST", body: JSON.stringify({ name: rootName, parent_id: null }) });
      const restoredRootId = rootResult.folder?.id;
      if (!restoredRootId) throw new Error("Le dossier de restauration n'a pas pu être créé.");
      const createdFolders = new Map();
      const pending = [...folders];
      let passes = 0;
      while (pending.length && passes <= folders.length) {
        passes++;
        let progressed = false;
        for (let i = pending.length - 1; i >= 0; i--) {
          const folder = pending[i];
          if (folder.parent_id && !createdFolders.has(folder.parent_id)) continue;
          const parentId = folder.parent_id ? createdFolders.get(folder.parent_id) : restoredRootId;
          const result = await api("/storage/folders", {
            method: "POST",
            body: JSON.stringify({ name: String(folder.name || "Dossier").slice(0, 80), parent_id: parentId })
          });
          createdFolders.set(folder.id, result.folder.id);
          pending.splice(i, 1);
          progressed = true;
        }
        if (!progressed) break;
      }
      if (pending.length) throw new Error("La structure de certains dossiers est invalide. Les éléments déjà créés sont conservés dans « " + rootName + " ».");
      const trashFolderIds = new Map();
      if (importEntries.some(item => item.isTrash)) {
        const rootFolderNames = new Set(folders.filter(folder => !folder.parent_id).map(folder => String(folder.name || "").toLocaleLowerCase("fr")));
        let trashFolderName = "Corbeille (sauvegarde)";
        let suffix = 2;
        while (rootFolderNames.has(trashFolderName.toLocaleLowerCase("fr"))) {
          trashFolderName = "Corbeille (sauvegarde " + suffix + ")";
          suffix++;
        }
        const result = await api("/storage/folders", { method: "POST", body: JSON.stringify({ name: trashFolderName, parent_id: restoredRootId }) });
        trashFolderIds.set(null, result.folder.id);
        const pendingTrash = [...folders];
        let trashPasses = 0;
        while (pendingTrash.length && trashPasses <= folders.length) {
          trashPasses++;
          let progressed = false;
          for (let i = pendingTrash.length - 1; i >= 0; i--) {
            const folder = pendingTrash[i];
            if (folder.parent_id && !trashFolderIds.has(folder.parent_id)) continue;
            const parentId = folder.parent_id ? trashFolderIds.get(folder.parent_id) : trashFolderIds.get(null);
            const result = await api("/storage/folders", { method: "POST", body: JSON.stringify({ name: String(folder.name || "Dossier").slice(0, 80), parent_id: parentId }) });
            trashFolderIds.set(folder.id, result.folder.id);
            pendingTrash.splice(i, 1);
            progressed = true;
          }
          if (!progressed) break;
        }
        if (pendingTrash.length) throw new Error("Structure de la corbeille invalide. Les éléments déjà restaurés sont conservés.");
      }
      let restoredCount = 0;
      for (let i = 0; i < importEntries.length; i++) {
        const item = importEntries[i];
        if (button) button.textContent = "Importation " + (i + 1) + "/" + importEntries.length + "...";
        const destinationId = item.isTrash
          ? (item.metadata.folder_id ? trashFolderIds.get(item.metadata.folder_id) : trashFolderIds.get(null))
          : (item.metadata.folder_id ? createdFolders.get(item.metadata.folder_id) : restoredRootId);
        if (!destinationId) throw new Error("Dossier de destination introuvable pour " + item.metadata.file_name + ". " + restoredCount + " fichier(s) ont déjà été restaurés dans « " + rootName + " ».");
        const form = new FormData();
        const blob = new Blob([item.data], { type: item.metadata.mime_type || "application/octet-stream" });
        form.append("file", blob, String(item.metadata.file_name || "fichier"));
        form.append("folder_id", destinationId);
        await api("/storage/upload", { method: "POST", body: form });
        restoredCount++;
      }
      await loadStorageFiles();
      alert("Restauration terminée.\n\nFichiers copiés : " + restoredCount + "\nDoublons ignorés : " + duplicateFiles.length + "\nDossiers recréés : " + (1 + createdFolders.size + trashFolderIds.size) + "\nVolume importé : " + formatBytes(importBytes) + "\n\nLes originaux et la sauvegarde ZIP sont restés inchangés. Les fichiers de l'ancienne corbeille importés sont des copies actives rangées dans le dossier « Corbeille » de la restauration.");
    } catch (error) {
      alert("Restauration interrompue : " + error.message + "\n\nLes originaux ne sont pas modifiés. Si l'importation avait déjà commencé, les copies déjà importées restent dans le dossier de restauration.");
      try { await loadStorageFiles(); } catch (e) {}
    } finally {
      if (button) { button.disabled = false; button.textContent = originalLabel; }
    }
  };
  picker.click();
}

async function restoreHostedSitesFromBackup() {
  const button = document.querySelector('#storageHistoryCard button[onclick="restoreHostedSitesFromBackup()"]');
  const originalLabel = button?.textContent || "🌐 Restaurer les sites depuis ZIP";
  const picker = document.createElement("input");
  picker.type = "file";
  picker.accept = ".zip,application/zip";
  picker.style.display = "none";
  document.body.appendChild(picker);

  picker.onchange = async () => {
    const archiveFile = picker.files?.[0];
    picker.remove();
    if (!archiveFile) return;
    if (archiveFile.size > 110 * 1024 * 1024) {
      alert("Cette archive dépasse la limite de restauration de 110 Mo.");
      return;
    }
    if (button) { button.disabled = true; button.textContent = "Analyse des sites..."; }
    let pendingDeployment = null;

    try {
      const entries = read221ZipArchive(await archiveFile.arrayBuffer());
      const metadataBytes = entries.get("221Cloud-metadata.json")?.[0];
      if (!metadataBytes) throw new Error("Métadonnées 221Cloud introuvables dans cette archive.");
      let backup;
      try { backup = JSON.parse(new TextDecoder("utf-8").decode(metadataBytes)); }
      catch (e) { throw new Error("Les métadonnées de l'archive sont illisibles."); }
      if (backup.product !== "221Cloud" || !backup.contents) {
        throw new Error("Cette archive ne correspond pas au format 221Cloud.");
      }
      if (!Array.isArray(backup.contents.hosted_sites)) {
        throw new Error("La liste des sites hébergés est absente ou invalide dans les métadonnées.");
      }
      const archivedSites = backup.contents.hosted_sites;
      if (archivedSites.length > 100) throw new Error("Cette sauvegarde contient trop de sites pour une restauration sûre.");
      if (!archivedSites.length) {
        alert("Cette archive ne contient aucun fichier de site hébergé.");
        return;
      }

      const projectsData = await api("/projects");
      const projects = Array.isArray(projectsData.projects) ? projectsData.projects : [];
      const plans = [];
      const unavailable = [];
      let alreadyPresent = 0;
      let archivedFileCount = 0;
      let missingBytes = 0;
      const preservedList = [];

      const safeProjectFolder = value => String(value || "Site")
        .replace(/[\\/:*?"<>|]/g, "_").trim() || "Site";
      const safeArchivedPath = value => String(value || "fichier")
        .split("/")
        .map(part => part.replace(/[\\:*?"<>|]/g, "_"))
        .join("/");

      const archivedProjectIds = new Set();
      for (const archivedSite of archivedSites) {
        if (!archivedSite || typeof archivedSite !== "object" ||
            typeof archivedSite.project_id !== "string" || !archivedSite.project_id.trim() ||
            archivedProjectIds.has(archivedSite.project_id) || !Array.isArray(archivedSite.files)) {
          throw new Error("Métadonnées de site invalides ou projet répété dans la sauvegarde.");
        }
        archivedProjectIds.add(archivedSite.project_id);
        const archivedFiles = archivedSite.files;
        if (archivedFiles.length > 5000) throw new Error("Un site contient trop de fichiers pour une restauration sûre.");
        archivedFileCount += archivedFiles.length;
        const project = projects.find(item => item.id === archivedSite.project_id);
        if (!project) {
          unavailable.push((archivedSite.project_name || "Site") + " : projet introuvable dans ce compte");
          continue;
        }

        const hostingData = await api("/projects/" + encodeURIComponent(project.id) + "/hosting");
        const hosting = hostingData.hosting;
        if (!hosting) {
          unavailable.push((project.name || archivedSite.project_name || "Site") + " : aucun hébergement associé");
          continue;
        }

        const currentFiles = Array.isArray(hostingData.files) ? hostingData.files : [];
        const currentByPath = new Map(currentFiles.map(file => [String(file.file_path || ""), file]));
        const safeFolder = safeProjectFolder(archivedSite.project_name || project.name);
        const missingFiles = [];

        const archivedPaths = new Set();
        for (const archivedFile of archivedFiles) {
          const size = Number(archivedFile?.file_size);
          if (!archivedFile || typeof archivedFile !== "object" ||
              typeof archivedFile.file_path !== "string" ||
              !Number.isSafeInteger(size) || size < 0 || size > MAX_FILE_SIZE_BYTES ||
              (archivedFile.mime_type != null && typeof archivedFile.mime_type !== "string")) {
            throw new Error("Métadonnées de fichier de site invalides ou taille non autorisée.");
          }
          const filePath = safeArchivedPath(archivedFile.file_path);
          if (archivedPaths.has(filePath)) throw new Error("Le site contient plusieurs entrées pour le même chemin : " + filePath);
          archivedPaths.add(filePath);
          if (!filePath || filePath.startsWith("/") || filePath.split("/").some(part => !part || part === "." || part === "..")) {
            throw new Error("Chemin invalide dans la sauvegarde du site " + (project.name || "") + ".");
          }
          const zipPath = "Sites hébergés/" + safeFolder + "/" + filePath;
          const data = entries.get(zipPath)?.[0];
          if (!data) throw new Error("Fichier de site absent de l'archive : " + zipPath);
          if (data.length !== Number(archivedFile.file_size || 0)) {
            throw new Error("Taille incorrecte pour le fichier du site : " + filePath);
          }
          if (Number(archivedFile.file_size || 0) > MAX_FILE_SIZE_BYTES) {
            throw new Error("Le fichier " + filePath + " dépasse la limite actuelle de 20 Mo par fichier.");
          }

          if (currentByPath.has(filePath)) {
            alreadyPresent++;
            preservedList.push((project.name || "Site") + " / " + filePath);
            continue;
          }
          missingFiles.push({
            file_path: filePath,
            file_size: Number(archivedFile.file_size || 0),
            mime_type: archivedFile.mime_type || "application/octet-stream",
            data
          });
        }

        if (missingFiles.length) {
          const finalPaths = new Set(currentFiles.map(file => String(file.file_path || "")));
          missingFiles.forEach(file => finalPaths.add(file.file_path));
          if (!finalPaths.has("index.html")) {
            unavailable.push((project.name || "Site") + " : index.html absent, restauration refusée");
            continue;
          }
          const bytes = missingFiles.reduce((sum, file) => sum + file.file_size, 0);
          missingBytes += bytes;
          plans.push({
            project,
            hosting,
            currentFiles,
            missingFiles,
            bytes
          });
        }
      }

      const missingCount = plans.reduce((sum, plan) => sum + plan.missingFiles.length, 0);
      const missingList = plans.flatMap(plan =>
        plan.missingFiles.map(file => (plan.project.name || "Site") + " / " + file.file_path)
      );
      const preview =
        "APERÇU — RESTAURATION DES SITES HÉBERGÉS\n\n" +
        "Sites dans l'archive : " + archivedSites.length + "\n" +
        "Fichiers de sites dans le ZIP : " + archivedFileCount + "\n" +
        "Fichiers déjà présents (conservés) : " + alreadyPresent + "\n" +
        "Fichiers manquants à ajouter : " + missingCount + "\n" +
        "Volume supplémentaire : " + formatBytes(missingBytes) + "\n" +
        "Sites concernés : " + plans.length +
        (missingList.length ? "\n\nFichiers à ajouter :\n• " + missingList.slice(0, 10).join("\n• ") +
          (missingList.length > 10 ? "\n… et " + (missingList.length - 10) + " autre(s)" : "") : "") +
        (unavailable.length ? "\n\nÉléments non restaurables :\n• " + unavailable.join("\n• ") : "") +
        "\n\nLes fichiers actuels ayant le même chemin seront conservés, même si leur taille diffère. Les autres fichiers du site actuel seront copiés dans la nouvelle version. L'ancienne version restera disponible dans l'historique des déploiements.";

      if (!missingCount) {
        alert(preview + "\n\nAucun fichier de site manquant : aucun déploiement ne sera créé et aucun site ne sera modifié.");
        return;
      }
      if (!confirm(preview + "\n\nContinuer la préparation ?")) return;
      if (!confirm(
        "CONFIRMATION DE PUBLICATION\n\n" +
        "221Cloud va créer une nouvelle version pour " + plans.length + " site(s), y copier les fichiers actuellement publiés, ajouter " +
        missingCount + " fichier(s) manquant(s), puis publier cette version.\n\n" +
        "Le site actuellement en ligne restera actif jusqu'à la publication finale. Confirmer ?"
      )) return;

      let publishedSites = 0;
      let uploadedMissing = 0;
      const publishedReports = [];
      for (let planIndex = 0; planIndex < plans.length; planIndex++) {
        const plan = plans[planIndex];
        if (button) button.textContent = "Préparation site " + (planIndex + 1) + "/" + plans.length + "...";
        const deploymentResult = await api(
          "/projects/" + encodeURIComponent(plan.project.id) + "/deployments",
          { method: "POST" }
        );
        const deploymentId = deploymentResult.deployment?.id;
        if (!deploymentId) throw new Error("Impossible de créer une nouvelle version pour " + plan.project.name + ".");
        pendingDeployment = { projectId: plan.project.id, deploymentId, projectName: plan.project.name };

        await api(
          "/projects/" + encodeURIComponent(plan.project.id) + "/deployments/" +
          encodeURIComponent(deploymentId) + "/clone-active",
          { method: "POST", body: JSON.stringify({ additional_bytes: plan.bytes }) }
        );

        for (let fileIndex = 0; fileIndex < plan.missingFiles.length; fileIndex++) {
          const file = plan.missingFiles[fileIndex];
          if (button) button.textContent = "Ajout " + (fileIndex + 1) + "/" + plan.missingFiles.length + " · " + plan.project.name;
          const form = new FormData();
          const basename = file.file_path.split("/").pop() || "fichier";
          form.append("file", new Blob([file.data], { type: file.mime_type }), basename);
          form.append("file_path", file.file_path);
          await api(
            "/projects/" + encodeURIComponent(plan.project.id) + "/deployments/" +
            encodeURIComponent(deploymentId) + "/files",
            { method: "POST", body: form }
          );
          uploadedMissing++;
        }

        if (button) button.textContent = "Publication · " + plan.project.name;
        await api(
          "/projects/" + encodeURIComponent(plan.project.id) + "/deployments/" +
          encodeURIComponent(deploymentId) + "/publish",
          { method: "POST" }
        );
        publishedSites++;
        publishedReports.push({
          projectName: plan.project.name || "Site",
          deploymentId,
          missingFiles: plan.missingFiles.map(file => file.file_path)
        });
        pendingDeployment = null;
      }

      const restoredPaths = publishedReports.flatMap(report =>
        report.missingFiles.map(filePath => report.projectName + " / " + filePath)
      );
      const formatReportList = items => items.length
        ? "\n• " + items.slice(0, 30).join("\n• ") +
          (items.length > 30 ? "\n… et " + (items.length - 30) + " autre(s)" : "")
        : "\n• Aucun";
      alert(
        "Restauration des sites terminée.\n\n" +
        "SITES PUBLIÉS : " + publishedSites + "\n" +
        publishedReports.map(report => "• " + report.projectName + " (version " + report.deploymentId + ")").join("\n") + "\n\n" +
        "FICHIERS RESTAURÉS : " + uploadedMissing + formatReportList(restoredPaths) + "\n\n" +
        "FICHIERS DÉJÀ PRÉSENTS ET CONSERVÉS : " + alreadyPresent + formatReportList(preservedList) + "\n\n" +
        (unavailable.length ? "ÉLÉMENTS NON RESTAURÉS :" + formatReportList(unavailable) + "\n\n" : "") +
        "Les versions précédentes restent dans l'historique des déploiements."
      );
    } catch (error) {
      let cleanupMessage = "";
      if (pendingDeployment) {
        try {
          const currentHosting = await api("/projects/" + encodeURIComponent(pendingDeployment.projectId) + "/hosting");
          if (currentHosting.hosting?.active_deployment_id === pendingDeployment.deploymentId) {
            cleanupMessage = "\\nLa nouvelle version a bien été publiée pour " + pendingDeployment.projectName + ".";
          } else {
            await api("/projects/" + encodeURIComponent(pendingDeployment.projectId) + "/deployments/" +
              encodeURIComponent(pendingDeployment.deploymentId), { method: "DELETE" });
            cleanupMessage = "\\nLa préparation incomplète a été annulée automatiquement.";
          }
        } catch (cleanupError) {
          cleanupMessage = "\\nUne version en attente n’a pas pu être nettoyée automatiquement ; le site actuellement publié reste prioritaire."; 
        }
      }
      alert("Restauration des sites interrompue : " + error.message + cleanupMessage +
        "\\nAucune ancienne version publiée n’a été supprimée. Toute publication terminée reste active.");
    } finally {
      if (button) { button.disabled = false; button.textContent = originalLabel; }
    }
  };

  picker.click();
}

    button.disabled = true;
    button.textContent = "Préparation du PDF...";

async function exportStorageHistoryCSV() {
  const filter = document.getElementById("storageHistoryFilter")?.value || "all";
  const search = (document.getElementById("storageHistorySearch")?.value || "").trim();
  const button = document.querySelector('#storageHistoryCard button[onclick="exportStorageHistoryCSV()"]');
  const originalLabel = button?.textContent || "⬇ Exporter en CSV";
  if (button) {
    button.disabled = true;
    button.textContent = "Préparation de l’export...";
  }

  try {
    const params = new URLSearchParams({ page: "1", action: filter, search });
    const firstPage = await api("/storage/history?" + params.toString());
    const pagination = firstPage.pagination || { totalPages: 1, total: (firstPage.activities || []).length };
    const allActivities = [...(firstPage.activities || [])];

    for (let page = 2; page <= Number(pagination.totalPages || 1); page++) {
      params.set("page", String(page));
      const pageData = await api("/storage/history?" + params.toString());
      allActivities.push(...(pageData.activities || []));
    }

    if (!allActivities.length) {
      alert("Aucune opération à exporter pour ce filtre ou cette recherche.");
      return;
    }

    const actionLabels = {
      upload: "Fichier ajouté",
      move: "Fichier déplacé",
      trash: "Fichier mis à la corbeille",
      restore: "Fichier restauré",
      permanent_delete: "Fichier supprimé définitivement"
    };
    const columns = ["Date", "Opération", "Nom du fichier", "Taille (octets)", "Détails"];
    const safeCell = value => {
      let text = String(value ?? "");
      if (/^[=+@\\t\\r]/.test(text) || /^-/.test(text)) text = "'" + text;
      return '"' + text.replace(/"/g, '""') + '"';
    };
    const rows = allActivities.map(item => [
      item.created_at || "",
      actionLabels[item.action] || item.action || "",
      item.file_name || "",
      Number(item.file_size) || 0,
      item.details || ""
    ]);
    const csv = "\\uFEFF" + [columns, ...rows].map(row => row.map(safeCell).join(";")).join("\\r\\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const now = new Date();
    const stamp = now.getFullYear() + "-" +
      String(now.getMonth() + 1).padStart(2, "0") + "-" +
      String(now.getDate()).padStart(2, "0");
    link.href = url;
    link.download = "221Cloud-historique-stockage-" + stamp + ".csv";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (error) {
    alert("Impossible d’exporter l’historique : " + error.message);
  } finally {
    if (button) {
      button.disabled = false;
      button.textContent = originalLabel;
    }
  }
}

function renderStorageHistory(activities) {
  const container = document.getElementById("storageHistoryList");
  if (!container) return;
  const pagination = storageHistoryPagination || { page: 1, pageSize: 20, total: activities.length, totalPages: 1 };
  const total = Number(pagination.total || 0);
  const page = Number(pagination.page || 1);
  const pageSize = Number(pagination.pageSize || 20);
  const totalPages = Math.max(1, Number(pagination.totalPages || 1));
  const firstItem = total ? ((page - 1) * pageSize) + 1 : 0;
  const lastItem = Math.min(page * pageSize, total);
  const count = document.getElementById("storageHistoryResultCount");
  if (count) count.textContent = total ? firstItem + "–" + lastItem + " sur " + total + " opération(s)" : "0 opération";
  const pageLabel = document.getElementById("storageHistoryPageLabel");
  if (pageLabel) pageLabel.textContent = "Page " + page + " sur " + totalPages;
  const previous = document.getElementById("storageHistoryPrevious");
  if (previous) previous.disabled = page <= 1;
  const next = document.getElementById("storageHistoryNext");
  if (next) next.disabled = page >= totalPages;
  if (!activities.length) {
    const filter = document.getElementById("storageHistoryFilter")?.value || "all";
    const search = (document.getElementById("storageHistorySearch")?.value || "").trim();
    container.innerHTML = total === 0 && (filter !== "all" || search)
      ? '<div class="empty">Aucune opération ne correspond à ce filtre ou à cette recherche.</div>'
      : '<div class="empty">Aucune activité enregistrée pour le moment. Les prochaines opérations de stockage apparaîtront ici.</div>';
    return;
  }
  const labels = {
    upload: { icon: "⬆️", title: "Fichier ajouté" },
    move: { icon: "↔️", title: "Fichier déplacé" },
    trash: { icon: "🗑️", title: "Fichier mis à la corbeille" },
    restore: { icon: "♻️", title: "Fichier restauré" },
    permanent_delete: { icon: "❌", title: "Fichier supprimé définitivement" }
  };
  container.innerHTML = activities.map(item => {
    const info = labels[item.action] || { icon: "📁", title: "Activité de stockage" };
    const date = item.created_at ? new Date(item.created_at.replace(" ", "T") + "Z") : null;
    const dateLabel = date && !Number.isNaN(date.getTime())
      ? date.toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" })
      : "Date indisponible";
    return '<div class="item-card" style="margin-bottom:10px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">' +
      '<div style="min-width:0;flex:1;"><div style="font-weight:700;">' + info.icon + " " + info.title + '</div>' +
      '<div style="overflow-wrap:anywhere;">' + escapeHTML(item.file_name || "Fichier") + '</div>' +
      '<div class="muted">' + escapeHTML(item.details || "") + '</div><div class="muted">' + dateLabel + '</div></div>' +
      '<div class="muted" style="white-space:nowrap;">' + formatBytes(Number(item.file_size) || 0) + '</div></div></div>';
  }).join("");
}
function renderStorageFolders() {
  const folderList = document.getElementById("storageFoldersList");
  const breadcrumb = document.getElementById("storageFolderBreadcrumb");
  if (!folderList) return;

  const currentFolder = storageFoldersCache.find(folder => folder.id === activeStorageFolderId);
  const uploadDestination = document.getElementById("storageUploadDestination");
  if (uploadDestination) {
    uploadDestination.textContent = activeStorageFolderId
      ? "Destination : " + (currentFolder?.name || "Dossier sélectionné")
      : "Destination : Racine";
  }
  if (breadcrumb) {
    const path = [];
    let cursor = currentFolder;
    const visited = new Set();

    while (cursor && !visited.has(cursor.id)) {
      visited.add(cursor.id);
      path.unshift(cursor);
      cursor = storageFoldersCache.find(folder => folder.id === cursor.parent_id) || null;
    }

    breadcrumb.innerHTML = [
      `<button type="button" class="secondary" onclick="openStorageFolder('')">Racine</button>`,
      ...path.map((folder, index) => {
        const folderId = escapeHTML(folder.id);
        const folderName = escapeHTML(folder.name);
        const isCurrent = index === path.length - 1;
        return isCurrent
          ? `<span aria-current="location" style="font-weight:700;color:#fff;">› ${folderName}</span>`
          : `<button type="button" class="secondary" onclick="openStorageFolder(${escapeJSAttribute(folder.id)})">› ${folderName}</button>`;
      })
    ].join(' ');
  }

  const folders = storageFoldersCache.filter(folder =>
    (folder.parent_id || null) === (activeStorageFolderId || null)
  );
  folderList.innerHTML = folders.length
    ? folders.map(folder => {
      const folderStats = getStorageFolderStats(folder.id);
      const folderUsagePercent = storageQuotaLimit > 0
        ? (folderStats.bytes / storageQuotaLimit) * 100
        : 0;
      const folderUsageWidth = Math.min(100, Math.max(0, folderUsagePercent));
      const folderUsageLabel = folderUsagePercent < 0.01 && folderStats.bytes > 0
        ? "<0,01 %"
        : folderUsagePercent.toLocaleString("fr-FR", { maximumFractionDigits: 2, minimumFractionDigits: 2 }) + " %";
      const folderId = escapeHTML(folder.id);
      const folderName = escapeHTML(folder.name);
      return `
        <div class="storage-folder-row">
          <button class="storage-folder-card" onclick="openStorageFolder(${escapeJSAttribute(folder.id)})">
            <span class="storage-folder-icon">📁</span>
            <span class="storage-folder-name">${folderName}</span>
            <span class="storage-folder-count">${folderStats.count} ${folderStats.count === 1 ? "fichier" : "fichiers"} · ${formatBytes(folderStats.bytes)}</span>
            <span class="storage-folder-arrow">›</span>
          </button>
          <div class="storage-folder-usage">
            <div class="storage-folder-usage-track" role="progressbar" aria-label="Part du quota utilisée par le dossier ${folderName}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100, Math.max(0, folderUsagePercent)).toFixed(2)}">
              <div class="storage-folder-usage-fill" style="width:${folderUsageWidth.toFixed(2)}%"></div>
            </div>
            <div class="storage-folder-usage-label">
              <span>${folderUsageLabel} du quota total</span>
              <span>${formatBytes(folderStats.bytes)} / ${formatBytes(storageQuotaLimit)}</span>
            </div>
          </div>
          <div class="storage-folder-actions">
            <button type="button" class="secondary" onclick="toggleStorageFolderDetails(${escapeJSAttribute(folder.id)})">Détails</button>
            <button type="button" class="secondary" onclick="renameStorageFolder(${escapeJSAttribute(folder.id)})">Renommer</button>
            <button type="button" class="danger" onclick="deleteStorageFolder(${escapeJSAttribute(folder.id)})">Supprimer</button>
          </div>
          <div id="storageFolderDetails-${folderId}" class="hidden" style="margin:12px 4px 4px;padding:14px;border:1px solid var(--border);border-radius:12px;background:rgba(8,17,33,.55);"></div>
        </div>
      `;
    }).join("")
    : `<div class="empty storage-empty-folder">📂<br>Aucun dossier ici pour le moment.</div>`;
}

function getStorageFolderStats(folderId, visited = new Set()) {
  if (visited.has(folderId)) {
    return { count: 0, bytes: 0, directCount: 0, directBytes: 0, children: [] };
  }
  const nextVisited = new Set(visited);
  nextVisited.add(folderId);
  const children = storageFoldersCache.filter(folder => folder.parent_id === folderId);
  const directFiles = storageFilesCache.filter(file => file.folder_id === folderId);
  const directBytes = directFiles.reduce((sum, file) => sum + Math.max(0, Number(file.file_size) || 0), 0);
  let count = directFiles.length;
  let bytes = directBytes;
  children.forEach(child => {
    const childStats = getStorageFolderStats(child.id, nextVisited);
    count += childStats.count;
    bytes += childStats.bytes;
  });
  return { count, bytes, directCount: directFiles.length, directBytes, children };
}

    : '<p class="muted">Aucun fichier directement dans ce dossier.</p>';

function renderStorageTrash() {
  const list = document.getElementById("storageFilesList");
  if (!list) return;
  if (!storageTrashCache.length) {
    list.innerHTML = '<div class="empty">🗑️<br>La corbeille est vide.</div>';
    const count = document.getElementById("storageTrashResultCount");
    if (count) count.textContent = "0 fichier · Espace occupé : 0 octet";
    return;
  }

  const search = (document.getElementById("storageTrashSearchInput")?.value || "").trim().toLowerCase();
  const type = document.getElementById("storageTrashTypeFilter")?.value || "all";
  const filteredFiles = storageTrashCache.filter(file => {
    const name = String(file.file_name || "").toLowerCase();
    const mime = String(file.mime_type || "").toLowerCase();
    const matchesSearch = !search || name.includes(search) || mime.includes(search);
    const isImage = mime.startsWith("image/");
    const isVideo = mime.startsWith("video/");
    const isDocument = mime.includes("pdf") || mime.startsWith("text/")
      || mime.includes("word") || mime.includes("excel")
      || mime.includes("spreadsheet") || mime.includes("presentation");
    const matchesType = type === "all"
      || (type === "image" && isImage)
      || (type === "video" && isVideo)
      || (type === "document" && isDocument)
      || (type === "other" && !isImage && !isVideo && !isDocument);
    return matchesSearch && matchesType;
  });

  const sort = document.getElementById("storageTrashSort")?.value || "date_desc";
  filteredFiles.sort((a, b) => {
    if (sort === "name_asc" || sort === "name_desc") {
      const result = String(a.file_name || "").localeCompare(String(b.file_name || ""), "fr", { sensitivity: "base" });
      return sort === "name_asc" ? result : -result;
    }
    if (sort === "size_asc" || sort === "size_desc") {
      const result = Number(a.file_size || 0) - Number(b.file_size || 0);
      return sort === "size_asc" ? result : -result;
    }
    const dateA = Date.parse(a.deleted_at || "") || 0;
    const dateB = Date.parse(b.deleted_at || "") || 0;
    return sort === "date_asc" ? dateA - dateB : dateB - dateA;
  });

  const trashTotalBytes = storageTrashCache.reduce(
    (total, file) => total + Math.max(0, Number(file.file_size) || 0),
    0
  );
  const count = document.getElementById("storageTrashResultCount");
  if (count) {
    count.textContent = filteredFiles.length + " résultat(s) affiché(s) sur "
      + storageTrashCache.length + " fichier(s) · Espace occupé : "
      + formatBytes(trashTotalBytes);
  }

  if (!filteredFiles.length) {
    list.innerHTML = '<div class="empty">Aucun fichier ne correspond à votre recherche ou à ce filtre.</div>';
    return;
  }

  list.innerHTML = filteredFiles.map(file => {
    const mimeType = String(file.mime_type || "").toLowerCase();
    const fileIcon = mimeType.startsWith("image/") ? "🖼️"
      : mimeType.startsWith("video/") ? "🎬"
      : mimeType.includes("pdf") ? "📕" : "📄";
    return `
      <div class="item-card storage-file-card">
        <div class="storage-file-heading">
          <span class="storage-file-icon">${fileIcon}</span>
          <div class="storage-file-details">
            <div class="file-name">${escapeHTML(file.file_name || "Fichier sans nom")}</div>
            <p class="muted">${escapeHTML(formatBytes(file.file_size))} · ${escapeHTML(file.mime_type || "Fichier")}</p>
            <div class="muted">Mis à la corbeille le : ${escapeHTML(formatDate(file.deleted_at))}</div>
          </div>
        </div>
        <div class="item-actions">
          <button class="secondary" onclick="restoreStorageFile(${escapeJSAttribute(file.id)})">Restaurer</button>
          <button class="danger" onclick="permanentlyDeleteStorageFile(${escapeJSAttribute(file.id)})">Supprimer définitivement</button>
        </div>
      </div>
    `;
  }).join("");
}

async function permanentlyDeleteStorageFile(id) {

async function uploadStorageFile() {
  const input = document.getElementById("storageFileInput");
  const message = document.getElementById("uploadMessage");
  const button = document.getElementById("uploadButton");
  const file = input?.files?.[0];

  if (!file) {
    message.innerHTML = `<p class="error-text">Veuillez sélectionner un fichier.</p>`;
    return;
  }

  if (file.size > MAX_FILE_SIZE_BYTES) {
    message.innerHTML = `<p class="error-text">Ce fichier dépasse la limite de 20 Mo.</p>`;
    return;
  }

  const formData = new FormData();
  formData.append("file", file);
  if (activeStorageFolderId) formData.append("folder_id", activeStorageFolderId);

  button.disabled = true;
  button.textContent = "Envoi en cours...";
  message.innerHTML = `<p class="muted">Envoi de ${escapeHTML(file.name)}...</p>`;

  try {
    const uploadResult = await api("/storage/upload", {
      method:"POST",
      body:formData
    });

    if ((uploadResult.file?.folder_id || null) !== (activeStorageFolderId || null)) {
      throw new Error("Le fichier a été envoyé, mais le dossier de destination n'a pas été confirmé. Actualisez la liste avant de réessayer.");
    }

    message.innerHTML = `<p class="success-text">Fichier envoyé avec succès !</p>`;
    input.value = "";
    await loadStorageFiles();
  } catch(error) {
    message.innerHTML = `<p class="error-text">${escapeHTML(error.message)}</p>`;
  } finally {
    button.disabled = false;
    button.textContent = "Envoyer dans le cloud";
  }
}

async function downloadStorageFile(id) {
  try {
    const response = await fetch(
      API + "/storage/" + encodeURIComponent(id) + "/download",
      {credentials:"same-origin"}
    );

    if (!response.ok) {
      let data = {};
      try { data = await response.json(); } catch(e) {}
      throw new Error(data.error || "Impossible de télécharger ce fichier.");
    }

    const blob = await response.blob();
    const file = storageFilesCache.find(item => item.id === id);
    const fileName = file?.file_name || "fichier";

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch(error) {
    alert(error.message);
  }
}

  if (!confirm("Déplacer ce fichier dans la corbeille ? Vous pourrez le restaurer plus tard.")) return;

  try {
    await api("/storage/" + encodeURIComponent(id), {method:"DELETE"});
    await loadStorageFiles();
  } catch(error) {
    alert(error.message);
  }
}

async function renameStorageFile(id, currentName) {
  const newName = prompt(
    "Entrez le nouveau nom du fichier, avec son extension :",
    currentName
  );

  if (newName === null || !newName.trim()) {
    return;
  }

  if (newName.trim() === currentName) {
    return;
  }

  try {
    await api(
      "/storage/" + encodeURIComponent(id) + "/rename",
      {
        method: "PATCH",
        body: JSON.stringify({
          name: newName.trim()
        })
      }
    );

    alert("Fichier renommé avec succès.");
    await loadStorageFiles();

  } catch (error) {
    alert(error.message);
  }
}

async function restoreWebsiteDeployment(projectId, sourceDeploymentId) {
  let pendingDeploymentId = null;
  try {
    const hostingData = await api("/projects/" + encodeURIComponent(projectId) + "/hosting");
    const sourceDeployment = (hostingData.deployments || []).find(item => item.id === sourceDeploymentId);
    if (!sourceDeployment || sourceDeployment.status !== "published") {
      throw new Error("Cette ancienne version n'est plus disponible pour restauration.");
    }
    if (hostingData.hosting?.active_deployment_id === sourceDeploymentId) {
      alert("Cette version est déjà celle qui est publiée actuellement.");
      return;
    }

    const fileData = await api(
      "/projects/" + encodeURIComponent(projectId) + "/deployments/" +
      encodeURIComponent(sourceDeploymentId) + "/files"
    );
    const files = Array.isArray(fileData.files) ? fileData.files : [];
    if (!files.length) throw new Error("Cette ancienne version ne contient aucun fichier.");
    if (!files.some(file => String(file.file_path || "") === "index.html")) {
      throw new Error("Cette ancienne version ne contient pas index.html à la racine. Elle ne peut pas être restaurée.");
    }

    const totalBytes = files.reduce((sum, file) => sum + Math.max(0, Number(file.file_size) || 0), 0);
    const fileList = files.slice(0, 20).map(file =>
      "• " + file.file_path + " (" + formatBytes(Number(file.file_size) || 0) + ")"
    ).join("\n");
    const moreFiles = files.length > 20 ? "\n… et " + (files.length - 20) + " autre(s)" : "";
    const createdLabel = formatDate(sourceDeployment.created_at);
    const preview =
      "APERÇU — RESTAURATION D'UNE ANCIENNE VERSION\n\n" +
      "Version sélectionnée : " + sourceDeploymentId + "\n" +
      "Créée le : " + createdLabel + "\n" +
      "Fichiers à restaurer : " + files.length + "\n" +
      "Volume à recopier : " + formatBytes(totalBytes) + "\n\n" +
      "FICHIERS DE CETTE VERSION :\n" + fileList + moreFiles + "\n\n" +
      "Cette restauration remettra exactement les fichiers de la version sélectionnée en ligne. " +
      "La version actuellement publiée sera conservée dans l'historique et ne sera remplacée qu'au moment de la publication.";
    if (!confirm(preview + "\n\nContinuer la préparation ?")) return;
    if (!confirm(
      "CONFIRMATION FINALE\n\n" +
      "221Cloud va créer une nouvelle version, recopier les " + files.length +
      " fichiers de la version choisie, puis la publier.\n\n" +
      "Le site actuel restera en ligne jusqu'à la publication finale. Confirmer la restauration ?"
    )) return;

    const created = await api(
      "/projects/" + encodeURIComponent(projectId) + "/deployments",
      { method: "POST" }
    );
    pendingDeploymentId = created.deployment?.id;
    if (!pendingDeploymentId) throw new Error("Impossible de préparer la nouvelle version.");

    const cloned = await api(
      "/projects/" + encodeURIComponent(projectId) + "/deployments/" +
      encodeURIComponent(pendingDeploymentId) + "/clone-active",
      {
        method: "POST",
        body: JSON.stringify({ source_deployment_id: sourceDeploymentId })
      }
    );
    if (Number(cloned.cloned) !== files.length) {
      throw new Error("La copie des fichiers est incomplète (" + Number(cloned.cloned || 0) +
        "/" + files.length + "). La version actuelle n'a pas été remplacée.");
    }

    const published = await api(
      "/projects/" + encodeURIComponent(projectId) + "/deployments/" +
      encodeURIComponent(pendingDeploymentId) + "/publish",
      { method: "POST" }
    );
    pendingDeploymentId = null;
    alert(
      "Ancienne version restaurée avec succès.\n\n" +
      "Fichiers restaurés : " + files.length + "\n" +
      "Volume recopié : " + formatBytes(totalBytes) + "\n" +
      "Nouvelle version publiée : " + published.deployment.id + "\n\n" +
      "Les versions précédentes sont conservées dans l'historique."
    );
    await renderHostingPage();
  } catch (error) {
    let cleanup = "";
    if (pendingDeploymentId) {
      try {
        const currentHosting = await api("/projects/" + encodeURIComponent(projectId) + "/hosting");
        if (currentHosting.hosting?.active_deployment_id === pendingDeploymentId) {
          cleanup = "\nLa nouvelle version a bien été publiée.";
        } else {
          await api(
            "/projects/" + encodeURIComponent(projectId) + "/deployments/" +
            encodeURIComponent(pendingDeploymentId),
            { method: "DELETE" }
          );
          cleanup = "\nLa préparation incomplète a été annulée automatiquement.";
        }
      } catch (cleanupError) {
        cleanup = "\nLa préparation n'a pas pu être nettoyée automatiquement. Le site actuellement publié reste prioritaire.";
      }
    }
    alert("Restauration impossible : " + error.message + cleanup);
    await renderHostingPage();
  }
}

async function loadProReminders() {
  const list = document.getElementById("proRemindersList");
  if (!list) return;
  const count = document.getElementById("proRemindersCount");
  try {
    const [calendarData, jobsData, invoiceData] = await Promise.all([
      api("/pro/calendar"),
      api("/pro/jobs"),
      api("/pro/invoices")
    ]);
    const now = new Date();
    const today = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
    const tomorrowDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const tomorrow = tomorrowDate.getFullYear() + "-" + String(tomorrowDate.getMonth() + 1).padStart(2, "0") + "-" + String(tomorrowDate.getDate()).padStart(2, "0");
    const endDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7);
    const end = endDate.getFullYear() + "-" + String(endDate.getMonth() + 1).padStart(2, "0") + "-" + String(endDate.getDate()).padStart(2, "0");
    const events = (calendarData.events || []).filter(item => item.status === "planned" && item.event_date >= today && item.event_date <= end);
    const jobs = (jobsData.jobs || []).filter(item => item.status !== "done" && item.start_date && item.start_date >= today && item.start_date <= end);
    const invoices = (invoiceData.invoices || []).filter(item => Number(item.total_amount || 0) > Number(item.amount_paid || 0));
    const reminders = [];
    for (const item of events) {
      const when = item.event_date === today ? "Aujourd’hui" : item.event_date === tomorrow ? "Demain" : formatDate(item.event_date);
      reminders.push({
        priority: item.event_date === today ? 0 : item.event_date === tomorrow ? 1 : 2,
        html: '<div class="item-card"><strong>📅 Rendez-vous · ' + escapeHTML(when) + (item.event_time ? ' à ' + escapeHTML(item.event_time) : '') + '</strong><div style="margin-top:5px">' + escapeHTML(item.title) + '</div><div class="muted" style="margin-top:4px">Client : ' + escapeHTML(item.client_name) + '</div></div>'
      });
    }
    for (const item of jobs) {
      const when = item.start_date === today ? "Aujourd’hui" : item.start_date === tomorrow ? "Demain" : formatDate(item.start_date);
      reminders.push({
        priority: item.start_date === today ? 0 : item.start_date === tomorrow ? 1 : 2,
        html: '<div class="item-card"><strong>🏗️ Chantier · ' + escapeHTML(when) + '</strong><div style="margin-top:5px">' + escapeHTML(item.title) + '</div><div class="muted" style="margin-top:4px">Client : ' + escapeHTML(item.client_name) + '</div></div>'
      });
    }
    if (invoices.length) {
      const totalRemaining = invoices.reduce((sum, item) => sum + Math.max(0, Number(item.total_amount || 0) - Number(item.amount_paid || 0)), 0);
      reminders.push({
        priority: 3,
        html: '<div class="item-card"><strong>💰 Paiements à recevoir</strong><div style="margin-top:5px">' + invoices.length + ' facture' + (invoices.length > 1 ? 's' : '') + ' avec un reste à payer</div><div class="muted" style="margin-top:4px">' + escapeHTML(totalRemaining.toLocaleString("fr-FR")) + ' FCFA à recevoir au total</div><button type="button" class="secondary" style="margin-top:9px" onclick="renderProInvoicesPage()">Voir les factures</button></div>'
      });
    }
    reminders.sort((a, b) => a.priority - b.priority);
    if (count) count.textContent = reminders.length + (reminders.length > 1 ? " rappels" : " rappel");
    list.innerHTML = reminders.length
      ? reminders.slice(0, 8).map(item => item.html).join("") + (reminders.length > 8 ? '<p class="muted">Et ' + (reminders.length - 8) + ' autre(s) rappel(s)…</p>' : '')
      : '<div class="empty">Aucun rappel pour le moment. Tout est à jour ! 😊</div>';
  } catch (error) {
    if (count) count.textContent = "Indisponible";
    list.innerHTML = '<div class="muted">Les rappels ne peuvent pas être chargés pour le moment. Réessayez en actualisant la page.</div>';
  }
}

let proInterventionsCache = [];
let proInterventionsFilter = "active";

function filterProInterventions(filter) {
  proInterventionsFilter = filter;
  const list = document.getElementById("proInterventionsList");
  if (!list) return;
  let items = proInterventionsCache.slice();
  if (filter === "active") items = items.filter(item => item.status !== "done");
  if (filter === "urgent") items = items.filter(item => item.priority === "urgent" && item.status !== "done");
  if (filter === "history") items = items.filter(item => item.status === "done");
  const count = document.getElementById("proInterventionCount");
  if (count) count.textContent = items.length + (items.length > 1 ? " interventions" : " intervention");
  list.innerHTML = items.length ? items.map(item => {
    const priorityLabel = item.priority === "urgent" ? "URGENT" : item.priority === "low" ? "Faible" : "Moyen";
    const statusLabel = item.status === "in_progress" ? "En cours" : item.status === "done" ? "Terminée" : "Nouvelle";
    const completedDate = item.completed_at ? item.completed_at.slice(0, 10).split("-").reverse().join("/") : "";
    return '<div class="item-card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><strong>' + escapeHTML(item.title) + '</strong><strong>' + escapeHTML(priorityLabel) + '</strong></div><div class="muted" style="margin-top:6px">👤 ' + escapeHTML(item.client_name) + (item.client_phone ? ' · ☎️ ' + escapeHTML(item.client_phone) : '') + (item.address ? ' · 📍 ' + escapeHTML(item.address) : '') + '</div>' + (item.description ? '<p style="margin:8px 0 0">' + escapeHTML(item.description) + '</p>' : '') + (item.status === "done" ? '<p class="muted" style="margin:8px 0 0">✓ Terminée' + (completedDate ? ' le ' + escapeHTML(completedDate) : '') + '</p>' : '') + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><label style="flex:1;min-width:130px">Urgence<select id="proInterventionPriority-' + escapeHTML(item.id) + '" onchange="updateProIntervention(\'' + escapeHTML(item.id) + '\')"><option value="low"' + (item.priority === "low" ? " selected" : "") + '>Faible</option><option value="medium"' + (item.priority === "medium" ? " selected" : "") + '>Moyen</option><option value="urgent"' + (item.priority === "urgent" ? " selected" : "") + '>Urgent</option></select></label><label style="flex:1;min-width:130px">État<select id="proInterventionStatus-' + escapeHTML(item.id) + '" onchange="updateProIntervention(\'' + escapeHTML(item.id) + '\')"><option value="new"' + (item.status === "new" ? " selected" : "") + '>Nouvelle</option><option value="in_progress"' + (item.status === "in_progress" ? " selected" : "") + '>En cours</option><option value="done"' + (item.status === "done" ? " selected" : "") + '>Terminée</option></select></label></div><button type="button" class="secondary" style="margin-top:10px" onclick="deleteProIntervention(\'' + escapeHTML(item.id) + '\')">Supprimer</button></div>';
  }).join("") : '<div class="empty">Aucune intervention dans cette liste.</div>';
}

async function loadProInterventions() {
  const list = document.getElementById("proInterventionsList");
  if (!list) return;
  try {
    const data = await api("/pro/interventions");
    proInterventionsCache = Array.isArray(data.interventions) ? data.interventions : [];

async function saveProIntervention(event) {
  event.preventDefault();
  const form = document.getElementById("proInterventionForm");

  const message = document.getElementById("proInterventionMessage");
  if (!form || !button || !message) return;
  const body = {

    address: document.getElementById("proInterventionAddress").value.trim(),

  };
  if (!body.title || !body.client_id) {
    message.textContent = "Indiquez le problème et choisissez un client.";

async function updateProIntervention(interventionId) {
  const status = document.getElementById("proInterventionStatus-" + interventionId)?.value;

  try {
    await api("/pro/interventions/" + encodeURIComponent(interventionId), {

    });

    await loadProInterventions();
    proInterventionsFilter = currentFilter;
  } catch (error) {
    alert(error.message || "Impossible de modifier l’intervention.");
    await loadProInterventions();
  }
}

function filterProCalendar(filter) {
  proCalendarFilter = filter;
  const list = document.getElementById("proCalendarList");
  if (!list) return;
  const now = new Date();
  const today = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7);
  const endValue = end.getFullYear() + "-" + String(end.getMonth() + 1).padStart(2, "0") + "-" + String(end.getDate()).padStart(2, "0");
  const events = proCalendarEventsCache.filter(event => {
    if (filter === "today") return event.event_date === today;
    if (filter === "week") return event.event_date >= today && event.event_date <= endValue;
    return true;
  });
  const count = document.getElementById("proCalendarCount");
  if (count) count.textContent = events.length + (events.length > 1 ? " rendez-vous" : " rendez-vous");
  list.innerHTML = events.length ? events.map(event => {
    const statusLabel = event.status === "done" ? "Effectué" : event.status === "cancelled" ? "Annulé" : "Prévu";
