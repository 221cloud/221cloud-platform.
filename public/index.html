
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d19">
  <title>221Cloud — Votre espace cloud</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080d19;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 430px;
      background: #111b2e;
      padding: 32px 25px;
      border: 1px solid #263751;
      border-radius: 18px;
    }
    .logo { font-size: 29px; font-weight: bold; color: #55aaff; }
    .subtitle { color: #aab8cc; line-height: 1.5; margin-bottom: 28px; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    label { display: block; margin: 16px 0 8px; font-size: 14px; }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #34465f;
      background: #091322;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      border: 0;
      border-radius: 9px;
      background: #2589ed;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    .switch { text-align: center; color: #aab8cc; margin-top: 22px; font-size: 14px; }
    .switch a { color: #55aaff; cursor: pointer; }
    #message { margin-top: 16px; font-size: 14px; line-height: 1.5; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">221Cloud</div>
    <p class="subtitle">Votre espace numérique. Vos projets, vos fichiers, votre cloud.</p>

    <section id="register">
      <h1>Créer un compte</h1>
      <p class="subtitle">Rejoignez votre espace 221Cloud.</p>
      <form id="registerForm">
        <label for="full_name">Nom complet</label>
        <input id="full_name" name="full_name" type="text" autocomplete="name" required>

        <label for="register_email">Adresse e-mail</label>
        <input id="register_email" name="email" type="email" autocomplete="email" required>

        <label for="register_password">Mot de passe (12 caractères minimum)</label>
        <input id="register_password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>

        <button type="submit">Créer mon compte</button>
      </form>
      <p class="switch">Déjà inscrit ? <a id="showLogin">Se connecter</a></p>
    </section>

    <section id="login" class="hidden">
      <h1>Connexion</h1>
      <p class="subtitle">Retrouvez votre espace personnel.</p>
      <form id="loginForm">
        <label for="login_email">Adresse e-mail</label>
        <input id="login_email" name="email" type="email" autocomplete="email" required>

        <label for="login_password">Mot de passe</label>
        <input id="login_password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Se connecter</button>
      </form>
      <p class="switch">Pas encore de compte ? <a id="showRegister">Créer un compte</a></p>
    </section>

    <p id="message" role="status"></p>
  </main>

  <script>
    const registerSection = document.getElementById("register");
    const loginSection = document.getElementById("login");
    const message = document.getElementById("message");

    document.getElementById("showLogin").onclick = () => {
      registerSection.classList.add("hidden");
      loginSection.classList.remove("hidden");
      message.textContent = "";
    };

    document.getElementById("showRegister").onclick = () => {
      loginSection.classList.add("hidden");
      registerSection.classList.remove("hidden");
      message.textContent = "";
    };

    async function sendForm(path, data, button) {
      button.disabled = true;
      message.textContent = "Chargement...";
      try {
        const response = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(data)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Une erreur est survenue.");
        message.textContent = result.message || "Opération réussie.";
        if (path === "/api/register" || path === "/api/login") {
          message.textContent += " Bienvenue sur 221Cloud !";
        }
      } catch (error) {
        message.textContent = error.message || "Impossible de contacter le serveur.";
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById("registerForm").onsubmit = event => {
      event.preventDefault();
      const form = new FormData(event.target);
      sendForm("/api/register", {
        full_name: form.get("full_name"),
        email: form.get("email"),
        password: form.get("password")
      }, event.target.querySelector("button"));
    };

    document.getElementById("loginForm").onsubmit = event => {
      event.preventDefault();
      const form = new FormData(event.target);
      sendForm("/api/login", {
        email: form.get("email"),
        password: form.get("password")
      }, event.target.querySelector("button"));
    };
  </script>
</body>
</html>
