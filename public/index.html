
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>221Cloud — Votre espace numérique</title>

<style>
:root {
  --bg:#080b18;
  --panel:#11182b;
  --panel2:#192440;
  --border:#283653;
  --text:#f4f7fc;
  --muted:#94a3b8;
  --blue:#438cff;
  --purple:#8b72ff;
  --green:#24d6a0;
  --red:#ff647c;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at 80% 0%,rgba(75,75,190,.13),transparent 38%),var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
button,input,select { font:inherit; }
button {
  cursor:pointer;
  border:0;
  border-radius:10px;
  padding:11px 16px;
  color:white;
  background:linear-gradient(110deg,#397fff,#6558e9);
  font-weight:600;
  transition:.2s;
}
button:hover { filter:brightness(1.12); }
button:active { transform:scale(.98); }
button:disabled { opacity:.5; cursor:not-allowed; }
input,select {
  width:100%;
  padding:12px;
  margin-top:7px;
  border:1px solid var(--border);
  border-radius:9px;
  background:#0b1222;
  color:white;
  outline:none;
}
input:focus,select:focus { border-color:var(--blue); }
label {
  display:block;
  margin-top:15px;
  color:#cbd5e1;
  font-size:14px;
}
.hidden { display:none !important; }
.muted { color:var(--muted); }
.brand {
  font-size:25px;
  font-weight:800;
  letter-spacing:-1.2px;
}
.brand span {
  background:linear-gradient(100deg,#438cff,#9b79ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.auth-screen {
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.auth-card {
  width:100%;
  max-width:420px;
  padding:28px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
}
.auth-card h1 { margin-bottom:8px; }
.auth-card button:not(.link) { width:100%; margin-top:20px; }
.auth-switch {
  margin-top:20px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}
.link {
  color:#69a4ff;
  cursor:pointer;
  background:none;
  padding:0;
}
.app { min-height:100vh; }
header {
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid rgba(104,135,190,.18);
  background:rgba(13,19,36,.94);
  backdrop-filter:blur(16px);
  position:sticky;
  top:0;
  z-index:5;
}
.layout {
  display:flex;
  min-height:calc(100vh - 68px);
}
aside {
  width:245px;
  padding:22px 14px;
  border-right:1px solid rgba(104,135,190,.16);
  background:rgba(12,18,34,.96);
  flex-shrink:0;
}
.nav-title {
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:12px;
}
.nav-btn {
  display:block;
  width:100%;
  text-align:left;
  background:transparent;
  color:#bdc9dc;
  margin-bottom:6px;
  font-weight:500;
  border-radius:10px;
}
.nav-btn.active,.nav-btn:hover {
  background:linear-gradient(100deg,rgba(57,133,255,.25),rgba(139,92,246,.13));
  color:white;
  box-shadow:inset 3px 0 #5595ff;
}
main {
  flex:1;
  padding:30px;
  min-width:0;
  max-width:1250px;
}
.page-title { font-size:26px; margin:0 0 8px; }
.page-subtitle { color:var(--muted); margin:0 0 25px; line-height:1.6; }
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:16px;
}
.card {
  background:linear-gradient(145deg,#141e34,#101729);
  border:1px solid rgba(110,140,195,.17);
  border-radius:15px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 8px 28px rgba(0,0,0,.13);
}
.card h3 { margin:0 0 10px; }
.stat {
  font-size:31px;
  font-weight:800;
  margin:12px 0 5px;
  letter-spacing:-1px;
}
.section-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin:27px 0 15px;
}
.section-head h2 { font-size:19px; margin:0; }
.item-card {
  background:linear-gradient(145deg,#141e34,#101729);
  border:1px solid rgba(110,140,195,.17);
  border-radius:13px;
  padding:18px;
  margin-bottom:12px;
}#storageFilesList .item-card {
  background: linear-gradient(145deg, #17243d, #111b30);
  border: 1px solid rgba(105, 145, 220, 0.2);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
  transition: transform 0.25s ease, border-color 0.25s ease;
}
#storageFilesList .item-card p {
  color: #aebdd3;
  font-size: 13px;
  line-height: 1.7;
  margin: 5px 0;
}

#storageFilesList .item-card .muted {
  color: #91a3bd;
  font-size: 12px;
}
#storageFilesList .item-card:hover {
  transform: translateY(-2px);
  border-color: rgba(105, 145, 255, 0.45);
}

#storageFilesList .item-actions {
  margin-top: 16px;
}
.item-card h3 { margin:0 0 8px; overflow-wrap:anywhere; }
.item-actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}
/* Boutons de la liste des fichiers */
#storageFilesList .item-actions button {
  border-radius: 9px;
  padding: 10px 15px;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s ease;
}

#storageFilesList .item-actions button:hover {
  transform: translateY(-2px);
  filter: brightness(1.15);
}

#storageFilesList .item-actions .secondary {
  background: linear-gradient(135deg, #334b70, #26344c);
  border: 1px solid rgba(120, 160, 220, 0.25);
}

#storageFilesList .item-actions .danger {
  background: linear-gradient(135deg, #a83250, #7d2639);
  border: 1px solid rgba(255, 120, 150, 0.2);
}
/* Présentation améliorée du stockage cloud */
.storage-folder-row {
  margin-bottom:10px;
  padding:10px;
  border:1px solid rgba(105,145,220,.16);
  border-radius:14px;
  background:rgba(13,24,43,.48);
}
.storage-folder-row .storage-folder-card {
  margin:0;
}
.storage-folder-actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:8px 0 0 54px;
}
.storage-folder-actions button {
  padding:8px 11px;
  font-size:12px;
}
.storage-folder-card {
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:14px 16px;
  margin:0 0 9px;
  text-align:left;
  color:var(--text);
  background:linear-gradient(135deg,#1b2b48,#142039);
  border:1px solid rgba(105,145,220,.22);
  border-radius:13px;
}
.storage-folder-card:hover {
  border-color:rgba(105,145,255,.55);
  background:linear-gradient(135deg,#22385c,#182846);
}
.storage-folder-icon,.storage-file-icon {
  display:grid;
  place-items:center;
  flex:0 0 42px;
  width:42px;
  height:42px;
  border-radius:11px;
  background:rgba(67,140,255,.13);
  font-size:22px;
}
.storage-folder-name {
  flex:1;
  min-width:0;
  overflow-wrap:anywhere;
  font-weight:700;
}
.storage-folder-count {
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}
.storage-folder-usage {
  margin:0 8px 10px 54px;
}
.storage-folder-usage-track {
  width:100%;
  height:7px;
  overflow:hidden;
  border-radius:20px;
  background:rgba(148,163,184,.16);
}
.storage-folder-usage-fill {
  height:100%;
  min-width:0;
  border-radius:20px;
  background:linear-gradient(90deg,#3985ff,#24d6a0);
  transition:width .5s ease;
}
.storage-folder-usage-label {
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}
.storage-folder-arrow {
  color:#8eb6ff;
  font-size:24px;
  line-height:1;
}
.storage-empty-folder { margin-top:8px; line-height:1.9; }
.storage-thumbnail-button {
  display:block;
  width:100%;
  min-height:90px;
  max-height:210px;
  margin:0 0 15px;
  padding:0;
  overflow:hidden;
  border:1px solid rgba(105,145,220,.22);
  border-radius:12px;
  background:#0b1426;
}
.storage-thumbnail {
  display:block;
  width:100%;
  height:190px;
  object-fit:contain;
  background:#0b1426;
}
.storage-thumbnail-fallback { display:none; color:var(--muted); padding:15px; }
.storage-thumbnail-button.thumbnail-error .storage-thumbnail-fallback { display:block; }
.storage-thumbnail-button:hover { filter:brightness(1.08); }
.storage-file-heading {
  display:flex;
  align-items:flex-start;
  gap:13px;
}
.storage-file-icon { flex-shrink:0; }
.storage-file-details { min-width:0; flex:1; }
.storage-file-details .file-name {
  font-weight:700;
  overflow-wrap:anywhere;
  line-height:1.45;
}
@media (max-width:480px) {
  .storage-folder-card { gap:9px; padding:12px; }
  .storage-folder-count { font-size:11px; }
  .storage-file-card { padding:15px !important; }
}
.secondary { background:#26344c; color:#e2e8f0; }
.danger { background:#7d2639; }
.success-text { color:var(--green); }
.error-text { color:var(--red); }
.notice {
  padding:12px 14px;
  border-radius:9px;
  margin:15px 0;
  background:#172238;
  border:1px solid var(--border);
  color:#cbd5e1;
  font-size:14px;
  line-height:1.5;
}
.form-card { max-width:580px; }
.empty {
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
  background:var(--panel);
  border:1px dashed var(--border);
  border-radius:12px;
}
.status {
  display:inline-block;
  font-size:12px;
  padding:5px 9px;
  border-radius:20px;
  background:#26344c;
  color:#d5deed;
}
.status.online {
  color:#6ee7b7;
  background:#123b34;
}
.progress {
  width: 100%;
  height: 12px;
  background: rgba(148, 163, 184, 0.16);
  border-radius: 30px;
  overflow: hidden;
  margin: 16px 0 12px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.12);
}

.progress-bar {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #3985ff 0%, #765cff 55%, #a56bff 100%);
  border-radius: 30px;
  transition: width 0.7s ease;
  box-shadow: 0 0 12px rgba(92, 116, 255, 0.35);
}.storage-grid .card {
  background: linear-gradient(145deg, #17243d, #101a2e);
  border: 1px solid rgba(105, 145, 220, 0.22);
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
  transition: transform 0.25s ease, border-color 0.25s ease;
}

.storage-grid .card:hover {
  transform: translateY(-3px);
  border-color: rgba(105, 145, 255, 0.5);
}
.file-name {
  overflow-wrap: anywhere;
  font-size: 15px;
  font-weight: 700;
  color: #f1f5ff;
  letter-spacing: 0.2px;
  margin-bottom: 8px;
}
footer {
  color:var(--muted);
  font-size:12px;
  text-align:center;
  padding:25px;
}
.dashboard-hero {
  position:relative;
  overflow:hidden;
  padding:30px;
  border-radius:18px;
  margin-bottom:22px;
  border:1px solid rgba(116,137,255,.25);
  background:
    radial-gradient(circle at 85% 20%,rgba(133,92,255,.3),transparent 35%),
    linear-gradient(120deg,#14294d,#182044 65%,#241c4b);
}
.dashboard-hero h1 {
  font-size:29px;
  margin:12px 0;
  letter-spacing:-1px;
}
.dashboard-hero p {
  color:#bdc9e2;
  margin:0;
  line-height:1.6;
}
.dashboard-kicker {
  color:#9ebcff;
  font-size:11px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
}
.stat-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.stat-icon {
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:rgba(72,130,255,.15);
  font-size:20px;
}
.shortcut {
  display:flex;
  align-items:flex-start;
  gap:14px;
}
.shortcut-icon {
  width:42px;
  height:42px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:rgba(72,130,255,.15);
  font-size:20px;
}
.shortcut p {
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin:5px 0 12px;
}
@media(max-width:700px) {
  header { padding:0 15px; }
  .layout { display:block; }
  aside {
    width:100%;
    display:flex;
    overflow-x:auto;
    padding:8px;
    border-right:0;
    border-bottom:1px solid var(--border);
  }
  .nav-title { display:none; }
  .nav-btn {
    width:auto;
    white-space:nowrap;
    flex-shrink:0;
    margin:0 4px;
    padding:10px;
  }
  main { padding:20px 15px; }
  .brand { font-size:21px; }
  .dashboard-hero { padding:23px 19px; }
  .dashboard-hero h1 { font-size:24px; }
  .stat { font-size:28px; }
}
</style>
</head>

<body>

<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="brand">221<span>Cloud</span></div>
    <p class="muted">Votre espace numérique.</p>

    <div id="loginForm">

      <p class="muted">Connectez-vous à votre espace.</p>

        Pas encore de compte ?

      </div>

    <div id="registerForm" class="hidden">
      <h1>Créer un compte</h1>
      <p class="muted">Rejoignez 221Cloud.</p>
      <label>Nom complet</label>
      <input id="registerName" type="text" placeholder="Votre nom">
      <label>Adresse e-mail</label>
      <input id="registerEmail" type="email" placeholder="nom@exemple.com">
      <label>Mot de passe</label>
      <input id="registerPassword" type="password" placeholder="Minimum 12 caractères">
      <button id="registerButton" onclick="register()">Créer mon compte</button>
      <div class="auth-switch">
        Déjà inscrit ?
        <button class="link" onclick="showAuthForm('login')">Se connecter</button>
      </div>
    </div>
    <div id="authMessage" class="notice hidden"></div>
  </div>
</section>

<section id="appScreen" class="app hidden">
  <header>
    <div class="brand">221<span>Cloud</span></div>
    <button class="secondary" onclick="logout()">Déconnexion</button>
  </header>

  <div class="layout">
    <aside>
      <div class="nav-title">Espace client</div>
      <button class="nav-btn active" data-page="overview" onclick="showPage('overview')">⌂ Tableau de bord</button>
      <button class="nav-btn" data-page="projects" onclick="showPage('projects')">▣ Mes projets</button>
      <button class="nav-btn" data-page="databases" onclick="showPage('databases')">▤ Bases de données</button>
      <button class="nav-btn" data-page="subscription" onclick="showPage('subscription')">♧ Mon abonnement</button>
      <button class="nav-btn" data-page="storage" onclick="showPage('storage')">▧ Stockage cloud</button>
      <button class="nav-btn" data-page="hosting" onclick="showPage('hosting')">◎ Hébergement</button>
      <button class="nav-btn" data-page="applications" onclick="showPage('applications')">▦ Applications</button>
      <button class="nav-btn admin-nav hidden" data-page="admin" onclick="showPage('admin')">🛡 Administration</button>
      <button class="nav-btn" data-page="account" onclick="showPage('account')">⚙ Mon compte</button>
    </aside>
    <main id="mainContent"></main>
  </div>
  <footer>221Cloud — Votre espace numérique</footer>
</section>

<script>
const API = "/api";
let currentUser = null;
let projectsCache = [];
let databasesCache = [];
let activeDatabaseStructure = null;
let storageFilesCache = [];
let storageFoldersCache = [];
let storageTrashCache = [];
let storageHistoryCache = [];
let storageHistoryPage = 1;
let storageHistoryPagination = { page: 1, pageSize: 20, total: 0, totalPages: 1 };
let storageHistorySearchTimer = null;
let dashboardNotificationsCache = [];
let activeStorageFolderId = null;
let storageView = "files";
let applicationEditorState = null;

const STORAGE_LIMIT_BYTES = 1024 * 1024 * 1024;
let storageQuotaLimit = STORAGE_LIMIT_BYTES;
const MAX_FILE_SIZE_BYTES = 20 * 1024 * 1024;

async function api(path, options = {}) {
  const headers = { ...(options.headers || {}) };

  if (!(options.body instanceof FormData)) {
    headers["Content-Type"] = "application/json";
  }

  const response = await fetch(API + path, {
    credentials:"same-origin",
    ...options,
    headers
  });

  let data = {};
  try { data = await response.json(); } catch(e) {}

  if (!response.ok) {
    let errorMessage = data.error || data.message || "Une erreur est survenue.";

    if (data.storage_status) {
      errorMessage += " (Statut : " + data.storage_status + ")";
    }
    if (data.diagnostic) {
      errorMessage += " — Détail : " + data.diagnostic;
    }
    throw new Error(errorMessage);
  }

  return data;
}
function renderWebsiteFileTree(files, baseUrl = "", projectId = "") {
  const root = {
    folders: {},
    files: []
  };

  (files || []).forEach(file => {
    const parts = String(file.file_path || "")
      .split("/")
      .filter(Boolean);

    if (!parts.length) return;

    let current = root;

    parts.slice(0, -1).forEach(folderName => {
      if (!current.folders[folderName]) {
        current.folders[folderName] = {
          folders: {},
          files: []
        };
      }

      current = current.folders[folderName];
    });

    current.files.push({
      name: parts[parts.length - 1],
      file
    });
  });

  function renderNode(node) {
    const foldersHTML = Object.entries(node.folders)
      .map(([name, folder]) => `
        <details class="item-card">
          <summary>📁 ${escapeHTML(name)}</summary>
          <div style="margin-left:18px;margin-top:10px">
            ${renderNode(folder)}
          </div>
        </details>
      `).join("");

    const filesHTML = node.files.map(({ name, file }) => {
      const fileUrl = `${baseUrl}/${file.file_path.split("/").map(encodeURIComponent).join("/")}`;
const downloadUrl = `${fileUrl}?download=1`;
  const canPreview = Boolean(baseUrl) && [
    "image/png",
    "image/jpeg",
    "image/gif",
    "image/svg+xml",
    "image/webp"
  ].includes(file.mime_type);

  return `
    <div class="item-card">
      <p><strong>📄 ${escapeHTML(name)}</strong></p>
      <p class="muted">
        ${escapeHTML(file.mime_type || "Type inconnu")}
        · ${Number(file.file_size || 0)} octets
      </p>
      ${
        canPreview
          ? `<p><a href="${escapeHTML(fileUrl)}" target="_blank" rel="noopener noreferrer">Prévisualiser</a></p>`
          : ""
      }
      <p><a href="${escapeHTML(downloadUrl)}">Télécharger</a></p>
      ${
        file.file_path === "index.html"
        ? ""
        : `<p>
            <button type="button" onclick="renameWebsiteFile(${escapeJSAttribute(projectId)}, ${escapeJSAttribute(file.id)}, ${escapeJSAttribute(name)})">
  Renommer
</button>
<button type="button" onclick="moveWebsiteFile(${escapeJSAttribute(projectId)}, ${escapeJSAttribute(file.id)}, ${escapeJSAttribute(file.file_path)})">
  Déplacer
</button>
<button type="button" onclick="deleteWebsiteFile(${escapeJSAttribute(projectId)}, ${escapeJSAttribute(file.id)})">
  Supprimer
</button>
</p>`
}
    </div>
  `;
}).join("");

    return foldersHTML + filesHTML;
  }

  return renderNode(root);
}
async function deleteWebsiteFile(projectId, fileId) {
  const confirmation = prompt(
    "Pour confirmer la suppression, tapez SUPPRIMER."
  );

  if (confirmation !== "SUPPRIMER") {
    return;
  }

  try {
    await api(
      `/projects/${encodeURIComponent(projectId)}/hosting/files/${encodeURIComponent(fileId)}`,
      { method: "DELETE" }
    );

    alert("Fichier supprimé avec succès.");
    await renderHostingPage();

  } catch (error) {
    alert(error.message);
  }
}
async function renameWebsiteFile(projectId, fileId, currentName) {
  const newName = prompt(
    "Entrez le nouveau nom du fichier :",
    currentName
  );

  if (newName === null || !newName.trim()) {
    return;
  }

  if (newName.trim() === currentName) {
    return;
  }

  try {
    await api(
      `/projects/${encodeURIComponent(projectId)}/hosting/files/${encodeURIComponent(fileId)}/rename`,
      {
        method: "PATCH",
        body: JSON.stringify({
          name: newName.trim()
        })
      }
    );

    alert("Fichier renommé avec succès.");
    await renderHostingPage();

  } catch (error) {
    alert(error.message);
  }
}
async function moveWebsiteFile(projectId, fileId, currentPath) {
  const lastSlash = currentPath.lastIndexOf("/");
  const currentFolder = lastSlash >= 0
    ? currentPath.slice(0, lastSlash)
    : "";

  const folder = prompt(
    "Entrez le dossier de destination (ex. images). Laissez vide pour déplacer à la racine :",
    currentFolder
  );

  if (folder === null || folder.trim() === currentFolder) {
    return;
  }

  try {
    await api(
      `/projects/${encodeURIComponent(projectId)}/hosting/files/${encodeURIComponent(fileId)}/move`,
      {
        method: "PATCH",
        body: JSON.stringify({
          folder: folder.trim()
        })
      }
    );

    alert("Fichier déplacé avec succès.");
    await renderHostingPage();

  } catch (error) {
    alert(error.message);
  }
}
function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function escapeJSAttribute(value) {
  return escapeHTML(JSON.stringify(String(value ?? "")));
}

function showMessage(message, type = "error") {
  const box = document.getElementById("authMessage");
  box.textContent = message;
  box.className = "notice " + (type === "success" ? "success-text" : "error-text");
  box.classList.remove("hidden");
}

function showAuthForm(form) {
  document.getElementById("loginForm").classList.toggle("hidden", form !== "login");
  document.getElementById("registerForm").classList.toggle("hidden", form !== "register");
  document.getElementById("authMessage").classList.add("hidden");
}

function setLoggedIn(user) {
  currentUser = user;

  document.getElementById("authScreen").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");

  const adminButton = document.querySelector(".admin-nav");

  if (adminButton) {
    adminButton.classList.toggle(
      "hidden",
      user.role !== "admin"
    );
  }

  showPage("overview");
}

async function register() {
  const name = document.getElementById("registerName").value.trim();
  const email = document.getElementById("registerEmail").value.trim();
  const password = document.getElementById("registerPassword").value;

  if (!name || !email || !password) {
    showMessage("Veuillez remplir tous les champs.");
    return;
  }
  if (password.length < 12) {
    showMessage("Le mot de passe doit contenir au moins 12 caractères.");
    return;
  }

  const button = document.getElementById("registerButton");
  button.disabled = true;
  button.textContent = "Création...";

  try {
    await api("/register", {
      method:"POST",
      body:JSON.stringify({
        full_name:name,
        name:name,
        email,
        password
      })
    });
    showMessage("Compte créé. Vous pouvez maintenant vous connecter.", "success");
    showAuthForm("login");
    document.getElementById("loginEmail").value = email;
  } catch(error) {
    showMessage(error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Créer mon compte";
  }
}

async function login() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  if (!email || !password) {
    showMessage("Veuillez saisir votre e-mail et votre mot de passe.");
    return;
  }

  const button = document.getElementById("loginButton");
  button.disabled = true;
  button.textContent = "Connexion...";

  try {
    const data = await api("/login", {
      method:"POST",
      body:JSON.stringify({email,password})
    });
    setLoggedIn(data.user || data);
  } catch(error) {
    showMessage(error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Se connecter";
  }
}

async function logout() {
  try {
    await api("/logout", {method:"POST",body:"{}"});
  } catch(error) {}
  currentUser = null;
  document.getElementById("appScreen").classList.add("hidden");
  document.getElementById("authScreen").classList.remove("hidden");
  showAuthForm("login");
}

async function checkSession() {
  try {
    const data = await api("/me");
    const user = data.user || data;
    if (user && user.id) setLoggedIn(user);
  } catch(error) {}
}

function showPage(page) {
  document.querySelectorAll(".nav-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.page === page);
  });

  if (page === "overview") renderOverview();
  else if (page === "projects") renderProjectsPage();
  else if (page === "databases") renderDatabasesPage();
  else if (page === "storage") renderStoragePage();
  else if (page === "notifications") renderAllNotificationsPage();

  else if (page === "hosting") renderHostingPage();
  else if (page === "applications") renderApplicationsPage();
  else if (page === "admin") renderAdmin();
  else if (page === "account") renderAccount();
}

async function loadOverviewStats() {
  const refreshStatus = document.getElementById("overviewRefreshStatus");
  if (refreshStatus) refreshStatus.textContent = "Actualisation...";
  const projectElement = document.getElementById("projectCount");
  const databaseElement = document.getElementById("databaseCount");
  const fileElement = document.getElementById("overviewFileCount");
  const usedElement = document.getElementById("overviewStorageUsed");

  const results = await Promise.allSettled([
    api("/projects"),
    api("/databases"),
    api("/storage"),
    api("/account/security-log"),
    api("/subscription")
  ]);

  if (results[0].status === "fulfilled") {
    projectsCache = results[0].value.projects || [];
    if (projectElement) projectElement.textContent = projectsCache.length;
  } else if (projectElement) {
    projectElement.textContent = "—";
  }

  if (results[1].status === "fulfilled") {
    databasesCache = results[1].value.databases || [];
    if (databaseElement) databaseElement.textContent = databasesCache.length;
  } else if (databaseElement) {
    databaseElement.textContent = "—";
  }

  if (results[2].status === "fulfilled") {
    const data = results[2].value;
    const files = data.files || [];
    const used = Number(data.used || 0);
    const limit = Number(data.limit || STORAGE_LIMIT_BYTES);
    const percent = limit > 0 ? Math.min(100, used / limit * 100) : 0;

    if (fileElement) fileElement.textContent = files.length;
    if (usedElement) usedElement.textContent = formatBytes(used);
    const remaining = document.getElementById("overviewStorageRemaining");
    const progress = document.getElementById("overviewStorageProgress");

    if (remaining) {
      remaining.textContent = formatBytes(Math.max(0, limit - used)) + " disponibles";
    }
    if (progress) progress.style.width = percent.toFixed(1) + "%";
    const percentLabel = document.getElementById("overviewStoragePercent");
    if (percentLabel) percentLabel.textContent = percent.toFixed(1) + " % utilisé";
  } else {
    if (fileElement) fileElement.textContent = "—";
    if (usedElement) usedElement.textContent = "—";
  }

  renderRecentActivities(
    results[0].status === "fulfilled" ? projectsCache : [],
    results[1].status === "fulfilled" ? databasesCache : [],
    results[2].status === "fulfilled" ? (results[2].value.files || []) : []
  );

  renderDashboardNotifications(
    results[0].status === "fulfilled" ? projectsCache : [],
    results[1].status === "fulfilled" ? databasesCache : [],
    results[2].status === "fulfilled" ? results[2].value : null,
    results[3].status === "fulfilled" ? results[3].value : null,
    results[4].status === "fulfilled" ? results[4].value : null
  );

  if (refreshStatus) {
    const failed = results.some(result => result.status === "rejected");
    const time = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    refreshStatus.textContent = (failed ? "Actualisation partielle · " : "Mis à jour à ") + time;
  }
}

function renderRecentActivities(projects, databases, files) {
  const container = document.getElementById("overviewRecentActivities");
  if (!container) return;

  const activities = [
    ...(projects || []).map(item => ({
      type: "Projet créé", name: item.name || "Projet sans nom",
      date: item.created_at, page: "projects", icon: "▣"
    })),
    ...(databases || []).map(item => ({
      type: "Base de données créée", name: item.name || "Base sans nom",
      date: item.created_at, page: "databases", icon: "▤"
    })),
    ...(files || []).map(item => ({
      type: "Fichier ajouté", name: item.file_name || "Fichier sans nom",
      date: item.created_at, page: "storage", icon: "▧"
    }))
  ];

  activities.sort((a, b) => {
    const dateA = new Date(a.date || 0).getTime();
    const dateB = new Date(b.date || 0).getTime();
    return (Number.isNaN(dateB) ? 0 : dateB) - (Number.isNaN(dateA) ? 0 : dateA);
  });

  const recent = activities.slice(0, 8);
  if (!recent.length) {
    container.innerHTML = '<div class="empty">Aucune activité récente pour le moment. Vos prochaines opérations apparaîtront ici.</div>';
    return;

  container.innerHTML = recent.map(activity => `

        <div class="stat-icon">${activity.icon}</div>
        <div style="min-width:0">
          <strong>${escapeHTML(activity.name)}</strong>
          <div class="muted">${escapeHTML(activity.type)} · ${escapeHTML(formatDate(activity.date))}</div>
        </div>
      </div>
      <button class="secondary" onclick="showPage('${activity.page}')">Ouvrir</button>
    </div>
  `).join("");
}

function dashboardNotificationReadKey() {
  return "221cloud_notifications_read_" + String(currentUser?.id || "guest");
}

function getDashboardReadNotificationIds() {
  try {
    const saved = JSON.parse(localStorage.getItem(dashboardNotificationReadKey()) || "[]");
    return new Set(Array.isArray(saved) ? saved : []);
  } catch (error) {
    return new Set();
  }
}

function saveDashboardReadNotificationIds(ids) {
  try {
    localStorage.setItem(dashboardNotificationReadKey(), JSON.stringify(Array.from(ids)));
    return true;
  } catch (error) {
    return false;
  }
}

function markDashboardNotificationRead(id) {
  const readIds = getDashboardReadNotificationIds();
  readIds.add(id);
  if (!saveDashboardReadNotificationIds(readIds)) {
    alert("Impossible d'enregistrer cet état de lecture sur cet appareil.");
    return;
  }
  renderDashboardNotificationsFromCache();
}

function markAllDashboardNotificationsRead() {
  const readIds = getDashboardReadNotificationIds();
  dashboardNotificationsCache.forEach(item => readIds.add(item.id));
  if (!saveDashboardReadNotificationIds(readIds)) {
    alert("Impossible d'enregistrer cet état de lecture sur cet appareil.");
    return;
  }
  renderDashboardNotificationsFromCache();
}

function renderDashboardNotificationsFromCache() {
  const container = document.getElementById("overviewNotifications");
  const allContainer = document.getElementById("allNotificationsList");
  if (!container && !allContainer) return;

  const readIds = getDashboardReadNotificationIds();
  const unreadCount = dashboardNotificationsCache.filter(item => !readIds.has(item.id)).length;
  const count = document.getElementById("overviewNotificationCount");
  const markAllButton = document.getElementById("markAllNotificationsReadButton");
  const allCount = document.getElementById("allNotificationsCount");
  const allMarkButton = document.getElementById("allMarkNotificationsReadButton");

  if (count) count.textContent = unreadCount + " notification(s) non lue(s)";
  if (markAllButton) markAllButton.disabled = unreadCount === 0;
  if (allMarkButton) allMarkButton.disabled = unreadCount === 0;
  if (allCount) allCount.textContent = dashboardNotificationsCache.length + " notification(s) · " + unreadCount + " non lue(s)";

  if (!dashboardNotificationsCache.length) {
    const emptyMessage = '<div class="empty">Aucune notification pour le moment. Les alertes importantes apparaîtront ici.</div>';
    if (container) container.innerHTML = emptyMessage;
    if (allContainer) allContainer.innerHTML = emptyMessage;
    return;
  }

  const statusFilter = document.getElementById("allNotificationsStatusFilter")?.value || "all";
  const categoryFilter = document.getElementById("allNotificationsCategoryFilter")?.value || "all";
  const visibleNotifications = dashboardNotificationsCache.filter(item => {
    const isRead = readIds.has(item.id);
    const statusMatches = statusFilter === "all" || (statusFilter === "read" ? isRead : !isRead);
    const categoryMatches = categoryFilter === "all" || item.category === categoryFilter;
    return statusMatches && categoryMatches;
  });
  if (allCount) allCount.textContent = visibleNotifications.length + " affichée(s) sur " + dashboardNotificationsCache.length + " · " + unreadCount + " non lue(s)";

  const renderItem = item => {
    const isRead = readIds.has(item.id);
    const dateLabel = item.date ? " · " + formatDate(item.date) : "";
    const action = item.page
      ? `<button class="secondary" onclick="showPage(${escapeJSAttribute(item.page)})">Ouvrir</button>`
      : "";
    const readAction = isRead
      ? '<span class="status">✓ Lue</span>'
      : `<button class="secondary" onclick="markDashboardNotificationRead(${escapeJSAttribute(item.id)})">Marquer comme lue</button>`;
    const border = item.level === "warning"
      ? "border-left:4px solid #f59e0b;"
      : (isRead ? "opacity:.72;" : "border-left:4px solid #438cff;");
    return `
      <div class="item-card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;${border}">
        <div style="display:flex;align-items:center;gap:12px;min-width:0">
          <div class="stat-icon">${item.icon}</div>
          <div style="min-width:0">
            <strong>${escapeHTML(item.title)}</strong>
            <div class="muted">${escapeHTML(item.message + dateLabel)}</div>
            <div style="margin-top:7px">${readAction}</div>
          </div>
        </div>
        ${action}
      </div>
    `;
  };

  if (container) {
    container.innerHTML = dashboardNotificationsCache.slice(0, 8).map(renderItem).join("");
  }
  if (allContainer) {
    allContainer.innerHTML = visibleNotifications.length
      ? visibleNotifications.map(renderItem).join("")
      : '<div class="empty">Aucune notification ne correspond à ces filtres.</div>';
  }
}

function renderDashboardNotifications(projects, databases, storageData, securityData, subscriptionData) {
  const notifications = [];
  const now = Date.now();
  const recentWindow = 7 * 24 * 60 * 60 * 1000;

  [...(projects || []).map(item => ({
    type: "Projet créé",
    name: item.name || "Projet sans nom",
    date: item.created_at,
    icon: item.type === "website" ? "🌐" : (item.type === "application" ? "📱" : (item.type === "database" ? "▤" : "▣")),
    page: "projects",
    category: "projects"
  })), ...(databases || []).map(item => ({
    type: "Base de données créée", name: item.name || "Base sans nom",
    date: item.created_at, icon: "▤", page: "databases", category: "databases"
  })), ...((storageData?.files || []).map(item => ({
    type: "Fichier ajouté", name: item.file_name || "Fichier sans nom",
    date: item.created_at, icon: "▧", page: "storage", category: "storage"
  })))]
    .forEach(item => {
      const timestamp = new Date(item.date || 0).getTime();
      if (Number.isFinite(timestamp) && timestamp > 0 && now - timestamp <= recentWindow) {
        notifications.push({
          title: item.type,
          message: item.name,
          date: item.date,
          icon: item.icon,
          level: "info",
          priority: 1,
          page: item.page,
          category: item.category || "projects"
        });
      }
    });

  if (storageData) {
    const used = Number(storageData.used || 0);
    const limit = Number(storageData.limit || STORAGE_LIMIT_BYTES);
    const percent = limit > 0 ? used / limit * 100 : 0;
    if (percent >= 80) {
      notifications.push({
        title: percent >= 95 ? "Stockage presque plein" : "Stockage bientôt plein",
        message: formatBytes(used) + " utilisés sur " + formatBytes(limit) + " (" + percent.toFixed(1) + " %)",
        icon: "⚠",
        level: percent >= 95 ? "warning" : "info",
        priority: 3,
        category: "storage"
      });
    }

    const trashCount = Number(storageData.trashCount || 0);
    if (trashCount > 0) {
      notifications.push({
        title: "Fichiers dans la corbeille",
        message: trashCount + " fichier(s) en attente de restauration ou de suppression",
        icon: "🗑",
        level: "info",
        priority: 2,
        page: "storage",
        category: "storage"
      });
    }
  }

  const currentSubscription = subscriptionData?.subscription;
  if (currentSubscription) {
    const expiryTime = currentSubscription.expires_at
      ? new Date(currentSubscription.expires_at).getTime()
      : null;
    const remainingDays = Number.isFinite(expiryTime)
      ? Math.ceil((expiryTime - now) / (24 * 60 * 60 * 1000))
      : null;

    if (currentSubscription.status !== "active") {
      notifications.push({
        id: "subscription-status-" + String(currentSubscription.started_at || currentSubscription.plan),
        title: "Votre abonnement nécessite une attention",
        message: "Le statut actuel est : " + String(currentSubscription.status || "inconnu"),
        icon: "⚠",
        level: "warning",
        priority: 4,
        page: "subscription",
        category: "subscription"
      });
    } else if (remainingDays !== null && remainingDays <= 7) {
      notifications.push({
        id: "subscription-expiry-" + String(currentSubscription.started_at || currentSubscription.plan),
        title: remainingDays < 0 ? "Votre abonnement a expiré" : (remainingDays === 0 ? "Votre abonnement expire aujourd'hui" : "Votre abonnement expire bientôt"),
        message: remainingDays < 0
          ? "La date de fin de votre forfait est dépassée."
          : "Il reste " + remainingDays + " jour(s) avant la date de fin prévue.",
        icon: "📅",
        level: "warning",
        priority: 4,
        date: currentSubscription.expires_at,
        page: "subscription",
        category: "subscription"
      });
    }
  }

  const securityLabels = {
    login: "Nouvelle connexion au compte",
    new_environment_login: "Connexion depuis un nouvel environnement",
    logout: "Déconnexion du compte",
    password_change: "Mot de passe modifié",
    sessions_revoked: "Autres sessions déconnectées"
  };

  (securityData?.events || []).forEach(event => {
    const timestamp = new Date(event.created_at || 0).getTime();
    if (!Number.isFinite(timestamp) || timestamp <= 0 || now - timestamp > recentWindow) return;

    const title = securityLabels[event.action] || "Activité de sécurité";
    const message = [event.description, event.device_info]
      .filter(Boolean)
      .join(" · ");
    const important = event.action === "password_change" || event.action === "sessions_revoked" || event.action === "new_environment_login";

    notifications.push({
      id: "security-" + String(event.id),
      title,
      message,
      date: event.created_at,
      icon: important ? "🔐" : "🛡️",
      level: important ? "warning" : "info",
      priority: important ? 4 : 2,
      page: "account",
      category: "account"
    });
  });

  notifications.sort((a, b) => {
    const priorityDifference = Number(b.priority || 0) - Number(a.priority || 0);
    if (priorityDifference !== 0) return priorityDifference;
    const dateA = new Date(a.date || 0).getTime();
    const dateB = new Date(b.date || 0).getTime();
    return (Number.isNaN(dateB) ? 0 : dateB) - (Number.isNaN(dateA) ? 0 : dateA);
  });

  dashboardNotificationsCache = notifications.map(item => ({
    ...item,
    id: item.id || encodeURIComponent([item.title, item.message, item.date || ""].join("|"))
  }));
  renderDashboardNotificationsFromCache();
}

async function startWebsiteDeployment(projectId) {
    const filesInput = document.getElementById(
    `websiteFiles-${projectId}`
  );

  const folderInput = document.getElementById(
    `websiteFolder-${projectId}`
  );

  const selectedFiles = Array.from(filesInput?.files || []);
  const folderFiles = Array.from(folderInput?.files || []);

  if (selectedFiles.length && folderFiles.length) {
    alert("Choisissez soit des fichiers, soit un dossier complet.");
    return;
  }

  const isFolderUpload = folderFiles.length > 0;
  const files = isFolderUpload ? folderFiles : selectedFiles;

  if (!files.length) {
    alert("Sélectionnez d'abord les fichiers ou le dossier de votre site.");
    return;
  }

  const button = document.querySelector(
    `button[onclick="startWebsiteDeployment('${projectId}')"]`
  );

  if (button) {
    button.disabled = true;
    button.textContent = "Préparation du déploiement...";
  }

  try {
    const created = await api(
      `/projects/${encodeURIComponent(projectId)}/deployments`,
      { method: "POST" }
    );

    const deploymentId = created.deployment.id;

    for (let i = 0; i < files.length; i++) {
      const file = files[i];

      if (button) {
        button.textContent =
          `Envoi des fichiers : ${i + 1}/${files.length}`;
      }

      const form = new FormData();

      form.append("file", file);
      const folderRoot = isFolderUpload
  ? folderFiles[0].webkitRelativePath.split("/")[0]
  : "";

const filePath = isFolderUpload
  ? (
      file.webkitRelativePath.startsWith(folderRoot + "/")
        ? file.webkitRelativePath.slice(folderRoot.length + 1)
        : file.webkitRelativePath
    )
  : file.name;

form.append("file_path", filePath);

      await api(
        `/projects/${encodeURIComponent(projectId)}/deployments/${encodeURIComponent(deploymentId)}/files`,
        {
          method: "POST",
          body: form
        }
      );
    }

    if (button) {
      button.textContent = "Publication du site...";
    }

    const published = await api(
      `/projects/${encodeURIComponent(projectId)}/deployments/${encodeURIComponent(deploymentId)}/publish`,
      { method: "POST" }
    );

    alert(
      published.message + "\nAdresse du site : " +
      published.deployment.url
    );

    await renderHostingPage();

  } catch (error) {
    alert("Le déploiement a échoué : " + error.message);

    if (button) {
      button.disabled = false;
      button.textContent = "Envoyer et publier le site";
    }
  }
}

async function editProject(id) {
  const project = projectsCache.find(item => item.id === id);
  if (!project) return;

  const name = prompt("Nouveau nom du projet :", project.name);
  if (name === null) return;
  if (!name.trim()) {
    alert("Le nom ne peut pas être vide.");
    return;
  }

  try {
    await api("/projects/" + encodeURIComponent(id), {
      method:"PATCH",
      body:JSON.stringify({name:name.trim(),type:project.type})
    });
    await loadProjects();
  } catch(error) {
    alert(error.message);
  }
}

async function deleteProject(id) {
  if (!confirm("Placer ce projet dans la corbeille ? Ses bases, son hébergement, ses déploiements et ses fichiers associés seront conservés. Vous pourrez le restaurer.")) return;

  try {
    const result = await api("/projects/" + encodeURIComponent(id), {method:"DELETE"});
    alert(result.message || "Projet déplacé dans la corbeille.");
    await loadProjects();
    const trash = document.getElementById("projectTrashList");
    if (trash && trash.style.display !== "none") await loadProjectTrash();
  } catch(error) {
    alert(error.message);
  }
}

async function loadProjectTrash() {
  const container = document.getElementById("projectTrashList");
  if (!container) return;
  container.style.display = "block";
  container.innerHTML = `<div class="empty">Chargement de la corbeille...</div>`;

  try {
    const data = await api("/projects/trash");
    const projects = data.projects || [];
    if (!projects.length) {
      container.innerHTML = `<div class="empty">La corbeille des projets est vide.</div>`;
      return;
    }

    container.innerHTML = projects.map(project => `
      <div class="item-card">
        <h3>${escapeHTML(project.name)}</h3>
        <div class="muted">${escapeHTML(projectTypeLabel(project.type))}</div>

          <button class="secondary" type="button" onclick="restoreProject(${escapeJSAttribute(project.id)})">Restaurer le projet</button>
        </div>
      </div>
    `).join("");
  } catch(error) {
    container.innerHTML = `<div class="notice error-text">${escapeHTML(error.message)}</div>`;
  }
}

async function restoreProject(id) {
  if (!confirm("Restaurer ce projet et retrouver ses éléments associés ?")) return;
  try {
    const result = await api("/projects/" + encodeURIComponent(id) + "/restore", {method:"POST",body:"{}"});
    alert(result.message || "Projet restauré.");
    await loadProjects();
    await loadProjectTrash();
  } catch(error) {
    alert(error.message);
  }
}

function parseCustomerCsvText(text) {
  const source = String(text || "").replace(/^\uFEFF/, "");
  const firstLine = source.split(/\r?\n/, 1)[0] || "";
  let delimiter = ",";
  let quoted = false;
  const counts = { ",": 0, ";": 0, "\t": 0 };
  for (let i = 0; i < firstLine.length; i++) {
    const char = firstLine[i];
    if (char === '"') {
      if (quoted && firstLine[i + 1] === '"') i++;
      else quoted = !quoted;
    } else if (!quoted && Object.prototype.hasOwnProperty.call(counts, char)) {
      counts[char]++;
    }
  }
  delimiter = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
  const records = [];
  let row = [];
  let cell = "";
  quoted = false;
  for (let i = 0; i < source.length; i++) {
    const char = source[i];
    if (char === '"') {
      if (quoted && source[i + 1] === '"') {
        cell += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (!quoted && char === delimiter) {
      row.push(cell);
      cell = "";
    } else if (!quoted && (char === "\n" || char === "\r")) {
      if (char === "\r" && source[i + 1] === "\n") i++;
      row.push(cell);
      if (row.some(value => String(value).trim() !== "")) records.push(row);
      row = [];
      cell = "";
    } else {
      cell += char;
    }
  }
  if (quoted) throw new Error("Le fichier CSV contient un champ entre guillemets qui n'est pas fermé.");
  row.push(cell);
  if (row.some(value => String(value).trim() !== "")) records.push(row);
  return records;
}
async function previewCustomerDatabaseCsvImport() {
  if (!activeDatabaseStructure || !activeDatabaseStructure.tableId) return;
  const input = document.getElementById("customerCsvImportFile");
  const preview = document.getElementById("customerCsvImportPreview");
  const button = document.getElementById("customerCsvImportButton");
  if (button) button.disabled = true;
  if (preview) preview.innerHTML = "";
  activeDatabaseStructure.csvImportRows = null;
  const file = input && input.files ? input.files[0] : null;
  if (!file) return;
  try {
    if (!/\.csv$/i.test(file.name) && file.type !== "text/csv") throw new Error("Choisissez un fichier au format .csv.");
    if (file.size > 1024 * 1024) throw new Error("Le fichier CSV ne doit pas dépasser 1 Mo.");
    const records = parseCustomerCsvText(await file.text());
    if (records.length < 2) throw new Error("Le fichier doit contenir une ligne d'en-tête et au moins une ligne de données.");
    const headers = records[0].map(value => String(value).trim());
    const hasCreatedAtColumn = headers.length && headers[0].toLowerCase() === "date de création";
    if (hasCreatedAtColumn) headers.shift();
    const columns = activeDatabaseStructure.columns || [];
    const normalizedHeaders = headers.map(value => value.toLocaleLowerCase());
    if (new Set(normalizedHeaders).size !== normalizedHeaders.length) throw new Error("Le fichier contient des noms de colonnes en double.");
    const columnByName = new Map(columns.map(column => [column.name.toLocaleLowerCase(), column]));
    const missing = columns.filter(column => !normalizedHeaders.includes(column.name.toLocaleLowerCase()));
    const unknown = headers.filter(header => !columnByName.has(header.toLocaleLowerCase()));
    if (missing.length || unknown.length) {
      const details = [];
      if (missing.length) details.push("Colonnes manquantes : " + missing.map(column => column.name).join(", "));
      if (unknown.length) details.push("Colonnes inconnues : " + unknown.join(", "));
      throw new Error(details.join(" · ") + ". Les en-têtes doivent correspondre aux colonnes de la table.");
    }
    const dataRecords = records.slice(1);
    if (dataRecords.length > 500) throw new Error("Maximum 500 lignes par import. Séparez le fichier en plusieurs parties.");
    const importedRows = [];
    for (let index = 0; index < dataRecords.length; index++) {
      const cells = dataRecords[index].slice(hasCreatedAtColumn ? 1 : 0);
      if (cells.length > headers.length && cells.slice(headers.length).some(value => value !== "")) {
        throw new Error("La ligne " + (index + 2) + " contient trop de valeurs.");
      }
      const values = {};
      for (let h = 0; h < headers.length; h++) {
        const column = columnByName.get(headers[h].toLocaleLowerCase());
        const raw = String(cells[h] === undefined ? "" : cells[h]).trim();
        if (!raw) {
          values[column.name] = null;
        } else if (column.data_type === "number") {
          const number = Number(raw.replace(",", "."));
          if (!Number.isFinite(number)) throw new Error("Valeur numérique invalide à la ligne " + (index + 2) + ", colonne « " + column.name + " ».");
          values[column.name] = number;
        } else if (column.data_type === "boolean") {
          const normalized = raw.toLocaleLowerCase();
          if (["oui", "yes", "true", "1"].includes(normalized)) values[column.name] = 1;
          else if (["non", "no", "false", "0"].includes(normalized)) values[column.name] = 0;
          else throw new Error("Valeur oui/non invalide à la ligne " + (index + 2) + ", colonne « " + column.name + " ».");
        } else if (column.data_type === "date") {
          const match = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
          if (!match) throw new Error("Date invalide à la ligne " + (index + 2) + ". Format attendu : AAAA-MM-JJ.");
          const date = new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3])));
          if (date.getUTCFullYear() !== Number(match[1]) || date.getUTCMonth() + 1 !== Number(match[2]) || date.getUTCDate() !== Number(match[3])) {
            throw new Error("Date inexistante à la ligne " + (index + 2) + ".");
          }
          values[column.name] = raw;
        } else {
          if (raw.length > 5000) throw new Error("Texte trop long à la ligne " + (index + 2) + ", colonne « " + column.name + " ».");
          values[column.name] = cells[h] === undefined ? "" : cells[h];
        }
      }
      importedRows.push(values);
    }
    if (!importedRows.length) throw new Error("Aucune ligne de données à importer.");
    activeDatabaseStructure.csvImportRows = importedRows;
    activeDatabaseStructure.csvImportFileName = file.name;
    if (preview) {
      const sample = importedRows.slice(0, 5);
      const labels = columns.map(column => column.name);
      preview.innerHTML = "<p class='success-text'>" + importedRows.length + " ligne(s) prêtes à importer · " + labels.length + " colonne(s) reconnues.</p>" +
        "<p class='muted'>Aperçu des " + sample.length + " premières lignes de « " + escapeHTML(file.name) + " » :</p>" +
        "<div class='table-wrap'><table><thead><tr>" + labels.map(label => "<th>" + escapeHTML(label) + "</th>").join("") +
        "</tr></thead><tbody>" + sample.map(item => "<tr>" + labels.map(label => "<td>" + escapeHTML(item[label] === null ? "—" : String(item[label])) + "</td>").join("") + "</tr>").join("") +
        "</tbody></table></div>" +
        (importedRows.length > 5 ? "<p class='muted'>+" + (importedRows.length - 5) + " autre(s) ligne(s)</p>" : "");
    }
    if (button) button.disabled = false;
  } catch (error) {
    if (preview) preview.innerHTML = "<p class='error-text'>" + escapeHTML(error.message || "Impossible de lire ce fichier CSV.") + "</p>";
    activeDatabaseStructure.csvImportRows = null;
  }
}

async function exportCustomerDatabaseCsv() {
  if (!activeDatabaseStructure || !activeDatabaseStructure.tableId) return;
  const button = document.getElementById("customerRowsExport");
  const originalLabel = button ? button.textContent : "↓ Exporter en CSV";
  if (button) {
    button.disabled = true;
    button.textContent = "Préparation du fichier...";
  }
  try {
    const columns = activeDatabaseStructure.columns || [];
    if (!columns.length) throw new Error("Cette table ne possède aucune colonne à exporter.");
    const allRows = [];
    let offset = 0;
    let total = null;
    do {
      const params = new URLSearchParams({
        limit: "50",
        offset: String(offset),
        q: "",
        sort: activeDatabaseStructure.rowsSortColumn || "created_at",
        direction: activeDatabaseStructure.rowsSortDirection || "desc"
      });
      const data = await api("/databases/" + encodeURIComponent(activeDatabaseStructure.databaseId) +
        "/tables/" + encodeURIComponent(activeDatabaseStructure.tableId) + "/rows?" + params.toString());
      const rows = Array.isArray(data.rows) ? data.rows : [];
      if (total === null) total = Number(data.total || 0);
      allRows.push(...rows);
      offset += rows.length;
      if (!rows.length) break;
    } while (offset < total);
    const headers = ["Date de création", ...columns.map(column => column.name)];
    const csvCell = value => {
      if (value === null || value === undefined) return '""';
      let text = String(value);
      // Neutraliser les cellules susceptibles d'être interprétées comme formules
      // par les tableurs, sans modifier les valeurs numériques négatives.
      if (typeof value !== "number" && /^[=+\-@\t\r]/.test(text)) {
        text = "'" + text;
      }
      return '"' + text.replace(/"/g, '""') + '"';
    };
    const lines = [headers.map(csvCell).join(",")];
    for (const row of allRows) {
      lines.push([row.created_at, ...columns.map(column => {
        const value = row[column.name];
        if (column.data_type === "boolean" && value !== null && value !== undefined) return Number(value) ? "Oui" : "Non";
        return value;
      })].map(csvCell).join(","));
    }
    const csv = "\uFEFF" + lines.join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const safeName = (activeDatabaseStructure.tableName || "table").replace(/[^a-zA-Z0-9_-]+/g, "_");
    link.href = url;
    link.download = safeName + ".csv";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    alert(allRows.length + " ligne(s) exportée(s) au format CSV.");
  } catch (error) {
    alert(error.message || "Impossible de préparer le fichier CSV.");
  } finally {
    if (button) {
      button.disabled = false;
      button.textContent = originalLabel;
    }
  }
}

async function createCustomerDatabaseColumn() {
  if (!activeDatabaseStructure || !activeDatabaseStructure.tableId) return;
  const input = document.getElementById("customerColumnName");
  const typeInput = document.getElementById("customerColumnType");
  const name = input ? input.value.trim() : "";

  if (!name) {

  try {

      "/tables/" + encodeURIComponent(activeDatabaseStructure.tableId) + "/columns", {
        method: "POST", body: JSON.stringify({ name: name, data_type: data_type })
      });

    if (input) input.value = "";
    await loadCustomerDatabaseColumns();

}

async function createDatabase() {
  const name = document.getElementById("databaseName").value.trim();
  const project_id = document.getElementById("databaseProject").value || null;
  const message = document.getElementById("databaseMessage");

  if (!name) {
    message.innerHTML = `<p class="error-text">Saisissez le nom de la base.</p>`;
    return;
  }

  try {
    await api("/databases", {
      method:"POST",
      body:JSON.stringify({name,project_id})
    });
    message.innerHTML = `<p class="success-text">Base créée avec succès.</p>`;
    document.getElementById("databaseName").value = "";
    await loadDatabases();
  } catch(error) {
    message.innerHTML = `<p class="error-text">${escapeHTML(error.message)}</p>`;
  }
}

async function deleteDatabase(id) {
  const database = databasesCache.find(item => item.id === id);
  if (!database) return alert("Base de données introuvable.");

  const confirmation = prompt(
    "Cette action est irréversible et réservée aux bases sans table.\n\nPour confirmer, saisissez exactement le nom : " + database.name
  );
  if (confirmation === null) return;
  if (confirmation.trim() !== database.name) {
    return alert("Le nom saisi ne correspond pas. Aucune suppression effectuée.");
  }
  if (!confirm("Confirmer la suppression de la base vide « " + database.name + " » ?")) return;

  try {
    await api("/databases/" + encodeURIComponent(id), {
      method:"DELETE",
      body:JSON.stringify({confirm_name:confirmation.trim()})
    });
    alert("Base de données supprimée.");
    await loadDatabases();
  } catch(error) {
    alert(error.message);
  }
}

function formatBytes(bytes) {
  const value = Number(bytes) || 0;
  if (value < 1024) return value + " octet(s)";
  if (value < 1024 * 1024) return (value / 1024).toFixed(1) + " Ko";
  if (value < 1024 * 1024 * 1024) return (value / (1024 * 1024)).toFixed(1) + " Mo";
  return (value / (1024 * 1024 * 1024)).toFixed(2) + " Go";
}

function renderStorageFolderStats() {
  const folders = storageFoldersCache || [];
  const filesByFolder = new Map();
  storageFilesCache.forEach(file => {
    if (!file.folder_id) return;
    if (!filesByFolder.has(file.folder_id)) filesByFolder.set(file.folder_id, []);
    filesByFolder.get(file.folder_id).push(file);
  });
  const childrenByParent = new Map();
  folders.forEach(folder => {
    const parent = folder.parent_id || null;
    if (!childrenByParent.has(parent)) childrenByParent.set(parent, []);
    childrenByParent.get(parent).push(folder);
  });
  function measureFolder(folder, visited = new Set()) {
    if (visited.has(folder.id)) return { count: 0, bytes: 0 };
    const nextVisited = new Set(visited);
    nextVisited.add(folder.id);
    const directFiles = filesByFolder.get(folder.id) || [];
    let count = directFiles.length;
    let bytes = directFiles.reduce((sum, file) => sum + Math.max(0, Number(file.file_size) || 0), 0);
    (childrenByParent.get(folder.id) || []).forEach(child => {
      const childStats = measureFolder(child, nextVisited);
      count += childStats.count;
      bytes += childStats.bytes;
    });
    return { count, bytes };
  }
  const ranked = folders.map(folder => ({ ...folder, stats: measureFolder(folder) }))
    .sort((a, b) => b.stats.bytes - a.stats.bytes || a.name.localeCompare(b.name, "fr"));
  const filesInFolders = storageFilesCache.filter(file => Boolean(file.folder_id)).length;
  const bytesInFolders = storageFilesCache.filter(file => Boolean(file.folder_id))
    .reduce((sum, file) => sum + Math.max(0, Number(file.file_size) || 0), 0);
  return "<h4 style=\"margin:22px 0 6px;\">Vue d'ensemble des dossiers</h4>" +
    "<p class=\"muted\" style=\"margin:0 0 12px;\">Les tailles incluent les sous-dossiers. Les fichiers placés directement à la racine ne sont pas comptés dans les dossiers.</p>" +
    "<div class=\"grid\" style=\"margin-bottom:14px;\">" +
      "<div><div class=\"muted\">Dossiers créés</div><div class=\"stat\">" + folders.length + "</div></div>" +
      "<div><div class=\"muted\">Fichiers rangés</div><div class=\"stat\">" + filesInFolders + "</div></div>" +
      "<div><div class=\"muted\">Taille rangée</div><div class=\"stat\">" + formatBytes(bytesInFolders) + "</div></div>" +
    "</div>" +
    (ranked.length ? ranked.slice(0, 5).map(folder =>
      "<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--border, rgba(128,128,128,.2));\">" +
        "<div style=\"min-width:0;flex:1;\"><strong>📁 " + escapeHTML(folder.name) + "</strong>" +
        "<div class=\"muted\" style=\"font-size:12px;\">" + folder.stats.count + " fichier(s), sous-dossiers inclus · " + formatBytes(folder.stats.bytes) + "</div></div>" +
        "<button type=\"button\" class=\"secondary\" onclick=\"openStorageFolder(" + escapeJSAttribute(folder.id) + ")\">Ouvrir</button>" +
      "</div>"
    ).join("") : "<div class=\"empty\">Aucun dossier créé pour le moment.</div>") +
    (ranked.length > 5 ? "<p class=\"muted\" style=\"margin-top:10px;\">Les 5 dossiers les plus volumineux sont affichés.</p>" : "");
}

function renderStorageStats(used, limit, available) {
  const container = document.getElementById("storageStatsBreakdown");
  if (!container) return;

  const files = storageFilesCache;
  const rootFiles = files.filter(file => !file.folder_id);
  const folderFiles = files.filter(file => Boolean(file.folder_id));
  const trashFiles = storageTrashCache || [];
  const sumFileBytes = items => items.reduce(
    (sum, file) => sum + Math.max(0, Number(file.file_size) || 0),
    0
  );
  const locationGroups = [
    { name: "À la racine", icon: "📄", count: rootFiles.length, bytes: sumFileBytes(rootFiles) },
    { name: "Dans les dossiers", icon: "📁", count: folderFiles.length, bytes: sumFileBytes(folderFiles) },
    { name: "Dans la corbeille", icon: "🗑️", count: trashFiles.length, bytes: sumFileBytes(trashFiles) }
  ];
  const privateStorageBytes = locationGroups.reduce((sum, item) => sum + item.bytes, 0);
  const getCategory = file => {
    const mime = String(file.mime_type || "").toLowerCase();
    if (mime.startsWith("image/")) return "Images";
    if (mime.startsWith("video/")) return "Vidéos";
    if (
      mime.startsWith("text/") ||
      mime === "application/pdf" ||
      mime.includes("document") ||
      mime.includes("wordprocessingml") ||
      mime.includes("msword") ||
      mime.includes("spreadsheet") ||
      mime.includes("presentation") ||
      mime.includes("opendocument") ||
      mime === "application/rtf"
    ) return "Documents";
    return "Autres fichiers";
  };

  const categories = ["Images", "Vidéos", "Documents", "Autres fichiers"].map(name => {
    const matching = files.filter(file => getCategory(file) === name);
    return {
      name,
      count: matching.length,
      bytes: matching.reduce((sum, file) => sum + Math.max(0, Number(file.file_size) || 0), 0)
    };
  });
  const maxBytes = Math.max(1, ...categories.map(item => item.bytes));
  const totalFiles = files.length;
  const totalActiveBytes = categories.reduce((sum, item) => sum + item.bytes, 0);
  const safeLimit = Math.max(0, Number(limit) || 0);
  const safeAvailable = Math.max(0, Number(available) || 0);
  const availablePercent = safeLimit > 0
    ? Math.min(100, (safeAvailable / safeLimit) * 100)
    : 0;

  container.innerHTML = `
    <div class="grid" style="margin-bottom:14px;">
      <div>
        <div class="muted">Fichiers actifs</div>
        <div class="stat">${totalFiles}</div>
      </div>
      <div>
        <div class="muted">Taille des fichiers actifs</div>
        <div class="stat">${formatBytes(totalActiveBytes)}</div>
      </div>
      <div>
        <div class="muted">Espace restant sur le quota</div>
        <div class="stat">${formatBytes(safeAvailable)}</div>
      </div>
    </div>
    <h4 style="margin:18px 0 6px;">Répartition par emplacement</h4>
    <p class="muted" style="margin:0 0 12px;">Comparaison des fichiers actifs à la racine et dans les dossiers, ainsi que des fichiers conservés dans la corbeille. Chaque fichier actif est compté une seule fois. Les sites hébergés sont inclus dans le quota global, mais pas dans cette répartition.</p>
    <div class="grid" style="margin-bottom:12px;">
      ${locationGroups.map(item => {
        const quotaPercent = safeLimit > 0 ? (item.bytes / safeLimit) * 100 : 0;
        const privatePercent = privateStorageBytes > 0 ? (item.bytes / privateStorageBytes) * 100 : 0;
        return `
          <div class="card" style="padding:14px;">
            <div class="muted">${item.icon} ${item.name}</div>
            <div class="stat">${formatBytes(item.bytes)}</div>
            <div class="muted">${item.count} fichier(s) · ${privatePercent.toFixed(1)} % du stockage cloud personnel</div>
            <div class="progress" style="margin-top:9px;">
              <div class="progress-bar" style="width:${Math.min(100, Math.max(0, quotaPercent)).toFixed(2)}%;"></div>
            </div>
            <div class="muted" style="font-size:11px;margin-top:5px;">${quotaPercent.toFixed(2)} % du quota total</div>
          </div>
        `;
      }).join("")}
    </div>
    <div class="muted" style="margin-bottom:8px;">Espace restant : ${availablePercent.toFixed(1)} % du quota</div>
    <div class="progress" style="margin-bottom:16px;">
      <div class="progress-bar" style="width:${availablePercent.toFixed(1)}%;"></div>
    </div>
    <div style="display:flex; align-items:center; gap:24px; flex-wrap:wrap; margin:18px 0 22px;">
      <div
        role="img"
        aria-label="Graphique circulaire de la répartition des fichiers actifs par catégorie"
        style="width:190px; height:190px; flex:0 0 190px; border-radius:50%; background:${totalActiveBytes > 0 ? `conic-gradient(${categories.map((item, index) => {
          const start = categories.slice(0, index).reduce((sum, category) => sum + category.bytes, 0) / totalActiveBytes * 100;
          const end = start + item.bytes / totalActiveBytes * 100;
          const colors = ["#438cff", "#8b72ff", "#24d6a0", "#f59e0b"];
          return `${colors[index]} ${start.toFixed(2)}% ${end.toFixed(2)}%`;
        }).join(", ")})` : "conic-gradient(#283653 0% 100%)"}; display:grid; place-items:center; box-shadow:0 8px 24px rgba(0,0,0,.2);"
      >
        <div style="width:112px; height:112px; border-radius:50%; background:#11182b; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
          <strong style="font-size:21px;">${totalFiles}</strong>
          <span class="muted" style="font-size:11px;">fichiers actifs</span>
        </div>
      </div>
      <div style="flex:1; min-width:190px;">
        ${categories.map((item, index) => {
          const percent = totalActiveBytes > 0 ? (item.bytes / totalActiveBytes) * 100 : 0;
          const colors = ["#438cff", "#8b72ff", "#24d6a0", "#f59e0b"];
          return `
            <div style="display:flex; align-items:center; gap:10px; margin:10px 0;">
              <span aria-hidden="true" style="width:12px; height:12px; flex:0 0 12px; border-radius:3px; background:${colors[index]};"></span>
              <div style="flex:1; min-width:0;">
                <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;">
                  <strong>${item.name}</strong>
                  <span class="muted">${percent.toFixed(1)} %</span>

                <div class="muted" style="font-size:12px;">${item.count} fichier(s) · ${formatBytes(item.bytes)}</div>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    </div>
    <h4 style="margin:8px 0 12px;">Détail par catégorie</h4>
    ${categories.map(item => {
      const percent = totalActiveBytes > 0 ? (item.bytes / totalActiveBytes) * 100 : 0;
      return `
        <div style="margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;">
            <strong>${item.name}</strong>
            <span class="muted">${item.count} fichier(s) · ${formatBytes(item.bytes)}</span>
          </div>
          <div class="progress" style="margin-top:6px;">
            <div class="progress-bar" style="width:${percent.toFixed(1)}%;"></div>
          </div>
        </div>
      `;
    }).join("")}
    ${renderStorageFolderStats()}

  `;
}

  list.innerHTML = `<div class="empty">Chargement des fichiers...</div>`;

  try {
    const data = await api("/storage");
    storageFilesCache = data.files || [];
    storageFoldersCache = data.folders || [];
    try {

      storageTrashCache = trashData.files || [];
    } catch (trashError) {
      storageTrashCache = [];

      trashButton.dataset.count = String(Number(data.trashCount || 0));
      trashButton.textContent = "🗑 Corbeille (" + Number(data.trashCount || 0) + ")";
    }

    const used = Number(data.used || 0);
    const limit = Number(data.limit || STORAGE_LIMIT_BYTES);
    storageQuotaLimit = limit > 0 ? limit : STORAGE_LIMIT_BYTES;
    const plan = data.plan || "free";
    const available = Number(data.available ?? Math.max(0, limit - used));
    const usagePercent = Number(data.usagePercent ?? (limit > 0 ? (used / limit) * 100 : 0));

    const usedElement = document.getElementById("storageUsed");
    const limitElement = document.getElementById("storageLimitLabel");
    const noticeElement = document.getElementById("storageUploadNotice");
    const countElement = document.getElementById("storageCount");
    const progress = document.getElementById("storageProgress");
    const percentElement = document.getElementById("storagePercent");

    if (usedElement) usedElement.textContent = formatBytes(used);

if (limitElement) {
  limitElement.textContent =
    "Sur " + formatBytes(limit) + " disponibles · Forfait " + plan.toUpperCase();
}

if (noticeElement) {
  noticeElement.textContent =
    "Limite : " + formatBytes(Number(data.maxFileSize || 0)) +
    " par fichier. Votre espace personnel est limité à " +
    formatBytes(limit) + ".";
}
    if (countElement) countElement.textContent = storageFilesCache.length;
    if (progress) progress.style.width = usagePercent.toFixed(1) + "%";

    if (percentElement) {
  percentElement.textContent = usagePercent.toFixed(1) + "% utilisé · " +
