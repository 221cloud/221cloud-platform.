
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d19">
<title>221Cloud — Votre espace numérique</title>

<style>
:root {
  --bg:#080d19;
  --panel:#111a2b;
  --panel2:#172238;
  --border:#26344c;
  --text:#f4f7fc;
  --muted:#94a3b8;
  --blue:#3985ff;
  --green:#20c997;
  --red:#ff647c;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}
button,input,select { font:inherit; }
button {
  cursor:pointer;
  border:0;
  border-radius:9px;
  padding:11px 15px;
  color:white;
  background:var(--blue);
  font-weight:600;
}
button:disabled { opacity:.5; cursor:not-allowed; }
input,select {
  width:100%;
  padding:12px;
  margin-top:7px;
  border:1px solid var(--border);
  border-radius:9px;
  background:#0b1424;
  color:white;
  outline:none;
}
input:focus,select:focus { border-color:var(--blue); }
label {
  display:block;
  margin-top:15px;
  color:#cbd5e1;
  font-size:14px;
}
.hidden { display:none !important; }
.muted { color:var(--muted); }
.brand {
  font-size:25px;
  font-weight:800;
  letter-spacing:-1px;
}
.brand span { color:var(--blue); }
.auth-screen {
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.auth-card {
  width:100%;
  max-width:420px;
  padding:28px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
}
.auth-card h1 { margin-bottom:8px; }
.auth-card button { width:100%; margin-top:20px; }
.auth-switch {
  margin-top:20px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}
.link {
  color:#69a4ff;
  cursor:pointer;
  background:none;
  padding:0;
}
.app { min-height:100vh; }
header {
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid var(--border);
  background:var(--panel);
  position:sticky;
  top:0;
  z-index:5;
}
.layout {
  display:flex;
  min-height:calc(100vh - 68px);
}
aside {
  width:235px;
  padding:22px 14px;
  border-right:1px solid var(--border);
  background:#0c1423;
  flex-shrink:0;
}
.nav-title {
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:12px;
}
.nav-btn {
  display:block;
  width:100%;
  text-align:left;
  background:transparent;
  color:#bdc9dc;
  margin-bottom:5px;
  font-weight:500;
}
.nav-btn.active,.nav-btn:hover {
  background:#1a2b47;
  color:white;
}
main {
  flex:1;
  padding:28px;
  min-width:0;
  max-width:1200px;
}
.page-title { font-size:25px; margin:0 0 8px; }
.page-subtitle { color:var(--muted); margin:0 0 25px; }
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:16px;
}
.card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:20px;
  margin-bottom:16px;
}
.stat { font-size:30px; font-weight:800; margin:12px 0 5px; }
.card h3 { margin:0 0 10px; }
.section-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin:25px 0 15px;
}
.item-card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:17px;
  margin-bottom:12px;
}
.item-card h3 { margin:0 0 8px; }
.item-actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}
.secondary { background:#26344c; color:#e2e8f0; }
.danger { background:#7d2639; }
.success-text { color:var(--green); }
.error-text { color:var(--red); }
.notice {
  padding:12px 14px;
  border-radius:9px;
  margin:15px 0;
  background:#172238;
  border:1px solid var(--border);
  color:#cbd5e1;
  font-size:14px;
}
.form-card { max-width:560px; }
.empty {
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
  background:var(--panel);
  border:1px dashed var(--border);
  border-radius:12px;
}
.status {
  display:inline-block;
  font-size:12px;
  padding:5px 9px;
  border-radius:20px;
  background:#26344c;
  color:#d5deed;
}
.status.online {
  color:#6ee7b7;
  background:#123b34;
}
.progress {
  width:100%;
  height:10px;
  background:#26344c;
  border-radius:20px;
  overflow:hidden;
  margin:12px 0;
}
.progress-bar {
  height:100%;
  width:0;
  background:var(--blue);
  transition:width .2s;
}
.file-name {
  overflow-wrap:anywhere;
  font-weight:600;
}
footer {
  color:var(--muted);
  font-size:12px;
  text-align:center;
  padding:25px;
}
@media(max-width:700px) {
  header { padding:0 15px; }
  .layout { display:block; }
  aside {
    width:100%;
    display:flex;
    overflow-x:auto;
    padding:8px;
    border-right:0;
    border-bottom:1px solid var(--border);
  }
  .nav-title { display:none; }
  .nav-btn {
    width:auto;
    white-space:nowrap;
    margin:0 4px;
    padding:10px;
  }
  main { padding:20px 15px; }
  .brand { font-size:21px; }
}
</style>
</head>

<body>

<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="brand">221<span>Cloud</span></div>
    <p class="muted">Votre espace numérique.</p>

    <div id="loginForm">
      <h1>Connexion</h1>
      <p class="muted">Connectez-vous à votre espace.</p>
      <label>Adresse e-mail</label>
      <input id="loginEmail" type="email" placeholder="nom@exemple.com">
      <label>Mot de passe</label>
      <input id="loginPassword" type="password" placeholder="Votre mot de passe">
      <button id="loginButton" onclick="login()">Se connecter</button>
      <div class="auth-switch">
        Pas encore de compte ?
        <button class="link" onclick="showAuthForm('register')">Créer un compte</button>
      </div>
    </div>

    <div id="registerForm" class="hidden">
      <h1>Créer un compte</h1>
      <p class="muted">Rejoignez 221Cloud.</p>
      <label>Nom complet</label>
      <input id="registerName" type="text" placeholder="Votre nom">
      <label>Adresse e-mail</label>
      <input id="registerEmail" type="email" placeholder="nom@exemple.com">
      <label>Mot de passe</label>
      <input id="registerPassword" type="password" placeholder="Minimum 12 caractères">
      <button id="registerButton" onclick="register()">Créer mon compte</button>
      <div class="auth-switch">
        Déjà inscrit ?
        <button class="link" onclick="showAuthForm('login')">Se connecter</button>
      </div>
    </div>
    <div id="authMessage" class="notice hidden"></div>
  </div>
</section>

<section id="appScreen" class="app hidden">
  <header>
    <div class="brand">221<span>Cloud</span></div>
    <button class="secondary" onclick="logout()">Déconnexion</button>
  </header>

  <div class="layout">
    <aside>
      <div class="nav-title">Espace client</div>
      <button class="nav-btn active" data-page="overview" onclick="showPage('overview')">⌂ Tableau de bord</button>
      <button class="nav-btn" data-page="projects" onclick="showPage('projects')">▣ Mes projets</button>
      <button class="nav-btn" data-page="databases" onclick="showPage('databases')">▤ Bases de données</button>
      <button class="nav-btn" data-page="storage" onclick="showPage('storage')">▧ Stockage cloud</button>
      <button class="nav-btn" data-page="hosting" onclick="showPage('hosting')">◎ Hébergement</button>
      <button class="nav-btn" data-page="applications" onclick="showPage('applications')">▦ Applications</button>
      <button class="nav-btn" data-page="account" onclick="showPage('account')">⚙ Mon compte</button>
    </aside>
    <main id="mainContent"></main>
  </div>
  <footer>221Cloud — Votre espace numérique</footer>
</section>

<script>
const API = "/api";
let currentUser = null;
let projectsCache = [];
let databasesCache = [];
let storageFilesCache = [];

const STORAGE_LIMIT_BYTES = 1024 * 1024 * 1024;
const MAX_FILE_SIZE_BYTES = 20 * 1024 * 1024;

async function api(path, options = {}) {
  const headers = { ...(options.headers || {}) };

  // Ne pas imposer JSON aux envois FormData.
  if (!(options.body instanceof FormData)) {
    headers["Content-Type"] = "application/json";
  }

  const response = await fetch(API + path, {
    credentials: "same-origin",
    ...options,
    headers
  });

  let data = {};
  try { data = await response.json(); } catch(e) {}

  if (!response.ok) {
    throw new Error(data.error || data.message || "Une erreur est survenue.");
  }
  return data;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function showMessage(message, type = "error") {
  const box = document.getElementById("authMessage");
  box.textContent = message;
  box.className = "notice " + (type === "success" ? "success-text" : "error-text");
  box.classList.remove("hidden");
}

function showAuthForm(form) {
  document.getElementById("loginForm").classList.toggle("hidden", form !== "login");
  document.getElementById("registerForm").classList.toggle("hidden", form !== "register");
  document.getElementById("authMessage").classList.add("hidden");
}

function setLoggedIn(user) {
  currentUser = user;
  document.getElementById("authScreen").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");
  showPage("overview");
}

async function register() {
  const name = document.getElementById("registerName").value.trim();
  const email = document.getElementById("registerEmail").value.trim();
  const password = document.getElementById("registerPassword").value;

  if (!name || !email || !password) {
    showMessage("Veuillez remplir tous les champs.");
    return;
  }
  if (password.length < 12) {
    showMessage("Le mot de passe doit contenir au moins 12 caractères.");
    return;
  }

  const button = document.getElementById("registerButton");
  button.disabled = true;
  button.textContent = "Création...";

  try {
    await api("/register", {
      method:"POST",
      body:JSON.stringify({
        full_name:name,
        name:name,
        email,
        password
      })
    });
    showMessage("Compte créé. Vous pouvez maintenant vous connecter.", "success");
    showAuthForm("login");
    document.getElementById("loginEmail").value = email;
  } catch(error) {
    showMessage(error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Créer mon compte";
  }
}

async function login() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  if (!email || !password) {
    showMessage("Veuillez saisir votre e-mail et votre mot de passe.");
    return;
  }

  const button = document.getElementById("loginButton");
  button.disabled = true;
  button.textContent = "Connexion...";

  try {
    const data = await api("/login", {
      method:"POST",
      body:JSON.stringify({email,password})
    });
    setLoggedIn(data.user || data);
  } catch(error) {
    showMessage(error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Se connecter";
  }
}

async function logout() {
  try {
    await api("/logout", {method:"POST",body:"{}"});
  } catch(error) {}
  currentUser = null;
  document.getElementById("appScreen").classList.add("hidden");
  document.getElementById("authScreen").classList.remove("hidden");
  showAuthForm("login");
}

async function checkSession() {
  try {
    const data = await api("/me");
    const user = data.user || data;
    if (user && user.id) setLoggedIn(user);
  } catch(error) {}
}

function showPage(page) {
  document.querySelectorAll(".nav-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.page === page);
  });

  if (page === "overview") renderOverview();
  else if (page === "projects") renderProjectsPage();
  else if (page === "databases") renderDatabasesPage();
  else if (page === "storage") renderStoragePage();
  else if (page === "hosting") renderPlaceholder("Hébergement web", "La gestion de vos hébergements sera ajoutée prochainement.");
  else if (page === "applications") renderPlaceholder("Applications", "La gestion de vos applications sera ajoutée prochainement.");
  else if (page === "account") renderAccount();
}

function renderOverview() {
  document.getElementById("mainContent").innerHTML = `
    <h1 class="page-title">Tableau de bord</h1>
    <p class="page-subtitle">Bienvenue dans votre espace 221Cloud.</p>
    <div class="grid">
      <div class="card">
        <div class="muted">Mes projets</div>
        <div class="stat" id="projectCount">—</div>
        <div class="muted">Projets enregistrés</div>
      </div>
      <div class="card">
        <div class="muted">Bases de données</div>
        <div class="stat" id="databaseCount">—</div>
        <div class="muted">Bases enregistrées</div>
      </div>
      <div class="card">
        <div class="muted">Statut de la plateforme</div>
        <div class="stat success-text">En ligne</div>
        <span class="status online">Opérationnel</span>
      </div>
    </div>
    <div class="section-head"><h2>Accès rapide</h2></div>
    <div class="grid">
      <div class="card">
        <h3>Mes projets</h3>
        <p class="muted">Créez et gérez vos projets numériques.</p>
        <button onclick="showPage('projects')">Ouvrir</button>
      </div>
      <div class="card">
        <h3>Bases de données</h3>
        <p class="muted">Organisez les bases associées à vos projets.</p>
        <button onclick="showPage('databases')">Ouvrir</button>
      </div>
      <div class="card">
        <h3>Stockage cloud</h3>
        <p class="muted">Enregistrez et gérez vos fichiers.</p>
        <button onclick="showPage('storage')">Ouvrir</button>
      </div>
    </div>
  `;
  loadOverviewCounts();
}

async function loadOverviewCounts() {
  try {
    const projects = await api("/projects");
    projectsCache = projects.projects || [];
    const element = document.getElementById("projectCount");
    if (element) element.textContent = projectsCache.length;
  } catch(error) {
    const element = document.getElementById("projectCount");
    if (element) element.textContent = "—";
  }

  try {
    const databases = await api("/databases");
    databasesCache = databases.databases || [];
    const element = document.getElementById("databaseCount");
    if (element) element.textContent = databasesCache.length;
  } catch(error) {
    const element = document.getElementById("databaseCount");
    if (element) element.textContent = "—";
  }
}

async function renderProjectsPage() {
  document.getElementById("mainContent").innerHTML = `
    <h1 class="page-title">Mes projets</h1>
    <p class="page-subtitle">Retrouvez et gérez vos projets numériques.</p>
    <div class="card form-card">
      <h3>Nouveau projet</h3>
      <label>Nom du projet</label>
      <input id="projectName" maxlength="100" placeholder="Exemple : Mon site web">
      <label>Type de projet</label>
      <select id="projectType">
        <option value="website">Site web</option>
        <option value="application">Application</option>
        <option value="database">Base de données</option>
        <option value="other">Autre</option>
      </select>
      <button onclick="createProject()">＋ Créer le projet</button>
      <div id="projectMessage"></div>
    </div>
    <div class="section-head">
      <h2>Mes projets enregistrés</h2>
      <span class="muted" id="projectTotal">Chargement...</span>
    </div>
    <div id="projectsList"></div>
  `;
  await loadProjects();
}

async function loadProjects() {
  const list = document.getElementById("projectsList");
  if (!list) return;
  list.innerHTML = `<div class="empty">Chargement des projets...</div>`;

  try {
    const data = await api("/projects");
    projectsCache = data.projects || [];
    renderProjects();
  } catch(error) {
    list.innerHTML = `<div class="notice error-text">${escapeHTML(error.message)}</div>`;
  }
}

function renderProjects() {
  const list = document.getElementById("projectsList");
  const total = document.getElementById("projectTotal");
  if (!list) return;

  if (total) total.textContent = projectsCache.length + " projet(s)";
  if (!projectsCache.length) {
    list.innerHTML = `<div class="empty">Aucun projet pour le moment.</div>`;
    return;
  }

  list.innerHTML = projectsCache.map(project => `
    <div class="item-card">
      <h3>${escapeHTML(project.name)}</h3>
      <div class="muted">${escapeHTML(projectTypeLabel(project.type))}</div>
      <p><span class="status">${escapeHTML(project.status || "pending")}</span></p>
      <div class="muted">Créé le : ${escapeHTML(formatDate(project.created_at))}</div>
      <div class="item-actions">
        <button class="secondary" onclick="editProject('${escapeHTML(project.id)}')">Modifier</button>
        <button class="danger" onclick="deleteProject('${escapeHTML(project.id)}')">Supprimer</button>
      </div>
    </div>
  `).join("");
}

function projectTypeLabel(type) {
  return ({
    website:"Site web",
    application:"Application",
    database:"Base de données",
    other:"Autre"
  })[type] || "Projet";
}

async function createProject() {
  const name = document.getElementById("projectName").value.trim();
  const type = document.getElementById("projectType").value;
  const message = document.getElementById("projectMessage");

  if (!name) {
    message.innerHTML = `<p class="error-text">Saisissez le nom du projet.</p>`;
    return;
  }

  try {
    await api("/projects", {
      method:"POST",
      body:JSON.stringify({name,type})
    });
    message.innerHTML = `<p class="success-text">Projet créé avec succès.</p>`;
    document.getElementById("projectName").value = "";
    await loadProjects();
  } catch(error) {
    message.innerHTML = `<p class="error-text">${escapeHTML(error.message)}</p>`;
  }
}

async function editProject(id) {
  const project = projectsCache.find(item => item.id === id);
  if (!project) return;

  const name = prompt("Nouveau nom du projet :", project.name);
  if (name === null) return;
  if (!name.trim()) {
    alert("Le nom ne peut pas être vide.");
    return;
  }

  try {
    await api("/projects/" + encodeURIComponent(id), {
      method:"PATCH",
      body:JSON.stringify({name:name.trim(),type:project.type})
    });
    await loadProjects();
  } catch(error) {
    alert(error.message);
  }
}

async function deleteProject(id) {
  if (!confirm("Voulez-vous vraiment supprimer ce projet ?")) return;
  try {
    await api("/projects/" + encodeURIComponent(id), {method:"DELETE"});
    await loadProjects();
  } catch(error) {
    alert(error.message);
  }
}

async function renderDatabasesPage() {
  document.getElementById("mainContent").innerHTML = `
    <h1 class="page-title">Bases de données</h1>
    <p class="page-subtitle">Retrouvez et gérez vos bases de données.</p>
    <div class="card form-card">
      <h3>Créer une base de données</h3>
      <label>Nom de la base</label>
      <input id="databaseName" maxlength="80" placeholder="Exemple : boutique_db">
      <label>Projet associé (facultatif)</label>
      <select id="databaseProject">
        <option value="">Aucun projet</option>
      </select>
      <button onclick="createDatabase()">＋ Créer la base</button>
      <div id="databaseMessage"></div>
    </div>
    <div class="notice">
      Les bases affichées ici sont des espaces logiques enregistrés dans 221Cloud.
      Elles ne correspondent pas encore à des instances de bases de données indépendantes.
    </div>
    <div class="section-head">
      <h2>Mes bases de données</h2>
      <span class="muted" id="databaseTotal">Chargement...</span>
    </div>
    <div id="databasesList"></div>
  `;
  await loadDatabases();
}

async function loadDatabases() {
  const list = document.getElementById("databasesList");
  if (!list) return;
  list.innerHTML = `<div class="empty">Chargement des bases...</div>`;

  try {
    const [databaseData, projectData] = await Promise.all([
      api("/databases"),
      api("/projects")
    ]);
    databasesCache = databaseData.databases || [];
    projectsCache = projectData.projects || [];

    const select = document.getElementById("databaseProject");
    if (select) {
      select.innerHTML = `<option value="">Aucun projet</option>` +
        projectsCache.map(project =>
          `<option value="${escapeHTML(project.id)}">${escapeHTML(project.name)}</option>`
        ).join("");
    }
    renderDatabases();
  } catch(error) {
    list.innerHTML = `<div class="notice error-text">${escapeHTML(error.message)}</div>`;
  }
}

function renderDatabases() {
  const list = document.getElementById("databasesList");
  const total = document.getElementById("databaseTotal");
  if (!list) return;

  if (total) total.textContent = databasesCache.length + " base(s)";
  if (!databasesCache.length) {
    list.innerHTML = `<div class="empty">Aucune base de données pour le moment.</div>`;
    return;
  }

  list.innerHTML = databasesCache.map(database => {
    const project = projectsCache.find(p => p.id === database.project_id);
    return `
      <div class="item-card">
        <h3>▤ ${escapeHTML(database.name)}</h3>
        <div class="muted">Projet associé : ${escapeHTML(project ? project.name : "Aucun")}</div>
        <div class="muted">Créée le : ${escapeHTML(formatDate(database.created_at))}</div>
        <div class="item-actions">
          <button class="danger" onclick="deleteDatabase('${escapeHTML(database.id)}')">Supprimer</button>
        </div>
      </div>
    `;
  }).join("");
}

async function createDatabase() {
  const name = document.getElementById("databaseName").value.trim();
  const project_id = document.getElementById("databaseProject").value || null;
  const message = document.getElementById("databaseMessage");

  if (!name) {
    message.innerHTML = `<p class="error-text">Saisissez le nom de la base.</p>`;
    return;
  }

  try {
    await api("/databases", {
      method:"POST",
      body:JSON.stringify({name,project_id})
    });
    message.innerHTML = `<p class="success-text">Base créée avec succès.</p>`;
    document.getElementById("databaseName").value = "";
    await loadDatabases();
  } catch(error) {
    message.innerHTML = `<p class="error-text">${escapeHTML(error.message)}</p>`;
  }
}

async function deleteDatabase(id) {
  if (!confirm("Voulez-vous vraiment supprimer cette base ?")) return;
  try {
    await api("/databases/" + encodeURIComponent(id), {method:"DELETE"});
    await loadDatabases();
  } catch(error) {
    alert(error.message);
  }
}

/* STOCKAGE CLOUD */

function formatBytes(bytes) {
  const value = Number(bytes) || 0;
  if (value < 1024) return value + " octet(s)";
  if (value < 1024 * 1024) return (value / 1024).toFixed(1) + " Ko";
  if (value < 1024 * 1024 * 1024) return (value / (1024 * 1024)).toFixed(1) + " Mo";
  return (value / (1024 * 1024 * 1024)).toFixed(2) + " Go";
}

function renderStoragePage() {
  document.getElementById("mainContent").innerHTML = `
    <h1 class="page-title">Stockage cloud</h1>
    <p class="page-subtitle">Stockez et gérez vos fichiers en toute simplicité.</p>

    <div class="grid">
      <div class="card">
        <div class="muted">Espace utilisé</div>
        <div class="stat" id="storageUsed">Chargement...</div>
        <div class="muted">sur 1 Go disponible</div>
        <div class="progress">
          <div class="progress-bar" id="storageProgress"></div>
        </div>
        <div class="muted" id="storagePercent">Calcul en cours...</div>
      </div>
      <div class="card">
        <div class="muted">Nombre de fichiers</div>
        <div class="stat" id="storageCount">—</div>
        <div class="muted">Fichiers enregistrés</div>
      </div>
      <div class="card">
        <div class="muted">Taille maximale</div>
        <div class="stat">20 Mo</div>
        <div class="muted">Par fichier</div>
      </div>
    </div>

    <div class="card form-card">
      <h3>＋ Envoyer un fichier</h3>

      <label>Sélectionner un fichier</label>

      <button id="uploadButton" onclick="uploadStorageFile()">Envoyer dans le cloud</button>
      <div id="uploadMessage"></div>
    </div>

    <div class="section-head">
      <h2>Mes fichiers</h2>
      <button class="secondary" onclick="loadStorageFiles()">Actualiser</button>
    </div>
    <div id="storageFilesList">
      <div class="empty">Chargement des fichiers...</div>
    </div>
  `;

  loadStorageFiles();
}

async function loadStorageFiles() {
  const list = document.getElementById("storageFilesList");
  if (!list) return;
  list.innerHTML = `<div class="empty">Chargement des fichiers...</div>`;

  try {
    const data = await api("/storage");
    storageFilesCache = data.files || [];

    const used = Number(data.used || 0);
    const limit = Number(data.limit || STORAGE_LIMIT_BYTES);
    const percent = limit > 0 ? Math.min(100, (used / limit) * 100) : 0;

    const usedElement = document.getElementById("storageUsed");
    const countElement = document.getElementById("storageCount");
    const progress = document.getElementById("storageProgress");
    const percentElement = document.getElementById("storagePercent");

    if (usedElement) usedElement.textContent = formatBytes(used);
    if (countElement) countElement.textContent = storageFilesCache.length;
    if (progress) progress.style.width = percent.toFixed(1) + "%";
    if (percentElement) {
      percentElement.textContent = percent.toFixed(1) + "% utilisé · " +
        formatBytes(Math.max(0, limit - used)) + " disponible";
    }

    renderStorageFiles();
  } catch(error) {
    list.innerHTML = `<div class="notice error-text">${escapeHTML(error.message)}</div>`;
  }
}

function renderStorageFiles() {
  const list = document.getElementById("storageFilesList");
  if (!list) return;

  if (!storageFilesCache.length) {
    list.innerHTML = `<div class="empty">Aucun fichier pour le moment. Envoyez votre premier fichier dans le cloud.</div>`;
    return;
  }

  list.innerHTML = storageFilesCache.map(file => `
    <div class="item-card">
      <div class="file-name">${escapeHTML(file.file_name || "Fichier sans nom")}</div>
      <p class="muted">${escapeHTML(formatBytes(file.file_size))} · ${escapeHTML(file.mime_type || "Fichier")}</p>
      <div class="muted">Ajouté le : ${escapeHTML(formatDate(file.created_at))}</div>
      <div class="item-actions">
        <button class="secondary" onclick="downloadStorageFile('${escapeHTML(file.id)}')">Télécharger</button>
        <button class="danger" onclick="deleteStorageFile('${escapeHTML(file.id)}')">Supprimer</button>
      </div>
    </div>
  `).join("");
}

async function uploadStorageFile() {
  const input = document.getElementById("storageFileInput");
  const message = document.getElementById("uploadMessage");
  const button = document.getElementById("uploadButton");
  const file = input?.files?.[0];

  if (!file) {
    message.innerHTML = `<p class="error-text">Veuillez sélectionner un fichier.</p>`;
    return;
  }

  if (file.size > MAX_FILE_SIZE_BYTES) {
    message.innerHTML = `<p class="error-text">Ce fichier dépasse la limite de 20 Mo.</p>`;
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  button.disabled = true;
  button.textContent = "Envoi en cours...";
  message.innerHTML = `<p class="muted">Envoi de ${escapeHTML(file.name)}...</p>`;

  try {
    await api("/storage/upload", {
      method:"POST",
      body:formData
    });
    message.innerHTML = `<p class="success-text">Fichier envoyé avec succès !</p>`;
    input.value = "";
    await loadStorageFiles();
  } catch(error) {
    message.innerHTML = `<p class="error-text">${escapeHTML(error.message)}</p>`;
  } finally {
    button.disabled = false;
    button.textContent = "Envoyer dans le cloud";
  }
}

async function downloadStorageFile(id) {
  try {
    const response = await fetch(API + "/storage/" + encodeURIComponent(id) + "/download", {
      credentials:"same-origin"
    });

    if (!response.ok) {
      let data = {};
      try { data = await response.json(); } catch(e) {}
      throw new Error(data.error || "Impossible de télécharger ce fichier.");
    }

    const blob = await response.blob();
    const file = storageFilesCache.find(item => item.id === id);
    const fileName = file?.file_name || "fichier";

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  } catch(error) {
    alert(error.message);
  }
}

async function deleteStorageFile(id) {
  if (!confirm("Voulez-vous vraiment supprimer ce fichier du cloud ?")) return;

  try {
    await api("/storage/" + encodeURIComponent(id), {method:"DELETE"});
    await loadStorageFiles();
  } catch(error) {
    alert(error.message);
  }
}

function formatDate(value) {
  if (!value) return "Date inconnue";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return date.toLocaleDateString("fr-FR");
}
