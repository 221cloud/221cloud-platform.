async function restoreWebsiteDeployment(projectId, sourceDeploymentId) {
  let pendingDeploymentId = null;
  try {
    const hostingData = await api("/projects/" + encodeURIComponent(projectId) + "/hosting");
    const sourceDeployment = (hostingData.deployments || []).find(item => item.id === sourceDeploymentId);
    if (!sourceDeployment || sourceDeployment.status !== "published") {
      throw new Error("Cette ancienne version n'est plus disponible pour restauration.");
    }
    if (hostingData.hosting?.active_deployment_id === sourceDeploymentId) {
      alert("Cette version est déjà celle qui est publiée actuellement.");
      return;
    }

    const fileData = await api(
      "/projects/" + encodeURIComponent(projectId) + "/deployments/" +
      encodeURIComponent(sourceDeploymentId) + "/files"
    );
    const files = Array.isArray(fileData.files) ? fileData.files : [];
    if (!files.length) throw new Error("Cette ancienne version ne contient aucun fichier.");
    if (!files.some(file => String(file.file_path || "") === "index.html")) {
      throw new Error("Cette ancienne version ne contient pas index.html à la racine. Elle ne peut pas être restaurée.");
    }

    const totalBytes = files.reduce((sum, file) => sum + Math.max(0, Number(file.file_size) || 0), 0);
    const fileList = files.slice(0, 20).map(file =>
      "• " + file.file_path + " (" + formatBytes(Number(file.file_size) || 0) + ")"
    ).join("\n");
    const moreFiles = files.length > 20 ? "\n… et " + (files.length - 20) + " autre(s)" : "";
    const createdLabel = formatDate(sourceDeployment.created_at);
    const preview =
      "APERÇU — RESTAURATION D'UNE ANCIENNE VERSION\n\n" +
      "Version sélectionnée : " + sourceDeploymentId + "\n" +
      "Créée le : " + createdLabel + "\n" +
      "Fichiers à restaurer : " + files.length + "\n" +
      "Volume à recopier : " + formatBytes(totalBytes) + "\n\n" +
      "FICHIERS DE CETTE VERSION :\n" + fileList + moreFiles + "\n\n" +
      "Cette restauration remettra exactement les fichiers de la version sélectionnée en ligne. " +
      "La version actuellement publiée sera conservée dans l'historique et ne sera remplacée qu'au moment de la publication.";
    if (!confirm(preview + "\n\nContinuer la préparation ?")) return;
    if (!confirm(
      "CONFIRMATION FINALE\n\n" +
      "221Cloud va créer une nouvelle version, recopier les " + files.length +
      " fichiers de la version choisie, puis la publier.\n\n" +
      "Le site actuel restera en ligne jusqu'à la publication finale. Confirmer la restauration ?"
    )) return;

    const created = await api(
      "/projects/" + encodeURIComponent(projectId) + "/deployments",
      { method: "POST" }
    );
    pendingDeploymentId = created.deployment?.id;
    if (!pendingDeploymentId) throw new Error("Impossible de préparer la nouvelle version.");

    const cloned = await api(
      "/projects/" + encodeURIComponent(projectId) + "/deployments/" +
      encodeURIComponent(pendingDeploymentId) + "/clone-active",
      {
        method: "POST",
        body: JSON.stringify({ source_deployment_id: sourceDeploymentId })
      }
    );
    if (Number(cloned.cloned) !== files.length) {
      throw new Error("La copie des fichiers est incomplète (" + Number(cloned.cloned || 0) +
        "/" + files.length + "). La version actuelle n'a pas été remplacée.");
    }

    const published = await api(
      "/projects/" + encodeURIComponent(projectId) + "/deployments/" +
      encodeURIComponent(pendingDeploymentId) + "/publish",
      { method: "POST" }
    );
    pendingDeploymentId = null;
    alert(
      "Ancienne version restaurée avec succès.\n\n" +
      "Fichiers restaurés : " + files.length + "\n" +
      "Volume recopié : " + formatBytes(totalBytes) + "\n" +
      "Nouvelle version publiée : " + published.deployment.id + "\n\n" +
      "Les versions précédentes sont conservées dans l'historique."
    );
    await renderHostingPage();
  } catch (error) {
    let cleanup = "";
    if (pendingDeploymentId) {
      try {
        const currentHosting = await api("/projects/" + encodeURIComponent(projectId) + "/hosting");
        if (currentHosting.hosting?.active_deployment_id === pendingDeploymentId) {
          cleanup = "\nLa nouvelle version a bien été publiée.";
        } else {
          await api(
            "/projects/" + encodeURIComponent(projectId) + "/deployments/" +
            encodeURIComponent(pendingDeploymentId),
            { method: "DELETE" }
          );
          cleanup = "\nLa préparation incomplète a été annulée automatiquement.";
        }
      } catch (cleanupError) {
        cleanup = "\nLa préparation n'a pas pu être nettoyée automatiquement. Le site actuellement publié reste prioritaire.";
      }
    }
    alert("Restauration impossible : " + error.message + cleanup);
    await renderHostingPage();
  }
}

async function renameApplication(id) {
  const application = projectsCache.find(item => item.id === id && item.type === "application");
  if (!application) return;

  const name = prompt("Nouveau nom de l'application :", application.name);
  if (name === null) return;
  if (!name.trim()) {
    alert("Le nom ne peut pas être vide.");

  try {
    await api("/projects/" + encodeURIComponent(id), {
      method: "PATCH",
      body: JSON.stringify({ name: name.trim(), type: "application" })
    });
    await loadApplications();
  } catch (error) {
    alert(error.message);
  }
}

async function moveApplicationToTrash(id) {

async function loadApplicationPublication() {

  const status = document.getElementById("applicationPublicationStatus");

  const button = document.getElementById("publishApplicationButton");

    if (status) status.textContent = error.message;

async function publishApplication() {
  if (!applicationEditorState) return;
  const editor = document.getElementById("applicationCodeEditor");
  if (editor) applicationEditorState.files[applicationEditorState.activeFile] = editor.value;
  const changedFiles = ["index.html", "style.css", "script.js"].filter(fileName =>
    applicationEditorState.files[fileName] !== applicationEditorState.savedFiles[fileName]
  );
  if (changedFiles.length) {
    alert("Enregistrez d'abord vos modifications avant de publier. Fichiers modifiés : " + changedFiles.join(", "));
    return;
  }
  const confirmed = confirm("Publier la dernière version enregistrée de cette application ? Si elle est déjà en ligne, la nouvelle version remplacera la version active. Les versions publiées précédentes resteront conservées.");
  if (!confirmed) return;
  const button = document.getElementById("publishApplicationButton");
  const status = document.getElementById("applicationPublicationStatus");
  const previousButtonText = button ? button.textContent : "Publier l'application";
  if (button) {
    button.disabled = true;
    button.textContent = "Publication...";
  }
  if (status) status.textContent = "Préparation de la publication...";
  try {
    const result = await api("/projects/" + encodeURIComponent(applicationEditorState.projectId) + "/application-publication", {
      method: "POST",
      body: JSON.stringify({})
    });
    if (status) status.textContent = result.message + " · Version " + Number(result.publication.version_number);
    await loadApplicationPublication();
    if (status && result.message) status.textContent = result.message + " · Version " + Number(result.publication.version_number);
    alert("Application publiée avec succès. Son adresse publique est affichée dans la section Publication.");
  } catch (error) {
    if (status) status.textContent = error.message;
  } finally {
    if (button) {
      button.disabled = false;
      if (button.textContent === "Publication...") button.textContent = previousButtonText;
    }
  }
}

function renderApplicationEditorFile() {
  if (!applicationEditorState) return;
  const tabs = document.getElementById("applicationFileTabs");
  const editor = document.getElementById("applicationCodeEditor");
  if (!tabs || !editor) return;
  const fileNames = ["index.html", "style.css", "script.js"];
  tabs.innerHTML = fileNames.map(name =>
    "<button type=\"button\" class=\"" + (applicationEditorState.activeFile === name ? "primary-btn" : "secondary") +
    "\" onclick=\"selectApplicationEditorFile(" + escapeJSAttribute(name) + ")\">" + name + "</button>"
  ).join("");
  editor.value = applicationEditorState.files[applicationEditorState.activeFile] || "";
  loadApplicationFileVersions();
}

function selectApplicationEditorFile(fileName) {
  if (!applicationEditorState || !["index.html", "style.css", "script.js"].includes(fileName)) return;
  const editor = document.getElementById("applicationCodeEditor");
  if (editor) applicationEditorState.files[applicationEditorState.activeFile] = editor.value;
  applicationEditorState.activeFile = fileName;
  renderApplicationEditorFile();
}

async function saveApplicationFiles() {
  if (!applicationEditorState) return;
  const editor = document.getElementById("applicationCodeEditor");
  const button = document.getElementById("saveApplicationFilesButton");
  const status = document.getElementById("applicationSaveStatus");
  if (editor) applicationEditorState.files[applicationEditorState.activeFile] = editor.value;
  const changedFiles = ["index.html", "style.css", "script.js"].filter(fileName =>
    applicationEditorState.files[fileName] !== applicationEditorState.savedFiles[fileName]
  );
  if (!changedFiles.length) {
    if (status) status.textContent = "Aucune modification à enregistrer.";
    return;
  }
  if (button) {
    button.disabled = true;
    button.textContent = "Enregistrement...";
  }
  if (status) status.textContent = "Sauvegarde et création des versions...";
  try {
    for (const fileName of changedFiles) {
      await api("/projects/" + encodeURIComponent(applicationEditorState.projectId) + "/application-files/" + encodeURIComponent(fileName), {
        method: "PUT",
        body: JSON.stringify({ content: applicationEditorState.files[fileName] || "" })
      });
      applicationEditorState.savedFiles[fileName] = applicationEditorState.files[fileName];
    }
    if (status) status.textContent = changedFiles.length + " fichier(s) enregistré(s). Nouvelle(s) version(s) conservée(s).";
    await loadApplicationFileVersions();
  } catch (error) {
    if (status) status.textContent = error.message;
  } finally {
    if (button) {
      button.disabled = false;
      button.textContent = "Enregistrer tous les fichiers";
    }
  }
}

async function loadApplicationFileVersions() {
  if (!applicationEditorState) return;
  const container = document.getElementById("applicationVersionHistory");
  if (!container) return;
  const fileName = applicationEditorState.activeFile;
  container.innerHTML = "<p class=\"muted\">Chargement de l'historique de " + escapeHTML(fileName) + "...</p>";
  try {
    const data = await api("/projects/" + encodeURIComponent(applicationEditorState.projectId) +
      "/application-files/" + encodeURIComponent(fileName) + "/versions");
    if (!applicationEditorState || applicationEditorState.activeFile !== fileName) return;
    const versions = Array.isArray(data.versions) ? data.versions : [];
    if (!versions.length) {
      container.innerHTML = "<p class=\"muted\">Aucune version enregistrée pour ce fichier.</p>";
      return;
    }
    container.innerHTML = "<p class=\"muted\">Historique de " + escapeHTML(fileName) + "</p>" +
      versions.map(version =>
        "<div class=\"item-card\"><div class=\"storage-file-heading\"><div class=\"storage-file-details\">" +
        "<strong>Version " + escapeHTML(String(version.version_number)) + "</strong>" +
        "<div class=\"muted\">" + escapeHTML(formatDate(version.created_at)) + " · " +
        Math.max(0, Math.ceil(Number(version.size || 0) / 1024)) + " Ko</div></div>" +
        "<button class=\"secondary\" type=\"button\" onclick=\"restoreApplicationFileVersion(" +
        escapeJSAttribute(version.id) + ", " + Number(version.version_number) + ")\">Restaurer</button></div></div>"
      ).join("");
  } catch (error) {
    if (applicationEditorState && applicationEditorState.activeFile === fileName) {
      container.innerHTML = "<p class=\"error-text\">" + escapeHTML(error.message) + "</p>";
    }
  }
}

async function restoreApplicationFileVersion(versionId, versionNumber) {
  if (!applicationEditorState) return;
  const fileName = applicationEditorState.activeFile;
  if (!confirm("Restaurer la version " + versionNumber + " de " + fileName + " ? Le contenu actuel de ce fichier dans l'éditeur sera remplacé. La version actuelle enregistrée sera conservée dans l'historique.")) return;
  const status = document.getElementById("applicationSaveStatus");
  if (status) status.textContent = "Restauration en cours...";
  try {
    const data = await api("/projects/" + encodeURIComponent(applicationEditorState.projectId) +
      "/application-files/" + encodeURIComponent(fileName) + "/restore", {
        method: "POST",
        body: JSON.stringify({ version_id: versionId })
      });
    applicationEditorState.files[fileName] = data.file.content || "";
    applicationEditorState.savedFiles[fileName] = data.file.content || "";
    renderApplicationEditorFile();
    refreshApplicationPreview();
    if (status) status.textContent = "Version " + versionNumber + " restaurée. Une nouvelle version a été créée.";
  } catch (error) {
    if (status) status.textContent = error.message;
  }
}

function refreshApplicationPreview() {
  if (!applicationEditorState) return;
  const editor = document.getElementById("applicationCodeEditor");
  if (editor) applicationEditorState.files[applicationEditorState.activeFile] = editor.value;
  const frame = document.getElementById("applicationPreviewFrame");
  if (!frame) return;
  let html = applicationEditorState.files["index.html"] || "";
  const css = (applicationEditorState.files["style.css"] || "").replace(/<\/style/gi, "<\\/style");
  const js = (applicationEditorState.files["script.js"] || "").replace(/<\/script/gi, "<\\/script");
  html = html.replace(/<link\b[^>]*href=["']style\.css["'][^>]*>/i, "");
  html = html.replace(/<script\b[^>]*src=["']script\.js["'][^>]*>\s*<\/script>/i, "");
  const styleTag = "<style>" + css + "</style>";
  const scriptTag = "<script>" + js + "<\/script>";
  if (/<\/head>/i.test(html)) html = html.replace(/<\/head>/i, styleTag + "</head>");
  else html = styleTag + html;
  if (/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, scriptTag + "</body>");
  else html += scriptTag;
  frame.srcdoc = html;
}

async function loadAccountSessionInfo() {
  const container = document.getElementById("accountSessionInfo");
  if (!container) return;

  container.textContent = "Actualisation...";
  try {
    const result = await api("/account/session-info");
    const formatSessionDate = value => {
      const date = new Date(value);
      return Number.isNaN(date.getTime())
        ? "Indisponible"
        : date.toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" });
    };
    container.innerHTML = `
      <p><strong>Dernière activité enregistrée :</strong><br>${escapeHTML(formatSessionDate(result.last_activity_at))}</p>
      <p><strong>Expiration estimée :</strong><br>${escapeHTML(formatSessionDate(result.expires_at))}</p>
      <p class="muted">La session expire après ${Number(result.idle_timeout_minutes) || 60} minutes sans activité.</p>
    `;
  } catch (error) {
    container.innerHTML = '<p class="error-text">' + escapeHTML(error.message || "Impossible de charger la session.") + '</p>';
  }
}

async function loadAccountSecurityLog() {
  const container = document.getElementById("accountSecurityLog");
  const loginContainer = document.getElementById("accountLoginHistory");
  if (!container && !loginContainer) return;

  try {
    const result = await api("/account/security-log");
    const events = Array.isArray(result.events) ? result.events : [];
    const loginEvents = events.filter(event => ["login", "new_environment_login"].includes(event.action));

    if (loginContainer) {
      if (!loginEvents.length) {
        loginContainer.innerHTML = "<p>Aucune connexion enregistrée pour le moment.</p>";
      } else {
        loginContainer.innerHTML = loginEvents.map(event => {
          const isNew = event.action === "new_environment_login";
          const title = isNew ? "Nouvel environnement détecté" : "Environnement déjà connu";
          const marker = isNew
            ? '<span class="status" style="background:#7d2639;color:#fff">À vérifier</span>'
            : '<span class="status online">Connu</span>';
          return `
            <div class="activity-item" style="padding:12px 0;border-bottom:1px solid var(--border-color, #e5e7eb)">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
                <strong>${escapeHTML(title)}</strong>${marker}
              </div>
              <div class="muted">${escapeHTML(event.device_info || "Navigateur inconnu")} · ${escapeHTML(formatDate(event.created_at))}</div>
              <div class="muted">${escapeHTML(event.description || "")}</div>
            </div>
          `;
        }).join("");
      }
    }

    if (container) {
      if (!events.length) {
        container.innerHTML = "<p>Aucune activité de sécurité enregistrée pour le moment.</p>";
        return;
      }

      const labels = {
        login: "Connexion réussie",
        new_environment_login: "Connexion depuis un nouvel environnement",
        logout: "Déconnexion",
        password_change: "Mot de passe modifié",
        sessions_revoked: "Autres sessions déconnectées"
      };

      container.innerHTML = events.map(event => {
        const title = labels[event.action] || "Activité du compte";
        return `
          <div class="activity-item" style="padding:12px 0;border-bottom:1px solid var(--border-color, #e5e7eb)">
            <strong>${escapeHTML(title)}</strong>
            <div class="muted">${escapeHTML(event.description || "")}</div>
            <div class="muted">${escapeHTML(event.device_info || "Navigateur inconnu")} · ${escapeHTML(formatDate(event.created_at))}</div>
          </div>
        `;
      }).join("");
    }
  } catch (error) {
    const message = escapeHTML(error.message || "Impossible de charger les activités.");
    if (container) container.innerHTML = '<p class="error-text">' + message + '</p>';
    if (loginContainer) loginContainer.innerHTML = '<p class="error-text">' + message + '</p>';
  }
}

async function changeAccountPassword(event) {
  event.preventDefault();

  const currentInput = document.getElementById("accountCurrentPassword");
  const newInput = document.getElementById("accountNewPassword");
  const confirmInput = document.getElementById("accountConfirmPassword");
  const message = document.getElementById("accountPasswordMessage");

  if (newInput.value !== confirmInput.value) {
    message.innerHTML = '<p class="error-text">Les deux nouveaux mots de passe ne correspondent pas.</p>';
    return;
  }

  const submitButton = event.submitter;
  if (submitButton) submitButton.disabled = true;

  try {
    const result = await api("/account/password", {
      method: "POST",
      body: JSON.stringify({
        current_password: currentInput.value,
        new_password: newInput.value
      })
    });

    message.innerHTML = '<p class="success-text">' + escapeHTML(result.message) + '</p>';
    currentInput.value = "";
    newInput.value = "";
    confirmInput.value = "";
  } catch (error) {
    message.innerHTML = '<p class="error-text">' + escapeHTML(error.message) + '</p>';
  } finally {
    if (submitButton) submitButton.disabled = false;
  }
}

    };

    const plan = plans[subscription.plan] || plans.free;
    const limits = data.limits || { storage_bytes: 0, projects: 0 };
    const usage = data.usage || { storage_bytes: 0, projects: 0 };
    const history = Array.isArray(data.history) ? data.history : [];
    const statusKey = String(subscription.status || "inconnu").toLowerCase();
    const statusLabels = {
      active: "Actif",
      expired: "Expiré",
      cancelled: "Annulé",
      canceled: "Annulé",
      pending: "En attente",
      inactive: "Inactif"
    };
    const statusLabel = statusLabels[statusKey] || statusKey;
    const statusClass = statusKey === "active" ? "online" : "offline";

    main.innerHTML = `
      <h1 class="page-title">Mon abonnement</h1>
      <p class="page-subtitle">Gérez votre forfait et découvrez nos offres.</p>

      <div class="card">
        <div class="muted">Votre abonnement actuel</div>
        <h2>${escapeHTML(plan.name)}</h2>
        <span class="status ${statusClass}">● ${escapeHTML(statusLabel)}</span>
        <p>${escapeHTML(plan.description)}</p>
        <div class="grid">
          <div>
            <h3>${plan.storage}</h3>
            <p class="muted">Stockage prévu</p>
          </div>
          <div>
            <h3>${plan.projects}</h3>
            <p class="muted">Projets autorisés</p>
          </div>
        </div>
        <div class="section-head">
          <h3>Détails de l'abonnement</h3>
        </div>
        <div class="grid">
          <div>
            <strong>${escapeHTML(formatDate(subscription.started_at))}</strong>
            <p class="muted">Date de début</p>
          </div>
          <div>
            <strong>${escapeHTML(subscription.expires_at ? formatDate(subscription.expires_at) : "Aucune expiration prévue")}</strong>
            <p class="muted">Date d'expiration</p>
          </div>
        </div>
        <div class="section-head">
          <h3>Votre consommation actuelle</h3>
        </div>
        <p>Stockage : <strong>${formatBytes(usage.storage_bytes)}</strong> utilisé sur <strong>${formatBytes(limits.storage_bytes)}</strong></p>
        <p>Projets : <strong>${Number(usage.projects || 0)}</strong> utilisé(s) sur <strong>${Number(limits.projects || 0)}</strong></p>
      </div>

      <div class="section-head">
        <h2>Historique des abonnements</h2>
      </div>
      <div class="card">
        ${history.length ? history.map((item, index) => {
          const historyPlan = plans[item.plan] || { name: item.plan || "Forfait inconnu" };
          return `
            <div class="section-head">
              <div>
                <strong>${escapeHTML(historyPlan.name)}</strong>
                <p class="muted">Statut : ${escapeHTML(item.status || "inconnu")}</p>
              </div>
              <span class="muted">${escapeHTML(formatDate(item.started_at || item.created_at))}</span>
            </div>
            <p class="muted">Fin : ${escapeHTML(item.expires_at ? formatDate(item.expires_at) : "Aucune date prévue")}</p>
            ${index < history.length - 1 ? '<hr>' : ''}
          `;
        }).join("") : '<p class="muted">Aucun historique disponible pour le moment.</p>'}
      </div>

      <div class="section-head">
        <h2>Nos offres</h2>
      </div>

      <div class="grid">
        <div class="card">
          <h3>Free</h3>
          <h2>Gratuit</h2>
          <p>1 Go de stockage</p>
          <p>1 projet</p>
          <button disabled>Votre offre</button>
        </div>

        <div class="card">
          <h3>Starter</h3>
          <h2>5 Go</h2>
          <p>5 projets</p>
          <p>Pour commencer à développer.</p>
          <button disabled>Bientôt disponible</button>
        </div>

        <div class="card">
          <h3>Pro</h3>
          <h2>20 Go</h2>
          <p>20 projets</p>
          <p>Pour aller plus loin.</p>
          <button disabled>Bientôt disponible</button>
        </div>
      </div>

      <p class="muted">Les capacités des offres sont indicatives et pourront évoluer. Les offres payantes ne sont pas encore disponibles.</p>
    `;
  } catch (error) {
    main.innerHTML = `
      <h1 class="page-title">Mon abonnement</h1>
      <div class="card">
        <p>Impossible de charger votre abonnement.</p>
        <p class="muted">${escapeHTML(error.stack || error.message)}</p>
        <button onclick="renderSubscriptionPage()">Réessayer</button>
      </div>
    `;
  }
}

function formatDate(value) {
  if (!value) return "Date inconnue";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return date.toLocaleDateString("fr-FR");
}

checkSession();
</script>
</body>
</html>
